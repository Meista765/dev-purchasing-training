샘플과 한도 견본: 색 판정의 기준물", "aliases": ["색 기준판", "마스터 색 견본", "master color standard", "작업용 색 견본", "working color standard", "색 한도 견본"], "stage": "s5", "lens": "qual", "order": 1, "kind": "tool", "oneLiner": "색 마스터 샘플은 모든 색 판정의 원본 기준판이고, 작업용 견본과 한도 견본은 그 복사본으로 쓰는 판정 도구이며, 삼자가 같은 판을 같은 조건으로 보관해야 기준이 선다.", "body": "색 판정은 '무엇과 비교하나'가 정해져야 시작된다. 색 번호(RAL·먼셀)나 인쇄 색표는 도료와 바탕·광택·질감이 달라 그대로 판정 기준이 되지 못한다(Talbert 5장). 그래서 실제 도료로 칠한 **기준판**을 기준으로 삼는다. 이 기준판 관리가 곧 도료의 **로트 관리 기준**이다. 도료사 출하 측색, 도장 업체 초품 검사, 우리 수입검사가 모두 같은 판을 기준으로 해야 숫자가 이어진다.\n\n기준판은 층을 나눈다.\n- **마스터 샘플**(master standard): 승인 때 정한 원본이다. 평소에는 꺼내지 않고, 작업용 견본을 점검하거나 분쟁을 가릴 때만 쓴다.\n- **작업용 견본**(working standard): 마스터와 대조해 만든 복사본으로 날마다 쓴다. 예비 견본을 하나 더 두었다가 손상되면 바꾼다.\n- **한도 견본**: 허용 범위의 끝을 보여 주는 판이다. 밝은 쪽·어두운 쪽, 필요하면 붉은·노란 쪽처럼 방향별로 만들어 측색 허용값과 육안 판정을 맞춘다.\n\n기준판은 실제 부품과 **소재·전처리·광택·질감을 맞춘** 판이어야 한다. 무광 부품을 유광 기준판과 비교하면 같은 도료라도 달라 보인다. 판 뒷면과 대장에는 색 이름, 도료사·품번·로트, 제작일, 측정값(L*a*b*·광택), 유효기간, 서명을 적는다.\n\n기준판도 변한다. 빛·열·습기에 바래고 손때와 흠이 생긴다. 빛이 들지 않는 곳에 보관하고(Talbert 10장), 정해진 주기마다 마스터와 대조해 측정값이 벗어나면 다시 만든다. 새 판은 마스터 측정값을 기준으로 만들어 다시 승인한다.\n\n마지막으로 **누가 같은 판을 갖고 있나**를 정한다. 발주사·도장 업체·도료사가 같은 날 함께 만든 판을 나눠 보관해야 한다. 한 곳만 판을 새로 만들면 어느새 세 회사의 기준이 서로 다른 색이 된다. 마스터 샘플의 일반 개념은 실무편 승인 판정 카드와 같고, 도료편에서는 도료 로트를 판정하는 기준이라는 점이 다르다.", "keyPoints": ["색 번호·인쇄 색표가 아니라 실제 도료로 칠한 기준판이 판정 기준이다", "마스터 샘플(원본) → 작업용 견본(복사본·예비) → 한도 견본(허용 범위의 끝)으로 층을 나눈다", "기준판은 부품과 소재·광택·질감을 맞추고 측정값·로트·유효기간을 적는다", "빛이 들지 않는 곳에 보관하고 정해진 주기로 마스터와 대조해 갱신한다", "발주사·도장 업체·도료사가 같은 판을 나눠 가져야 로트 판정이 이어진다"], "tables": [{"caption": "색 기준판 대장 항목 예(예시값)", "header": ["항목", "예시", "왜 필요한가"], "rows": [["색 이름·번호", "외장 회색 G-12(가상)", "비슷한 색의 다른 판과 구분"], ["도료사·품번·로트", "A 도료사, 가상 품번, 로트 B26-0612", "기준판을 만든 도료를 추적"], ["소재·광택·질감", "냉연 강판·인산염 처리, 60° 광택 85GU", "부품과 같은 조건인지 확인"], ["측정값", "D65/10°, L* 62.40, a* −0.85, b* 1.20", "갱신·대조 때 비교 기준"], ["제작일·유효기간", "2026-03-02, 1년", "대조·교체 시점"], ["보유처", "발주사·도장 업체·도료사 각 1장, 예비 1장", "삼자 기준 일치"]]}], "checks": ["수입검사·도장 업체·도료사가 쓰는 작업용 견본이 같은 마스터에서 만든 것인지 대장으로 확인한다", "기준판의 소재·광택·질감이 실제 부품과 같은지 본다", "기준판 대장에 측정값(L*a*b*·광택), 제작일, 유효기간, 보유처가 적혀 있는지 확인한다", "기준판이 빛이 들지 않는 곳에 보관되는지, 유효기간이 지난 판을 쓰고 있지 않은지 검사실과 도장 업체에서 본다", "기준판을 다시 만들 때 마스터 측정값과 대조해 새 판을 다시 승인했는지 확인한다"], "example": "예를 들어 A사 수입검사는 같은 작업용 견본으로 1년 넘게 판정해 왔는데, 도장 업체가 갑자기 색 불합격을 여러 번 냈다. 확인해 보니 도장 업체 견본은 창가 벽에 걸려 있어 마스터 대비 ΔE*ab 1.3만큼 바래 있었다. 양쪽 견본을 마스터에서 새로 만들고, 보관함과 교체 주기를 정했다(가상 사례).", "media": [{"type": "image", "file": "r5-color-master-01.svg", "caption": "마스터 샘플은 원본, 작업용 견본은 날마다 쓰는 복사본, 한도 견본은 허용 범위의 끝이다. **같은 마스터에서 만든 판을 삼자가 나눠 가져야** 로트 판정 숫자가 이어진다(개념도).", "alt": "맨 위에 마스터 샘플 상자가 있고, 아래로 화살표가 이어져 발주사, 도장 업체, 도료사 세 곳의 작업용 견본 상자로 갈라진다. 오른쪽에는 밝은 쪽·기준·어두운 쪽 세 칸으로 된 한도 견본 판이 있다. 맨 아래 띠에 보관 조건과 갱신 주기가 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzcyIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuyDiSDquLDspIDtjJAg7LK06rOEIOKAlCDrp4jsiqTthLAg7IOY7ZSMLCDsgrzsnpAg7J6R7JeF7JqpIOqyrOuzuCwg7ZWc64+EIOqyrOuzuCjqsJzrhZDrj4QpPC90aXRsZT4NCiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI0ZBRkNGQiIvPg0KICA8dGV4dCB4PSIxNiIgeT0iMzIiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxODIwMkEiPuqwmeydgCDrp4jsiqTthLDsl5DshJwg66eM65OgIO2MkOydhCDsgrzsnpDqsIAg64KY64igIOqwgOyguOyVvCDsiKvsnpDqsIAg7J207Ja07KeE64ukPC90ZXh0Pg0KICA8cmVjdCB4PSIxNTAiIHk9IjU0IiB3aWR0aD0iMjQwIiBoZWlnaHQ9IjY2IiByeD0iOCIgZmlsbD0iIzQ2NTI2MCIvPg0KICA8dGV4dCB4PSIyNzAiIHk9IjgyIiBmb250LXNpemU9IjE3IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjRkFGQ0ZCIj7rp4jsiqTthLAg7IOY7ZSMKOybkOuzuCk8L3RleHQ+DQogIDx0ZXh0IHg9IjI3MCIgeT0iMTA2IiBmb250LXNpemU9IjEzIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjRkFGQ0ZCIj7rtoTsn4Eg7YyQ7KCVwrfqsqzrs7gg7KCQ6rKAIOuVjOunjCDqurzrgrjri6Q8L3RleHQ+DQogIDxsaW5lIHgxPSIyNzAiIHkxPSIxMjIiIHgyPSIxMDEuOSIgeTI9IjE5MS42IiBzdHJva2U9IiM0NjUyNjAiIHN0cm9rZS13aWR0aD0iMS44Ii8+DQogI color approval", "측색 조건", "라이트 부스", "light booth", "색 승인서"], "stage": "s5", "lens": "qual", "order": 2, "kind": "process", "oneLiner": "색 승인은 색 지정·조색·시편·육안과 측색 판정을 거쳐 승인서로 기준을 확정하는 절차이고, 광원·관찰자·측정 기하·색차 식·허용값을 함께 정해야 같은 숫자로 판정된다.", "body": "새 색은 색 지정 → 조색 → 시편 → 육안·측색 판정 → 승인서 순서로 정한다(아래 절차). 여기서 정한 숫자와 판이 이후 모든 로트 판정의 기준이 되므로, 색을 맞추는 일만큼 **어떤 조건으로 쟀는지**를 정하는 일이 중요하다.\n\n흐름에서 구매가 챙길 곳은 세 군데다. 첫째, 고객 견본이 실물이면 소재·광택이 우리 부품과 다를 수 있으니 무엇을 맞출지(색만, 광택까지) 먼저 정한다. 둘째, 조색 처방은 안료 가짓수가 적을수록 배치 재현이 쉽고 메타메리즘이 적다(Talbert 5장). 셋째, 시편은 부품과 같은 소재·전처리·막두께·경화 조건으로, 가능하면 도장 업체 라인에서 칠한다. 육안 판정은 표준 광원이 있는 라이트 부스에서 한다(ISO 3668).\n\n**측색 조건**은 다섯 가지를 한 줄로 적는다. 하나라도 다르면 같은 판도 다른 숫자가 나온다.\n- 광원: 판정용 D65, 메타메리즘 확인용으로 A(백열등)나 형광등 계열 하나 이상\n- 관찰자: 10° 또는 2°\n- 측정 기하: 적분구 d/8에서 정반사 포함(SCI) 또는 제외(SCE), 아니면 방향성 45°/0°. SCI는 광택 영향을 줄여 색 자체를, SCE와 45°/0°는 눈에 보이는 외관에 가깝게 잰다.\n- 색차 식: ΔE*ab 또는 ΔE00. 식이 다르면 숫자가 다르다.\n- 허용값: 'ΔE*ab 1.0 이하, ΔL* ±0.8'처럼 전체와 방향별 한계를 함께 정할 수 있다.\n\nΔE 계산 원리는 표면처리편 「색과 광택의 관리」에서 봤다. 도료편에서 중요한 것은 이 조건이 **도료사 출하 측정, 도장 업체 초품 검사, 우리 수입검사에서 모두 같아야** 한다는 점이다. 측색기 기종이 다르면 같은 조건에서도 값이 조금 달라지므로, 기종 사이 차이를 기준판으로 맞춰 둔다. 육안과 측색이 엇갈리면 육안 결과를 기록하고 허용값이 맞는지 다시 본다.", "keyPoints": ["색 승인 = 색 지정 → 조색 → 시편 → 육안·측색 판정 → 승인서", "시편은 부품과 같은 소재·전처리·막두께·경화 조건으로 칠한다", "측색 조건 다섯 가지(광원·관찰자·측정 기하·색차 식·허용값)를 한 줄로 적는다", "SCI는 색 자체, SCE·45°/0°는 보이는 외관에 가깝다 — 반광·무광은 둘의 차이가 크다", "도료사·도장 업체·수입검사가 같은 조건과 같은 기준판으로 재야 숫자가 이어진다"], "tables": [{"caption": "색 승인서의 측색 조건 표기 예(예시값)", "header": ["조건", "정하는 것", "예시"], "rows": [["광원", "판정 광원과 확인 광원", "D65(판정), A·형광등 계열(메타메리즘 확인)"], ["관찰자", "시야각", "10°"], ["측정 기하", "조명·수광 배치, 정반사 포함 여부", "d/8 SCI"], ["색차 식", "계산식", "ΔE*ab"], ["허용값", "전체·방향별 한계", "ΔE*ab 1.0 이하, ΔL* ±0.8"], ["광택", "측정 각도와 범위", "60°, 85±5GU"]]}], "steps": ["색 지정: 고객 색 번호·실물 견본을 받고, 색만 맞출지 광택·질감까지 맞출지 정한다", "조색: 도료사가 CCM과 손 조색으로 처방을 만들고, 같은 색을 칠하는 다른 소재·업체의 판도 함께 보낸다", "시편: 부품과 같은 소재·전처리·막두께·경화 조건으로 칠한다(가능하면 도장 업체 라인)", "판정: 라이트 부스에서 육안 비교하고, 정한 측색 조건으로 ΔE와 ΔL*·Δa*·Δb* 방향을 잰다", "승인서: 승인 시편을 마스터 샘플로 등록하고, 측색 조건과 허용값을 적어 삼자가 서명한다"], "checks": ["색 승인서에 광원·관찰자·측정 기하·색차 식·허용값이 모두 적혀 있는지 확인한다", "승인 시편이 부품과 같은 소재·전처리·막두께·경화 조건으로 칠한 판인지 본다", "메타메리즘 확인용 광원(A 또는 형광등 계열)에서도 ΔE를 받았는지 확인한다", "도료사·도장 업체·우리 검사실의 측색기 기종과 측정 조건이 같은지, 기종 차이를 기준판으로 맞췄는지 본다", "육안 판정을 라이트 부스에서 했는지, 육안과 측색이 엇갈린 기록이 있는지 확인한다"], "example": "예를 들어 A사는 도료사 성적서의 ΔE 0.4와 자사 검사실 측정값 1.2가 계속 어긋났다. 확인해 보니 도료사는 d/8 SCI로, A사는 45°/0°로 재고 있었고, 반광 도막이라 광택 차이가 숫자에 섞여 들어갔다. 승인서에 측정 기하를 SCI로 적고, 두 회사 측색기를 같은 기준판으로 맞췄다(가상 사례).", "media": [{"type": "image", "file": "r5-color-approval-01.svg", "caption": "색 승인은 다섯 단계로 끝나고, 마지막 승인서가 **마스터 샘플과 측색 조건**을 함께 확정한다. 이후 모든 로트는 이 두 가지로 판정한다(개념도).", "alt": "왼쪽에서 오른쪽으로 색 지정, 조색, 시편, 육안·측색 판정, 승인서 다섯 상자가 화살표로 이어진다. 판정 상자에서 조색 상자로 되돌아가는 불합격 화살표가 있고, 승인서 상자 아래로 마스터 샘플과 측색 조건 두 상자가 이어진다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzM2IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuyDiSDsirnsnbgg64uk7ISvIOuLqOqzhOyZgCDsirnsnbjshJzqsIAg7ZmV7KCV7ZWY64qUIOuniOyKpO2EsCDsg5jtlIzCt+y4oeyDiSDsobDqsbQo6rCc64WQ64+EKTwvdGl0bGU+DQogIDxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNGQUZDRkIiLz4NCiAgPHRleHQgeD0iMTYiIHk9IjMyIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMTgyMDJBIj7sg4kg7Iq57J247ISc64qUIOuniOyKpO2EsCDsg5jtlIzqs7wg7Lih7IOJIOyhsOqxtOydhCDtlajqu5gg7ZmV7KCV7ZWc64ukPC90ZXh0Pg0KICA8cmVjdCB4PSIxNiIgeT0iMTE4IiB3aWR0aD0iMTIwIiBoZWlnaHQ9IjU2IiByeD0iOCIgZmlsbD0iI0ZBRkNGQiIgc3Ryb2tlPSIjMUQ1QkI4IiBzdHJva2Utd2lkdGg9IjIiLz4NCiAgPHRleHQgeD0iNzYiIHk9IjE1MiIgZm9udC1zaXplPSIxNiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MjAyQSI+7IOJIOyngOyglTwvdGV4dD4NCiAgPHRleHQgeD0iNzYiIHk9IjE5OCIgZm9udC1zaXplPSIxMyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzQ2NTI2MCI+7IOJIOuyiO2YuMK37Iuk66y8IOqyrOuzuDwvdGV4dD4NCiAgPHRleHQgeD0iNzYiIHk9IjIxNyIgZm9udC1zaXplPSIxMyIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmls  측정 조건이 다를 가능성이 가장 크다. 특히 반광·무광은 SCI와 SCE·45°/0°의 차이가 크다. 조건을 맞춘 뒤에야 어느 쪽 값이 맞는지 가릴 수 있다. 영업 의견·단가·포장은 측정값과 관계없다."}, {"q": "고객이 '사무실과 매장 조명 모두에서 색이 맞아야 한다'고 요구한다. 색 승인서에 넣을 조건으로 가장 알맞은 것은?", "options": ["D65 한 광원의 ΔE만 적는다", "측정을 단순하게 하려고 광택 조건을 뺀다", "육안 판정 결과만 적는다", "D65 판정에 더해 매장 조명에 가까운 광원에서의 ΔE 한계도 적는다"], "answer": 3, "explain": "광원이 바뀌면 색 차이가 달라지는 메타메리즘이 있으므로, 고객이 보는 조명에 가까운 광원에서도 한계를 정해야 한다. D65만 적으면 매장 조명 차이를 못 잡고, 광택을 빼거나 육안만 적으면 숫자로 판정할 근거가 없다."}], "silmu": ["s6-coating-test"], "pyo": ["p6-color-gloss"], "scopes": ["spec", "test"], "sources": ["ISO 3668:2017 Paints and varnishes — Visual comparison of colour of paints(표준 부스에서 인공 광원으로 육안 비교, 효과 안료 도료는 조건 사전 합의 필요): https://www.iso.org/standard/64819.html", "Konica Minolta Sensing, Color Measurement Instrument Geometries(d/8 SCI·SCE, 45°/0° 비교): https://sensing.konicaminolta.us/us/blog/color-measurement-instrument-geometries/", "HunterLab 기술 자료 KA-05590(색만 볼 때 적분구 SCI, 외관까지 볼 때 45°/0°): https://support.hunterlab.com/knowledgebase/article/KA-05590/en-us", "Talbert, Paint Technology Handbook(CRC Press 2008), 5장(조색, 처방 안료 가짓수, 육안 판정 조건 — 광원·관찰 각도·거리·광택)", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 19장(색과 외관, 측색)"], "note": "측정 기하의 설명(SCI는 광택 영향을 줄여 색 자체, SCE·45°/0°는 외관에 가까움)은 측색기 제조사 기술 자료 두 곳에서 대조했다. 측정 기하의 정의 규격(CIE 15, ASTM E179 등) 원문은 보지 못했다. ISO 3668은 2017판 적용 범위 요약으로 확인했다(확인 시점 2026-11)."}, {"id": "r5-lot-color", "title": "로트 간 색차와 조색 관리", "aliases": ["로트 색차", "batch-to-batch color variation", "배치 색 편차", "출하 측색값", "색차 추이 관리"], "stage": "s5", "lens": "qual", "order": 3, "kind": "method", "oneLiner": "로트 간 색차 관리는 도료 배치마다 기준판 대비 ΔE를 출하·수입검사에서 재어 추이로 지켜보고, 현장 조색과 로트 섞기를 막아 부품 사이 색이 흔들리지 않게 하는 방법이다.", "body": "같은 품번 도료라도 배치마다 색이 조금씩 다르다. 안료 원료 로트마다 착색력이 다르고, 분산 정도가 다르며(Jones 외 21장), 배치 크기와 보정 횟수도 다르기 때문이다. 도료사는 배치를 만든 뒤 시편을 칠해 기준판과 비교하고, 벗어나면 착색 페이스트를 조금씩 더해 맞춘다. 이것을 **조색 보정**(shading)이라 한다. 그래서 출하 성적서에는 그 배치의 기준판 대비 ΔE와 방향(ΔL*·Δa*·Δb*)이 적혀야 한다.\n\n구매가 알아야 할 함정은 **합격 로트끼리도 서로 다를 수 있다**는 점이다. 허용 ΔE가 1.0이면 한 로트는 기준보다 0.8 밝고 다음 로트는 0.7 어두워도 둘 다 합격이다. 그러나 두 로트로 칠한 부품을 나란히 놓으면 밝기 차이만 1.5다. 그래서 다음을 관리한다.\n\n- **추이 관리**: 로트별 ΔL*·Δa*·Δb*를 표나 관리도로 쌓는다. 허용값 안이라도 한 방향으로 계속 움직이면 도료사에 알리고, 기준판이 바랬는지 원료가 바뀌었는지 묻는다. 관리도 해석은 개념편 QC 도구를 쓴다.\n- **로트 섞지 않기**: 한 부품, 한 조립품, 한 출하 묶음에는 같은 도료 로트를 쓴다. 로트가 바뀌는 시점을 도장 업체 기록에 남기면 색 클레임 범위도 좁아진다.\n- **현장 조색 금지**: 도장 업체가 색이 안 맞는다고 원색이나 다른 도료를 섞으면 그 도료는 승인되지 않은 처방이 된다. 보정은 도료사가 하고, 보정한 배치는 성적서를 다시 받는다.\n- **다른 소재·다른 업체 부품의 색 맞춤**: 강판 부품과 수지 부품, 두 도장 업체 부품이 한 제품에 붙으면 도료가 달라 같은 기준판에 각각 합격해도 나란히 보면 다르다. 서로의 판을 함께 놓고 맞춘다.\n\n추이를 보려면 숫자가 같은 조건에서 나와야 한다. 측색 조건은 「색 승인 흐름과 측색 조건」, 기준판 관리는 「색 마스터 샘플과 한도 견본」을 따른다.", "keyPoints": ["배치 색 편차는 안료 착색력·분산 정도·보정 차이에서 오며, 도료사는 조색 보정으로 맞춘다", "성적서에는 기준판 대비 ΔE와 ΔL*·Δa*·Δb* 방향이 함께 있어야 한다", "합격 로트끼리도 반대 방향이면 허용값의 두 배 가까이 다를 수 있다", "로트별 추이를 관리도로 쌓고, 한 방향 이동은 허용값 안이라도 알린다", "한 부품·한 조립품·한 출하 묶음에 로트를 섞지 않고, 현장 조색은 금지한다"], "tables": [{"caption": "로트별 색차 기록 예(예시값) — 허용 ΔE*ab 1.0, D65/10°", "header": ["로트", "ΔL*", "Δa*", "Δb*", "ΔE*ab", "판정"], "rows": [["L1", "+0.2", "−0.1", "+0.1", "0.24", "합격"], ["L2", "+0.3", "0.0", "+0.2", "0.36", "합격"], ["L3", "+0.5", "−0.1", "+0.2", "0.55", "합격"], ["L4", "+0.6", "−0.2", "+0.3", "0.70", "합격 — 밝아지는 추이 통보"], ["L5", "+0.8", "−0.2", "+0.3", "0.88", "합격 — 추이 경고"], ["L6", "−0.7", "+0.1", "−0.2", "0.73", "합격 — 그러나 L5와 ΔE 1.61"]]}], "checks": ["도료 성적서에 기준판 대비 ΔE와 ΔL*·Δa*·Δb*가 측색 조건과 함께 적혀 있는지 확인한다", "로트별 색차를 표나 관리도로 쌓아 허용값 안에서도 한 방향으로 움직이는지 본다", "도장 업체가 한 부품·한 조립품·한 출하 묶음에 도료 로트를 섞지 않는지, 로트 교체 시점을 기록하는지 확인한다", "도장 업체 현장에서 원색·다른 도료를 섞는 현장 조색을 하지 않는지 실사 때 본다", "한 제품에 붙는 다른 소재·다른 업체 부품은 서로의 판을 나란히 비교한 기록이 있는지 확인한다"], "example": "예를 들어 A사는 회색 도료 여섯 로트가 모두 ΔE*ab 1.0 안이었는데, 다섯째·여섯째 로트로 칠한 패널이 한 제품에 섞여 고객 클레임을 받았다. 추이표를 보니 다섯째는 기준보다 0.8 밝고 여섯째는 0.7 어두워 둘 사이가 1.6이었다. 이후 성적서에 ΔL* ±0.5 방향 한계를 더하고, 한 출하 묶음에는 한 로트만 쓰게 했다(가상 사례).", "media": [{"type": "image", "file": "r5-lot-color-01.svg", "caption": "로트별 ΔL* 추이. L1~L5가 **허용값 안에서 한 방향으로 밝아지다가** L6에서 반대로 뛰었다. 모두 합격이지만 L5와 L6 사이 ΔE는 1.61이다(예시값, 표와 같은 숫자).", "alt": "꺾은선 그래프. 가로축은 로트 L1부터 L6, 세로축은 ΔL*로 −1.0에서 +1.0까지다. 점이 +0.2, +0.3, +0.5, +0.6, +0.8로 오르다가 L6에서 −0.7로 떨어진다. L3부터 L5까지 주황 화살표로 한 방향 추이가 표시되고, L5와 L6 사이에 빨간 괄호로 ΔE 1.61이 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDcwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuhnO2KuOuzhCDOlEwqIOy2lOydtCDigJQg7ZeI7JqpIOuylOychCDslYjsl5DshJwg7ZWcIOuwqe2WpeycvOuhnCDrsJ3slYTsp4Dri6QgTDbsl5DshJwg67CY64yA66GcIOubtOuLpCjsmIjsi5zqsJIpPC90aXRsZT4NCiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI0ZBRkNGQiIvPg0KICA8dGV4dCB4PSIxNiIgeT0iMzIiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxODIwMkEiPuuqqOuRkCDtlanqsqnsnbTslrTrj4QsIO2VnCDrsKntlqUg7LaU7J207JmAIOuhnO2KuCDsgqzsnbQg7KCQ7ZSE66W8IOuzuOuLpDwvdGV4dD4NCiAgPHJlY3QgeD0iMTAwIiB5PSIxMDAuMCIgd2lkdGg9IjYwNCIgaGVpZ2h0PSIzMDAuMCIgZmlsbD0iIzJGOEY1QiIgZmlsbC1vcGFjaXR5PSIuMDciLz4NCiAgPGxpbmUgeDE9IjEwMCIgeTE9IjEwMC4wIiB4Mj0iNzA0IiB5Mj0iMTAwLjAiIHN0cm9rZT0iI0U0RUFFOCIvPg0KICA8dGV4dCB4PSI5MiIgeT0iMTA1IiBmb250LXNpemU9IjEzIiB0ZXh0LWFuY2hvcj0iZW5kIiBmaWxsPSIjNzc4MzhGIj4rMS4wPC90ZXh0Pg0KICA8bGluZSB4MT0iMTAwIiB5MT0iMTc1LjAiIHgyPSI3MDQiIHkyPSIxNzUuMCIgc3Ryb2tlPSIjRTRFQUU4Ii8+DQogIDx0ZXh0IHg9IjkyIiB5PSIxODAiIGZvbnQtc2l6ZT0iMTMiIHRleHQtYW5jaG9yPSJlbmQiIGZpbGw9IiM3NzgzOEYiPiswLjU8L3RleHQ+DQogIDxsaW5lIHgxPSIxMDAiIHkxPSIyNTAiIHgyPSI3MDQiIHkyPSIyNTAiIHN0cm9rZT0iIzQ2NTI2MCIvPg0KICA8dGV4dCB4PSI5MiIgeT0iMjU1IiBmb250LXNpemU9IjEzIiB0ZXh0LWFuY2hvcj0iZW5kIiBmaWxsPSIjNzc4MzhGIj4wPC90ZXh0Pg0KICA8bGluZSB4MT0iMTAwIiB5MT0iMzI1LjAiIHgyPSI3MDQiIHkyPSIzMjUuMCIgc3Ryb2tlPSIjRTRFQUU4Ii8+DQogIDx0ZXh0IHg9IjkyIiB5PSIzMzAiIGZvbnQtc2l6ZT0iMTMiIHRleHQtYW5jaG9yPSJlbmQiIGZpbGw9IiM3NzgzOEYiPi0wLjU8L3RleHQ+DQogIDxsaW5lIHgxPSIxMDAiIHkxPSI0MDAuMCIgeDI9IjcwNCIgeTI9IjQwMC4wIiBzdHJva2U9IiNFNEVBRTgiLz4NCiAgPHRleHQgeD0iOTIiIHk9IjQwNSIgZm9udC1 , "다음부터는 10%까지 섞어도 된다고 허용한다"], "answer": 1, "explain": "현장에서 다른 도료를 섞으면 색은 맞아 보여도 고형분·경화·내후성이 승인된 처방과 달라진다. 사용을 멈추고 도료사가 보정한 배치를 성적서와 함께 받는다. 비용 정산이나 허용 비율 확대는 승인되지 않은 처방을 인정하는 일이다."}], "ncs": ["c05-qc-seven-tools"], "pyo": ["p6-color-gloss", "p6-pigments"], "scopes": ["test", "claim"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 5장(배치 간 색 편차의 허용 범위, 처방 안료 가짓수와 배치 재현)", "Talbert, Paint Technology Handbook(CRC Press 2008), 4장(안료 페이스트 분산과 배치 생산)", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 21장(안료 분산 — 분산 정도와 착색력 평가)"], "note": "표·그래프의 로트 값은 예시값이며 ΔE*ab는 Python으로 검산했다(L5–L6: √(1.5² + 0.3² + 0.5²) = 1.61)."}, {"id": "r5-effect-color", "title": "메탈릭·펄 도료의 색 관리", "aliases": ["메탈릭 도료", "펄 도료", "metallic paint", "pearl paint", "다각도 측색", "multi-angle color measurement"], "stage": "s5", "lens": "qual", "order": 4, "kind": "method", "oneLiner": "메탈릭·펄 도료는 알루미늄 조각과 간섭 안료의 배향 때문에 보는 각도마다 밝기와 색이 달라, 다각도 측색과 도장 조건까지 묶어 승인해야 하는 까다로운 색 관리 대상이다.", "body": "메탈릭 도료에는 얇은 알루미늄 조각(플레이크)이, 펄 도료에는 운모 같은 얇은 판에 금속 산화물을 입힌 간섭 안료가 들어 있다. 조각들이 도막 안에서 표면과 나란히 누우면 작은 거울처럼 빛을 한 방향으로 되돌린다. 그래서 정반사 방향 가까이서 보면 밝고(정면색, face), 비스듬히 보면 어둡다(측면색, flop). 펄은 각도에 따라 색상까지 바뀐다(Jones 외 19장). 단색 도료처럼 한 각도로 재서는 판정할 수 없다.\n\n**다각도 측색**은 조명을 고정하고, 정반사 방향에서 몇 도 떨어졌는지(정반사 기준 각도, aspecular angle)를 바꿔 가며 여러 번 잰다. 메탈릭은 15°·45°·110° 세 각도가 널리 쓰이고(ASTM E2194), 장비에 따라 25°·75°를 더한다. 15°는 반짝이는 쪽, 45°는 정면색, 110°는 측면색을 대표한다. 펄은 조명 각도까지 바꿔 재야 한다(ASTM E2539). 승인서에는 각도마다 허용 ΔE를 따로 적는다. 육안 비교 규격 ISO 3668도 효과 안료 도료는 조명·관찰 조건을 미리 합의해야 쓸 수 있다고 한다.\n\n메탈릭 색은 **도장 조건**에도 흔들린다. 도료가 젖은 채 두껍게 붙으면 조각이 흐트러져 정면이 어두워지고, 건조하게 붙으면 조각이 잘 누워 정면이 밝아진다. 분무 방식, 토출량, 희석 비율, 플래시오프 시간, 막두께가 모두 영향을 준다(표면처리편 「액체 도장 방식」). 그래서 메탈릭은 도료사 실험실 판이 아니라 **실제 라인 조건으로 칠한 판**으로 승인하고, 그 도장 조건을 승인서에 함께 적는다.\n\n이 때문에 메탈릭·펄은 단색보다 승인과 이원화가 어렵다. 도료사가 다르면 조각의 크기·모양이 달라, 한 각도를 맞추면 다른 각도가 어긋나기 쉽다. 도장 업체나 도장 설비를 바꿔도 색을 다시 맞춰야 할 수 있다. 구매는 메탈릭 부품의 도료사·도장 업체 변경을 단색보다 큰 변경으로 보고 일정과 시험 비용을 그만큼 잡는다.", "keyPoints": ["메탈릭·펄은 조각 안료가 빛을 한 방향으로 되돌려 정면은 밝고 측면은 어둡다 — 펄은 색상도 바뀐다", "메탈릭은 정반사 기준 15°·45°·110°에서 재고(ASTM E2194), 펄은 조명 각도까지 바꿔 잰다", "승인서에는 각도마다 허용 ΔE를 따로 적는다", "분무 방식·토출량·희석·플래시오프·막두께가 조각 배향을 바꿔 색을 바꾼다 — 라인 조건 판으로 승인한다", "도료사·도장 업체·설비 변경은 단색보다 큰 변경으로 다룬다"], "tables": [{"caption": "메탈릭 다각도 측색 각도와 보는 것(대표값, ASTM E2194·측색기 기술 자료)", "header": ["정반사 기준 각도", "이름", "보는 것"], "rows": [["15°", "반짝이는 쪽(flash)", "조각이 되돌리는 빛 — 가장 밝다"], ["45°", "정면색(face)", "단색 측색과 비슷한 위치"], ["110°", "측면색(flop)", "비스듬히 볼 때 — 가장 어둡다"], ["25°·75°", "보조 각도", "장비에 따라 추가해 변화를 촘촘히 본다"]]}], "checks": ["메탈릭·펄 색 승인서에 측정 각도별(15°·45°·110° 등) 허용 ΔE가 적혀 있는지 확인한다", "승인 시편이 실제 라인의 분무 방식·막두께·플래시오프 조건으로 칠한 판인지 본다", "성적서 측색값이 다각도 측색기로 잰 값인지, 한 각도 값만 있지 않은지 확인한다", "메탈릭 도료는 분산도 게이지 시험이 맞지 않으므로 성적서가 무엇으로 대신 확인하는지 본다", "메탈릭 부품의 도료사·도장 업체·도장 설비 변경은 색 재승인 대상으로 보고 일정과 비용을 잡는다"], "example": "예를 들어 A사는 은색 메탈릭 커버의 도장 업체를 바꾸면서 같은 도료를 그대로 썼다. 새 업체 부품은 45°에서 기준판과 ΔE 0.6으로 맞았지만 15°에서는 2.1만큼 어두웠다. 새 업체가 도료를 두껍고 젖게 칠해 조각이 덜 누운 탓이었다. 토출량과 막두께를 조정해 칠한 판으로 다시 승인하고, 그 조건을 승인서에 적었다(가상 사례).", "media": [{"type": "image", "file": "r5-effect-color-01.svg", "caption": "다각도 측색은 45°로 비추고 **정반사 방향에서 15°·45°·110° 떨어진 곳**에서 받는다. 조각이 누운 방향으로 빛이 몰려 15°는 밝고 110°는 어둡다(개념도).", "alt": "아래쪽에 도막 단면이 있고 그 안에 표면과 나란히 누운 회색 알루미늄 조각들이 있다. 왼쪽 위 45° 방향에서 조명 화살표가 들어오고, 오른쪽 위로 정반사 방향 점선이 있다. 정반사 방향에서 15°, 45°, 110° 떨어진 세 수광 방향이 파란 선으로 그려져 각각 밝음, 정면색, 어두움으로 표시돼 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDQ4IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuplO2DiOumrSDri6TqsIHrj4Qg7Lih7IOJ7J2YIOuwsOy5mCDigJQgNDXCsCDsobDrqoUsIOygleuwmOyCrCDquLDspIAgMTXCsMK3NDXCsMK3MTEwwrAg7IiY6rSRKOqwnOuFkOuPhCk8L3RpdGxlPg0KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQogIDx0ZXh0IHg9IjE2IiB5PSIzMiIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MjAyQSI+66mU7YOI66at7 IIOuPhOyepSDsl4XssrTqsIAg7Lmg7ZWcIOuplO2DiOumrSDrtoDtkogo7JiI7Iuc6rCSKS48L3RleHQ+DQo8L3N2Zz4NCg=="}], "quiz": [{"q": "메탈릭 부품의 도료 성적서에 45° 측색값 하나만 'ΔE 0.4 합격'으로 적혀 있다. 가장 알맞은 판단은?", "options": ["15°·110° 등 다른 각도 값도 받아야 판정할 수 있다", "0.4이므로 합격 처리한다", "광택값만 추가로 받으면 된다", "숫자가 있으니 육안 판정은 필요 없다"], "answer": 0, "explain": "메탈릭은 각도마다 색이 다르므로 45° 한 값으로는 반짝이는 쪽(15°)·측면(110°)의 차이를 알 수 없다. 각도별 값과 각도별 허용값이 있어야 판정된다. 광택값으로는 각도별 색 차이를 대신할 수 없고, 육안 판정도 합의된 조건으로 병행한다."}, {"q": "같은 메탈릭 도료를 쓰는데 도장 업체를 바꾼 뒤 '정면은 맞는데 비스듬히 보면 색이 다르다'는 지적이 나왔다. 가장 먼저 의심할 것은?", "options": ["도료 유효기간이 지났다", "도료 단가가 바뀌었다", "분무 방식·막두께·플래시오프 차이로 알루미늄 조각의 배향이 달라졌다", "도료 포장 단위가 바뀌었다"], "answer": 2, "explain": "도료가 같고 업체만 바뀌었다면 도장 조건이 조각 배향을 바꿨을 가능성이 가장 크다. 배향이 달라지면 각도에 따른 밝기 변화가 달라진다. 유효기간 문제라면 정면색도 함께 틀어지는 경우가 많고, 단가·포장은 색과 관계없다."}], "pyo": ["p6-color-gloss", "p7-spray"], "scopes": ["spec", "test"], "sources": ["ASTM E2194-14(2025) Standard Test Method for Multiangle Color Measurement of Metal Flake Pigmented Materials(적용 범위 — 금속 조각 재료는 세 각도 측정 필요): https://store.astm.org/e2194-14r21.html", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 19장(메탈릭의 정면색·측면색, 다각도 측정에 쓰이는 정반사 기준 15°·45°·110°와 ASTM E2194, 펄용 다조명 각도 장비)", "X-Rite 기술 지원 문서 'What angles are used for Flash, Face and Flop'(정반사 기준 15°·25°·45°·75°·110°, flash 15°·25° / face 45° / flop 75°·110°): https://www.xrite.com/service-support/WhatanglesareusedforFlashFaceandFlop", "ASTM E2539 Standard Test Method for Multiangle Color Measurement of Interference Flake Pigmented Materials(간섭 안료는 조명·수광 각도를 여러 개로 측정): https://store.astm.org/e2539-14r21.html", "ISO 3668:2017 적용 범위(효과 안료 도료는 조명·관찰 조건 사전 합의 필요): https://www.iso.org/standard/64819.html", "ISO 1524:2020 적용 범위(조각 안료가 든 도료에는 분산도 시험을 적용하지 않음): https://www.iso.org/standard/76040.html"], "note": "15°·45°·110°는 교재(Jones 외 19장)가 ASTM E2194-14를 인용한 값과 측색기 제조사 기술 문서, 미국 특허 US4479718(45° 조명, 15°·45°·110° 수광)로 대조했다. ASTM E2194 공개 요약에서는 '세 각도'까지만 확인했고 원문은 보지 못했다. 펄용 조명 각도의 구체적인 값은 확인이 덜 돼 본문에 쓰지 않았다(확인 시점 2026-11)."}, {"id": "r6-coa", "title": "도료 성적서 읽기: 항목·규격값·판정", "aliases": ["도료 성적서", "CoA", "certificate of analysis", "도료 출하 성적서", "도료 시험 성적서"], "stage": "s6", "lens": "qual", "order": 1, "kind": "document", "oneLiner": "도료 성적서는 도료사가 배치마다 점도·비중·불휘발분·분산도·색차·광택·경화 시험의 규격값과 실측값을 적어 발행하는 문서로, 그 로트가 승인된 도료와 같다는 증거이다.", "body": "강판에 밀시트가 있듯 도료에는 **성적서**(CoA, certificate of analysis)가 있다. 도료사가 배치마다 출하 시험을 하고 결과를 적어 로트와 함께 보낸다. 밀시트 읽는 법은 실무편에서 봤고, 도료 성적서는 항목이 다르다.\n\n먼저 **식별 정보**를 본다. 도료사·품번, 로트(배치) 번호, 제조일, 유효기간, 발행일, 시험자·승인자 서명이다. 로트 번호가 캔 라벨과 같은지가 출발점이다.\n\n다음은 **시험 항목**이다. 항목마다 시험 방법, 규격값(범위), 실측값, 판정이 한 줄에 있어야 한다.\n- 점도: 유출컵 흐름 시간(초) 또는 회전 점도계(mPa·s). 컵 종류·구경과 측정 온도가 함께 적혀야 비교된다(ISO 2431).\n- 비중(밀도): kg/L. 단가 환산과 소요량 계산에도 쓴다(ISO 2811-1).\n- 불휘발분: 질량%(ISO 3251). 가열 온도·시간에 따라 값이 달라지는 상대값이라 같은 조건끼리만 비교한다. 부피%는 대개 TDS의 계산값이다.\n- 분산도: 분산도 게이지로 읽은 μm(ISO 1524). 메탈릭처럼 조각 안료가 든 도료에는 쓰지 않는다.\n- 색차·광택: 기준판 대비 ΔE와 방향, 측색 조건, 광택 각도와 GU.\n- 경화 시험: 정해진 조건으로 경화한 판의 연필 경도나 내용제 문지름 횟수.\n\n**규격값과 TDS 대표값은 다르다.** TDS의 '불휘발분 55%'는 대표값이고, 판정 기준은 사양서·품질 협정에서 정한 범위(예: 53~57%)다. 성적서의 규격 칸이 협정 범위와 같은지 확인한다. 도료사가 사내 기준을 더 넓게 적어 두면 '합격' 표시만 보고 지나치기 쉽다.\n\n마지막으로 **누락과 진위**를 본다. 사양서가 요구한 항목이 빠지지 않았는지, 로트마다 실측값이 소수점까지 똑같지 않은지, 시험일이 제조일보다 앞서지 않는지 본다. 의심되면 보관 시료나 입고 도료로 직접 재서 대조한다. 성적서가 있어도 우리 쪽 확인은 「도료 수입검사」에서 따로 한다.", "keyPoints": ["도료 성적서는 배치마다 발행되는 출하 시험 결과다 — 로트 번호가 라벨과 같은지부터 본다", "항목마다 시험 방법·규격값·실측값·판정이 한 줄에 있어야 한다", "점도는 컵·온도, 불휘발분은 가열 조건, 색차는 측색 조건이 함께 있어야 비교된다", "판정 기준은 TDS 대표값이나 도료사 사내 기준이 아니라 협정한 범위다", "누락 항목, 로트마다 똑같은 값, 날짜 모순은 진위를 의심할 신호다"], "tables": [{"caption": "도료 성적서 항목 읽기 예(예시값)", "header": ["항목", "시험 방법", "규격값", "실측값", "확인할 점"], "rows": [["점도", "유출컵 4mm, 25℃", "60~80초", "72초", "컵·온도가 수입검사와 같은가"], ["비중", "금속 피크노미터, 25℃", "1.30~1.40kg/L", "1.35", "TDS 대표값과 크게 다르지 않은가"], ["불휘발분", "가열 건조(온도·시간 명시)", "53~57질량%", "55.2", "가열 조건이 적혀 있는가"], ["분산도", "분산도 게이지", "15μm 이하", "10μm", "조각 안료 도료는 해당 없음"], ["색차", "D65/10°, d/8 SCI", "ΔE*ab 1.0 이하", "0.42", "ΔL*·Δa*·Δb* 방향도 있는가"], ["광택", "60°", "80~90GU", "86", "각도가 승인서와 같은가"], ["경화", "150℃ 20분 경화판, MEK 문지름", "50회 이상", "100회 이상", "경화 조건이 우리 라인과 같은가"]]}], "checks": ["성적서의 로트 번호·제조일·유효기간이 캔 라벨과 같은지 확인한다", "성적서 규격 칸이 사양서·품질 협정에서 정한 범위와 같은지 본다 — TDS 대표값이나 도료사 사내 기준이 아닌지", "점도는 컵 종류·구경·온도, 불휘발분은 가열 조건, 색차는 측색 조건이 적혀 있는지 확인한다", "사양서가 요구한 항목이 빠지지 않았는지, 로트마다 실측값이 똑같이 반복되지 않는지 본다", "의심되는 성적서는 입고 도료나 보관 시료로 직접 재서 대조한다"], "example": "예를 들어 A사 수입검사 담당은 석 달 치 도료 성적서의 불휘발분이 모두 55.0질량%로 같은 것을 발견했다. 입고 도료 세 로트를 직접 재 보니 53.1~56.4%였다. 도료사는 시험 기록 대신 TDS 대표값을 옮겨 적어 왔다고 인정했고, A사는 시험 원자료를 성적서에 붙이게 했다(가상 사례).", "media": [{"type": "image", "file": "r6-coa-01.svg", "caption": "도료 성적서 견본(가상 회사·가상 로트). **로트 번호·규격값·시험 조건·서명** 네 곳을 먼저 본다. 실제 회사 양식이 아니다(예시값).", "alt": "가상 회사 'A 도료사(가상)'의 성적서 견본. 위쪽에 품번, 로트 번호 AP-2603-118, 제조일, 유효기간이 있고, 가운데 표에 점도·비중·불휘발분·분산도·색차·광택·경화 항목의 시험 방법, 규격값, 실측값, 판정 칸이 있다. 오른쪽 여백의 주황 번호 표시 네 개가 로트 번호, 규격값, 시험 조건, 서명을 가리킨다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNTE2IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuPhOujjCDshLHsoIHshJwg6rKs67O4KOqwgOyDgSDtmozsgqzCt+qwgOyDgSDroZztirgpIOKAlCDtmZXsnbjtlaAg64SkIOqzsyDtkZzsi5wo7JiI7Iuc6rCSKTwvdGl0bGU+DQogIDxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNGQUZDRkIiLz4NCiAgPHRleHQgeD0iMTYiIHk9IjMyIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMTgyMDJBIj7rj4Tro4wg7ISx7KCB7IScIOqyrOuzuCDigJQg66Gc7Yq4wrfqt5zqsqnqsJLCt+yLnO2XmCDsobDqsbTCt+yEnOuqheu2gO2EsCDrs7jri6Q8L3RleHQ+DQogIDxyZWN0IHg9IjI0IiB5PSI1MCIgd2lkdGg9IjUzMCIgaGVpZ2h0PSI0NTIiIHJ4PSI0IiBmaWxsPSIjRkZGRkZGIiBzdHJva2U9IiM5OEE4QkEiIHN0cm9rZS13aWR0aD0iMS41Ii8+DQogIDx0ZXh0IHg9IjQ0IiB5PSI4MiIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MjAyQSI+QSDrj4Tro4zsgqwo6rCA7IOBKTwvdGV4dD4NCiAgPHRleHQgeD0iNTM0IiB5PSI4MiIgZm9udC1zaXplPSIxNCIgdGV4dC1hbmNob3I9ImVuZCIgZmlsbD0iIzQ2NTI2MCI+7Iuc7ZeYIO 원문의 시험 조건(예: 불휘발분 가열 온도·시간)은 보지 못해 본문에 쓰지 않았다. KS 대응 번호(KS M ISO …)는 확인하지 못했다. 표의 규격·실측값은 예시값이다."}, {"id": "r6-incoming", "title": "도료 수입검사: 무엇을 얼마나 확인하나", "aliases": ["도료 수입검사", "paint incoming inspection", "도료 입고 검사", "유출컵 점도 측정", "비중컵"], "stage": "s6", "lens": "qual", "order": 2, "kind": "process", "oneLiner": "도료 수입검사는 입고 도료의 서류·라벨·용기 상태를 보고, 점도·비중·불휘발분 간이 측정과 시편 도장 색 판정으로 성적서를 대조해 쓸 수 있는 로트인지 가리는 절차이다.", "body": "성적서는 도료사의 증명이고, 수입검사는 **우리 손으로 하는 대조**다. 도료는 운송·보관 중에도 상한다. 수용성 도료는 얼면 되돌리기 어렵고, 용기가 찌그러지거나 뚜껑이 헐거우면 용제가 날아가 점도가 오른다. 사급 도료가 도장 업체로 바로 들어가면 수입검사를 누가 어디서 할지(우리 창고인지, 도장 업체 입고인지)를 먼저 정한다.\n\n검사는 싸고 빠른 것부터 쌓는다(아래 절차).\n- **서류·라벨**: 성적서가 함께 왔는지, 품번·로트·제조일·유효기간이 라벨과 성적서에서 같은지, 남은 유효기간이 사용 계획보다 긴지 본다.\n- **용기·외관**: 찌그러짐·누출·녹, 수용성 도료의 동결 흔적(운송 온도 기록·표시)을 본다. 대표 용기를 열어 피막(스킨)·딱딱한 침강·겔·이물을 보고, 침강은 정해진 시간 교반으로 다시 섞이는지 확인한다.\n- **간이 측정**: 유출컵으로 흐름 시간을, 비중컵으로 비중을 재고, 필요하면 오븐으로 불휘발분을 잰다. 점도는 온도에 민감해서 하이솔리드 도료는 몇 ℃ 차이에도 초수가 크게 달라진다(Talbert 11장). 시료를 성적서 측정 온도에 맞춘 뒤 같은 컵으로 잰다. 유출컵 값은 뉴턴 유체에 가까운 도료에서만 점도를 대신하고, 100초 가까운 값은 재현이 나쁘다(ISO 2431).\n- **색 판정**: 시험판에 칠해 작업용 견본과 측색·육안으로 비교한다. 외관 부품 색 도료는 로트마다 하는 것이 좋다.\n\n검사 수준은 위험과 이력으로 조정한다. 새 도료사·새 품번·클레임이 난 품번은 처음 몇 로트를 전 항목 검사하고, 성적서와 실측이 계속 맞으면 간이 측정을 몇 로트에 한 번으로 줄인다. 한 번이라도 어긋나면 다시 높인다. 조정 기준은 개념편 샘플링 검사를 따른다.\n\n결과는 로트별로 기록한다. 측정 온도와 컵, 판정자, 합격·보류·불합격, 보류 로트의 격리 위치를 남긴다. 이 기록이 「도료 로트 추적과 부적합 격리」의 첫 고리가 된다.", "keyPoints": ["수입검사는 성적서를 우리 손으로 대조하는 일이다 — 서류 → 외관 → 간이 측정 → 색 판정 순으로 쌓는다", "수용성 도료의 동결, 용기 손상, 피막·침강·겔을 개봉해서 본다", "점도는 시료 온도를 성적서 측정 온도에 맞추고 같은 컵으로 잰다", "검사 수준은 새 도료·클레임 이력이면 높이고, 성적서와 계속 맞으면 줄인다", "로트별 기록(온도·컵·판정·격리 위치)이 로트 추적의 첫 고리다"], "tables": [{"caption": "도료 수입검사 항목과 빈도 예(예시)", "header": ["항목", "방법", "빈도(예시)", "판정 기준"], "rows": [["서류·라벨", "성적서·라벨 대조, 남은 유효기간", "매 로트", "일치, 남은 기간 ≥ 사용 계획"], ["용기·외관", "육안, 대표 용기 개봉·교반", "매 로트", "누출·동결·겔 없음, 침강 재분산"], ["점도", "유출컵, 성적서와 같은 온도", "매 로트", "협정 범위 안"], ["비중", "비중컵(금속 피크노미터)", "매 로트 또는 5로트에 1회", "협정 범위 안"], ["불휘발분", "오븐 건조, 성적서와 같은 조건", "첫 5로트, 이후 분기 1회", "협정 범위 안"], ["색", "시험판 도장 후 측색·육안", "외관 색 도료는 매 로트", "승인 허용 ΔE 안"]]}], "steps": ["입고 때 성적서·라벨·용기를 대조하고 로트별로 '검사 대기' 표시를 붙인다", "대표 용기를 열어 피막·침강·겔·이물을 보고, 정해진 시간 교반해 재분산을 확인한다", "시료 온도를 성적서 측정 온도에 맞춘 뒤 유출컵 점도·비중(필요하면 불휘발분)을 잰다", "색 도료는 시험판을 칠해 작업용 견본과 측색·육안으로 비교한다", "성적서와 실측을 비교해 합격·보류·불합격을 정하고, 보류·불합격 로트는 표시해 격리한다", "결과를 로트별로 기록하고, 이력에 따라 다음 로트의 검사 수준을 정한다"], "checks": ["사급 도료가 도장 업체로 바로 가는 경우 수입검사 주체·장소와 기록 공유 방법을 정했는지 확인한다", "수용성 도료는 겨울철 운송 온도 기록이나 동결 표시를 확인하고, 얼었던 흔적이 있으면 보류한다", "유출컵 점도는 시료 온도를 성적서 측정 온도에 맞춘 뒤 같은 종류·구경의 컵으로 재는지 본다", "성적서와 실측이 어긋난 로트가 나오면 다음 몇 로트의 검사 수준을 높이는지 확인한다", "보류·불합격 로트에 표시를 붙여 따로 격리했는지 창고에서 본다"], "example": "예를 들어 A사는 겨울에 수용성 하도가 입고되자 서류·라벨만 보고 합격시켰다. 도장 업체에서 '도료에 알갱이가 생겼다'는 연락이 와 확인하니 운송 중 동결된 로트였다. 이후 11~3월 입고분은 운송 온도 기록을 받고, 대표 용기를 열어 교반한 뒤 알갱이 여부를 보는 항목을 매 로트 검사에 넣었다(가상 사례).", "media": [{"type": "image", "file": "r6-incoming-01.svg", "caption": "도료 수입검사는 **싸고 빠른 확인부터** 쌓는다. 서류·외관·점도는 매 로트, 불휘발분 같은 시간이 드는 측정은 이력에 따라 빈도를 정한다(개념도, 빈도는 예시).", "alt": "왼쪽에서 오른쪽으로 서류·라벨, 용기·외관, 간이 측정, 색 판정, 판정·기록 다섯 상자가 화살표로 이어진다. 각 상자 위의 주황 막대는 걸리는 시간이고 간이 측정과 색 판정이 길다. 각 상자 아래에 매 로트 같은 빈도 표시가 있고, 판정·기록 상자에서 아래로 '보류·불합격 → 표시·격리' 빨간 상자로 가는 화살표가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzcyIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuPhOujjCDsiJjsnoXqsoDsgqwg64uk7ISvIOuLqOqzhOyZgCDruYjrj4Qg4oCUIOyLuOqzoCDruaDrpbgg7ZmV7J2467aA7YSwKOqwnOuFkOuPhCwg67mI64+E64qUIOyYiOyLnCk8L3RpdGxlPg0KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQogIDx0ZXh0IHg9IjE2IiB5PSIzMiIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MjAyQSI+7Iu46rOgIOu5oOuluCDtmZXsnbjrtoDthLAg7IyT64qU64ukPC90ZXh0Pg0KICA8dGV4dCB4PSIxNiIgeT0iNzYiIGZvbnQtc2l6ZT0iMTMiIGZpbGw9IiM3NzgzOEYiPuqxuOumrOuKlCDsi5zqsIQ8L3RleHQ+DQogIDxyZWN0IHg9IjE2IiB5PSI4NiIgd2lkdGg9IjE2IiBoZWlnaHQ9IjEyIiByeD0 d/73851.html", "ISO 2811-1:2023 Paints and varnishes — Determination of density — Part 1: Pycnometer method: https://www.iso.org/standard/83323.html", "ISO 3251:2019 Paints, varnishes and plastics — Determination of non-volatile-matter content: https://www.iso.org/standard/73848.html", "Talbert, Paint Technology Handbook(CRC Press 2008), 10장(입고 도료 시험, 유출컵 점도와 온도 보정, 사용 전 시험판 확인)", "Talbert, Paint Technology Handbook(CRC Press 2008), 11장(도료 온도에 따른 점도 변화 — 하이솔리드 도료)"], "note": "검사 빈도는 예시이며 품목 위험과 공급 이력으로 정한다. ISO 규격의 판·적용 범위는 ISO 카탈로그와 각국 표준 기관 목록으로 확인했다(확인 시점 2026-11)."}, {"id": "r6-lot-trace", "title": "도료 로트 추적과 부적합 격리", "aliases": ["도료 로트 추적", "paint lot traceability", "도료 사용 기록", "부적합 도료 격리", "도료 영향 범위"], "stage": "s6", "lens": "mgmt", "order": 3, "kind": "method", "oneLiner": "도료 로트 추적은 도료 로트를 도장 업체의 사용 기록으로 도장 로트·부품 로트까지 잇는 일이고, 부적합 도료가 나오면 이 고리로 격리할 재고와 출하된 부품의 범위를 정한다.", "body": "도료 불량이 확인되면 첫 질문은 '그 도료가 어디에 들어갔나'다. 답하려면 세 고리가 이어져야 한다.\n\n- **도료 로트**: 도료사 배치 번호. 2액형이면 경화제 로트와 희석제 로트도 함께 적는다. 성적서와 라벨로 식별한다.\n- **도장 로트**: 도장 업체가 그 도료를 쓴 날짜·라인·교대. 어느 도료 로트를 언제 개봉해 언제부터 언제까지 썼는지가 **도료 사용 기록**으로 남아야 한다.\n- **부품 로트**: 도장된 부품의 로트 표시(라벨·작업 지시 번호)와 출하 기록.\n\n가장 자주 끊기는 곳은 가운데 고리다. 도장 업체에 입고 기록만 있고 '어느 로트를 몇 시에 탱크에 넣었는지'가 없으면, 부품 로트에서 도료 로트로 거슬러 올라갈 수 없다. 특히 도료를 순환 탱크에 계속 **보충**하는 라인은 새 로트를 붓는 순간부터 두 로트가 섞인다. 보충 시각과 양이 없으면 영향 범위가 '그 도료를 썼을 수 있는 전체 기간'으로 넓어진다. 공정 기록 일반은 실무편 공정 관리 확인 카드를 참고한다.\n\n부적합 도료가 나오면 아래 절차로 움직인다. 핵심은 **먼저 멈추고 격리한 뒤 범위를 좁히는 것**이다. 같은 로트의 남은 도료는 우리 창고·도장 업체·도료사 재고에서 모두 찾아 표시한다. 그다음 사용 기록으로 그 로트가 쓰인 기간을 정한다. 보충 탱크라면 다음 로트로 탱크를 완전히 비우고 세척한 시점까지 포함한다. 그 기간의 부품은 공장 재고·운송 중·고객 재고로 나눠 표본 시험으로 실제 영향을 확인하고, 선별·재작업·회수 범위를 정한다. 불량 도료는 원인 조사용 시료를 남긴 뒤 반품하거나 처리한다.\n\n구매가 미리 할 일은 도장 업체 계약과 실사에서 도료 사용 기록 양식을 정해 두는 것이다. 기록이 없으면 불량 도료 한 로트 때문에 몇 달 치 부품을 모두 의심해야 한다.", "keyPoints": ["도료 로트(+경화제·희석제 로트) → 도장 로트 → 부품 로트의 세 고리를 잇는다", "가운데 고리인 도장 업체의 도료 사용 기록(개봉·투입·보충 시각과 양)이 가장 자주 끊긴다", "보충 탱크는 새 로트를 붓는 순간부터 섞인다 — 영향 범위는 탱크를 비우고 세척할 때까지다", "부적합 도료는 먼저 사용을 멈추고 세 곳 재고를 격리한 뒤 범위를 좁힌다", "사용 기록 양식은 사고 전에 계약·실사로 정해 둔다"], "tables": [{"caption": "도장 업체 도료 사용 기록 예(예시값) — 보충 시각이 있어야 섞인 구간이 보인다", "header": ["일시", "라인", "도료 로트", "경화제 로트", "작업", "양(kg)"], "rows": [["3/4 08:10", "2라인", "B26-0301", "H26-0220", "탱크 첫 투입", "60"], ["3/4 13:30", "2라인", "B26-0301", "H26-0220", "보충", "20"], ["3/5 09:00", "2라인", "B26-0315", "H26-0220", "보충(새 도료 로트)", "20"], ["3/5 14:20", "2라인", "B26-0315", "H26-0302", "보충(새 경화제 로트)", "20"], ["3/6 08:00", "2라인", "B26-0322", "H26-0302", "탱크 비우고 세척 후 투입", "60"]]}], "steps": ["부적합 로트의 사용을 멈추고, 우리 창고·도장 업체·도료사 재고에서 같은 로트를 모두 찾아 표시·격리한다", "도료 사용 기록으로 그 로트가 쓰인 라인과 기간을 정한다 — 보충 탱크는 탱크를 비우고 세척한 시점까지", "그 기간의 도장 로트·부품 로트를 뽑아 공장 재고·운송 중·고객 재고로 나눈다", "부품 표본을 시험해 실제 영향(색·부착·경화)을 확인하고 선별·재작업·회수 범위를 정한다", "원인 조사용 시료를 남긴 뒤 불량 도료를 반품하거나 처리하고, 처리 결과를 기록한다"], "checks": ["도장 업체가 도료 로트별 개봉·투입·보충 시각과 양을 기록하는지 실사 때 실제 기록으로 확인한다", "2액형은 경화제 로트와 희석제 로트까지 사용 기록에 적는지 본다", "부품 로트 라벨에서 도장 일자·라인을 거쳐 도료 로트까지 거슬러 올라가는 추적을 한 건 해 본다", "부적합 도료가 나오면 우리 창고·도장 업체·도료사 재고에서 같은 로트를 모두 격리했는지 확인한다", "보충 탱크 라인은 영향 범위를 탱크를 비우고 세척한 시점까지 잡았는지 본다"], "example": "예를 들어 A사는 도료사에서 '로트 B26-0315에 경화 촉진제가 적게 들어갔다'는 통보를 받았다. 도장 업체 사용 기록에 보충 시각이 있어, 그 로트가 3월 5일 09시부터 3월 6일 탱크 세척 전까지 2라인에서만 쓰인 것을 확인했다. 그 기간의 부품 1,800개만 격리해 경화 시험을 했고, 나머지 출하분은 의심 대상에서 뺐다(가상 사례).", "media": [{"type": "image", "file": "r6-lot-trace-01.svg", "caption": "도료 로트 → 도장 업체 사용 기록 → 도장 로트 → 부품 로트 → 출하. **가운데 사용 기록이 끊기면** 부품에서 도료로 거슬러 올라갈 수 없다(개념도, 로트 번호는 가상).", "alt": "왼쪽에서 오른쪽으로 다섯 상자가 사슬처럼 이어진다. 도료 로트(경화제·희석제 로트 포함), 도장 업체 사용 기록(개봉·투입·보충 시각), 도장 로트(날짜·라인·교대), 부품 로트(라벨), 출하(고객 로트). 두 번째 상자는 주황 테두리로 강조되고 아래에 '가장 자주 끊기는 고리'라는 빨간 설명이 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzA2IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuPhOujjCDroZztirgg7LaU7KCBIOyCrOyKrCDigJQg64+E66OMIOuhnO2KuMK37IKs7JqpIOq4sOuh 다른 도장 업체에서도 생긴다.\n- **조건을 지켜도 생긴다**: 희석·혼합비·막두께·경화로 온도 기록이 정상이다.\n- **보관 시료로 재현된다**: 도료사가 배치마다 남겨 둔 **보관 시료**(retain sample)나 남은 입고 도료로 표준 조건 시험판을 칠했을 때 같은 문제가 나오고, 다른 로트로 칠한 판은 정상이다.\n\n대표적인 도료 원인 불량은 색·광택 이탈, 겔화·점도 이상 상승, 딱딱한 침강, 경화 불량, 이물·알갱이, 도료 자체 오염에 의한 크레이터다. 같은 증상도 공정에서 생길 수 있으므로 아래 표처럼 양쪽 신호를 나란히 놓고 본다. 이물은 도막 속 깊이로도 가른다. 첫 층 안에 묻혀 있으면 도료나 도장 전 오염, 표면에 얹혀 있으면 도장 중·뒤 먼지일 가능성이 크다(Talbert 11장).\n\n증거는 판단보다 먼저 모은다. 불량 부품, 같은 로트의 미개봉 도료, 사용 기록, 경화로 기록을 보존하고, 공동 조사 때 도료사·도장 업체가 시료를 나눠 갖는다. 도료사가 원인을 인정하면 **8D 보고**(문제 정의·응급 조치·근본 원인·영구 대책·재발 방지)를 받는다. 보상은 품질 협정에서 정한 범위(도료값, 선별·재작업비, 고객 클레임 비용)로 협의한다. 대책이 처방·원료 변경이면 「도료 변경 관리」로 다시 승인한다.", "keyPoints": ["도료 원인 신호: 로트와 함께 움직임, 조건을 지켜도 발생, 보관 시료로 재현", "같은 증상도 공정에서 생길 수 있어 도료 쪽·공정 쪽 신호를 나란히 놓고 본다", "증거(불량품·미개봉 도료·사용 기록·경화로 기록)를 판단보다 먼저 보존한다", "도료 원인이면 8D 보고를 받고, 보상은 품질 협정 범위로 협의한다", "처방·원료를 바꾸는 대책은 변경 관리로 재승인한다"], "tables": [{"caption": "대표 불량의 도료 원인·공정 원인 신호(예시)", "header": ["불량", "도료 원인일 때", "공정 원인일 때", "먼저 할 확인"], "rows": [["색·광택 이탈", "로트가 바뀐 때부터, 성적서 값도 경계", "막두께·경화 온도 변동과 같이 움직임", "보관 시료 판 측색, 막두께 기록"], ["겔화·점도 상승", "미개봉 캔도 굳어 있음", "개봉 뒤 방치·유효기간 초과·고온 보관", "미개봉 캔 점도, 보관 기록"], ["딱딱한 침강", "정해진 교반으로 재분산 안 됨, 같은 로트 공통", "장기 보관·교반 부족", "교반 시험, 제조일"], ["경화 불량", "정해진 조건에서도 무르고 내용제성 낮음", "혼합비 오류·경화로 온도 부족·가사 시간 초과", "혼합·경화로 기록, 보관 시료 경화 시험"], ["이물·알갱이", "캔 안에서 이미 보임, 분산도 이탈", "부스 먼지·필터·배관 오염", "분산도 게이지, 이물 깊이, 여과 확인"], ["크레이터", "같은 로트를 쓴 다른 라인에도 발생", "한 라인에만 발생, 실리콘 오염원", "라인·로트 교차 비교"]]}], "steps": ["불량 부품·같은 로트의 미개봉 도료·사용 기록·경화로 기록을 보존하고 해당 도료 사용을 멈춘다", "불량 발생 시점을 도료 로트 교체 시점, 공정 조건 기록과 겹쳐 본다", "같은 로트를 쓴 다른 라인·업체와, 다른 로트를 쓴 같은 라인을 비교한다", "보관 시료와 다른 로트로 표준 조건 시험판을 나란히 칠해 재현 여부를 본다(도료사·도장 업체 공동)", "도료 원인이면 8D 보고를 받고 품질 협정 범위로 보상을 협의한다", "처방·원료 변경 대책은 변경 관리로 재승인하고, 다음 로트 성적서로 재발 여부를 확인한다"], "checks": ["클레임 때 불량 부품·같은 로트 미개봉 도료·사용 기록·경화로 기록을 먼저 보존했는지 확인한다", "품질 협정에 도료사 보관 시료의 보관 기간과 공동 조사 절차가 있는지 본다", "불량이 도료 로트 교체와 함께 시작·종료됐는지, 같은 로트를 쓴 다른 라인에서도 났는지 비교한다", "재현 시험은 보관 시료와 다른 로트를 같은 조건에서 나란히 칠해 비교했는지 확인한다", "8D 보고에 근본 원인·영구 대책·재발 확인 방법이 있고, 처방 변경이면 재승인 계획이 있는지 본다"], "example": "예를 들어 A사는 상도가 무르다는 경화 불량 클레임을 받았다. 도장 업체의 혼합·경화로 기록은 정상이었고, 같은 상도 로트를 쓴 다른 도장 업체에서도 같은 증상이 나왔다. 보관 시료로 칠한 판은 경화 불량이 재현됐고 다른 로트 판은 정상이었다. 도료사는 경화 촉매 계량 오류를 인정해 8D 보고를 냈고, A사는 협정에 따라 선별·재작업비를 보상받았다(가상 사례).", "media": [{"type": "image", "file": "r6-paint-claim-01.svg", "caption": "도료 원인 판별 흐름. **로트와 함께 움직이고, 조건이 정상이고, 보관 시료로 재현되면** 도료 원인으로 본다. 어느 하나라도 아니면 공정 쪽을 먼저 조사한다(개념도).", "alt": "위에서 아래로 이어지는 판단 흐름도. 맨 위 '증거 보존' 상자 아래에 세 개의 마름모 질문이 차례로 있다. 로트 교체와 함께 움직이나, 공정 조건 기록이 정상인가, 보관 시료로 재현되나. 세 질문 모두 예이면 오른쪽 아래 '도료 원인 — 8D·보상' 초록 상자로, 하나라도 아니오이면 왼쪽 '공정 원인 우선 조사' 주황 상자로 간다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDg4IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuPhOujjCDsm5Dsnbgg67aI65+JIO2MkOuzhCDtnZDrpoQg4oCUIOuhnO2KuCDrj5nrsJjCt+yhsOqxtCDsoJXsg4HCt+uztOq0gCDsi5zro4wg7J6s7ZiEKOqwnOuFkOuPhCk8L3RpdGxlPg0KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQogIDx0ZXh0IHg9IjE2IiB5PSIzMiIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MjAyQSI+7IS4IOyLoO2YuOqwgCDrqqjrkZAg66ee7Jy866m0IOuPhOujjCDsm5DsnbgsIO2VmOuCmOudvOuPhCDslYTri4jrqbQg6rO17KCV67aA7YSwPC90ZXh0Pg0KICA8cmVjdCB4PSIyMDAiIHk9IjQ4IiB3aWR0aD0iMzIwIiBoZWlnaHQ9IjQ2IiByeD0iOCIgZmlsbD0iI0U0RUFFOCIvPg0KICA8dGV4dCB4PSIzNjAiIHk9IjcwIiBmb250LXNpemU9IjE1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMTgyMDJBIj7spp3qsbAg67O07KG0PC90ZXh0Pg0KICA8dGV4dCB4PSIzNjAiIHk9Ijg4IiBmb250LXNpemU9IjEyIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjNDY1MjYwIj7rtojrn4ntkojCt+uvuOqwnOu0iSDrj4Tro4zCt+yCrOyaqSDquLDroZ3Ct+qyve2ZlOuhnCDquLDroZ08L3RleHQ+DQogIDxsaW5lIHgxPSIzNjAiIHkxPSI5NCIgeDI9IjM2MC4wIiB5Mj0iMTE4LjgiIHN0cm9rZT0iIzQ2NTI2MCIgc3Ryb2tlLXdpZHRoPSIyIi8+DQogIDxwb2x5Z29uIHBvaW50cz0iMzYwLjAsMTI2LjAgMzU2LjEsMTE3LjkgMzYzLjksMTE3LjkiIGZpbGw9IiM0NjUyNjAiLz ailure-analysis"], "pyo": ["p9-defects"], "scopes": ["claim"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 11장(도막 불량 — 이물의 위치·깊이로 출처 판별, 크레이터·실리콘 오염, 공정 원인 불량)", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 21장(분산 평가 — 분산도 게이지)"], "note": "보관 시료 기간은 도료사·계약마다 다르다. '적어도 유효기간 동안'은 업계 관행을 바탕으로 한 권장이며 법정 기준이 아니다."}, {"id": "r7-shelf-life", "title": "도료 유효기간과 재검사 연장", "aliases": ["도료 유효기간", "도료 저장 수명", "shelf life", "유효기간 연장 재검사", "잔여 유효기간"], "stage": "s7", "lens": "qual", "order": 1, "kind": "definition", "oneLiner": "도료 유효기간은 미개봉·권장 보관 조건에서 도료사가 성능을 보증하는 기간이며, 만료 뒤에는 성적서 항목 재검사에 합격한 경우에만 정한 기간을 연장할 수 있는 기한이다.", "body": "도료는 만든 날부터 조금씩 변한다. 무거운 안료가 가라앉아 바닥에 단단한 층을 만들고(침강), 수지가 서서히 반응해 점도가 오르거나 굳는다(겔화). 2액형의 경화제(이소시아네이트계)는 용기 틈으로 들어온 습기와 반응해 탁해지거나 굳고, 분체는 열을 받으면 알갱이끼리 엉겨 덩어리가 된다(Talbert 2·3장, Jones 외 12·28장). 그래서 도료사는 미개봉·권장 보관 조건에서 성능을 보증하는 기간, 곧 **유효기간**(shelf life)을 정한다. 값은 품번마다 다르지만 대표 범위는 1액형 용제형 12~24개월, 수용성·분체·2액형 경화제 6~12개월 정도다.\n\n유효기간은 **제조일부터** 흐른다. 라벨에 제조일과 유효기간(개월)을 적는 방식과 만료일을 바로 적는 방식이 있으니 사양서에 표시 방식을 정한다. 도료사 창고와 운송에서 두세 달이 지나면 우리 손에 남는 기간은 그만큼 줄어든다. 그래서 구매는 '유효기간 12개월'보다 **입고 때 남은 유효기간**(예: 9개월 이상)을 발주·수입검사 조건으로 정하는 편이 실용적이다.\n\n유효기간과 **가사 시간**(pot life)은 다르다. 가사 시간은 2액형을 섞은 뒤 쓸 수 있는 시간이고 몇십 분에서 몇 시간 단위다. 섞고 남은 도료는 각 성분의 유효기간과 상관없이 버린다.\n\n만료된 도료를 바로 버릴 필요는 없다. 많은 도료사는 만료 도료를 **재검사**해 합격하면 한 번, 정한 기간(예: 3~6개월)만 연장을 허용한다. 재검사는 점도·비중·불휘발분·분산도와 색·광택을 다시 재고, 필요하면 시편을 칠해 경화·부착까지 보는 일이다. 누가 재검사하고 누가 연장을 승인하며 연장 라벨을 어떻게 붙이는지를 품질 협정서에 미리 적어 둔다. 현장에서 선입선출이 무너지면 오래된 로트가 창고 뒤쪽에서 만료되므로 랙 구조와 라벨로 순서를 강제한다.", "keyPoints": ["유효기간은 침강·겔화·경화제 수분 반응·분체 뭉침 때문에 정하며 제조일부터 흐른다", "대표 범위: 1액형 용제형 12~24개월, 수용성·분체·2액형 경화제 6~12개월 — 품번마다 TDS로 확인한다", "발주·수입검사 조건은 '입고 시 잔여 유효기간 ○개월 이상'으로 정한다", "가사 시간은 2액형 혼합 뒤 쓸 수 있는 시간 — 유효기간과 별개다", "만료 도료는 성적서 항목 재검사에 합격할 때만 1회·정한 기간 연장한다"], "tables": [{"caption": "도료 종류별 유효기간과 재검사 때 보는 항목(대표값 — 품번 TDS가 우선)", "header": ["종류", "유효기간(대표)", "주로 상하는 방식", "재검사에서 볼 항목"], "rows": [["1액형 용제형", "12~24개월", "안료 침강, 점도 상승, 표면 피막", "교반 후 재분산, 점도, 불휘발분, 분산도"], ["수용성", "6~12개월", "동결·고온에 의한 응집, 부패로 냄새·가스", "응집물(체 거름), 점도, pH, 냄새"], ["2액형 경화제", "6~12개월", "습기와 반응해 탁해짐·굳음", "외관(탁도·결정), 점도, 시편 경화"], ["분체", "6~12개월", "열·습기로 뭉침, 흐름성 저하", "뭉침, 흐름성, 시편 외관·광택"]]}], "steps": ["만료 1개월 전에 창고 재고에서 만료 예정 로트 목록을 뽑는다", "만료 로트를 격리하고 '재검사 대기' 표시를 붙여 출고를 막는다", "도료사에 로트 번호·수량을 알리고 재검사를 요청한다", "성적서 항목을 다시 재고 필요하면 시편을 칠해 경화·부착을 본다", "합격하면 새 만료일과 연장 횟수를 적은 라벨을 붙이고, 불합격이면 지정폐기물로 처리한다", "재검사 결과와 연장 기록을 로트 기록에 남긴다"], "checks": ["사양서·발주서에 '입고 시 잔여 유효기간 ○개월 이상'과 라벨의 제조일·만료일 표시 방식을 적는다", "수입검사에서 라벨의 제조일로 잔여 유효기간을 계산해 기준 미만이면 접수 여부를 도료사와 정한다", "만료 도료 재검사 연장의 조건(항목·횟수·기간·승인자)을 품질 협정서에 정해 둔다", "도장 업체 창고에 선입선출 랙과 만료 예정 목록이 운영되는지 본다", "2액형은 유효기간과 별도로 혼합 뒤 가사 시간과 잔량 폐기 기록을 확인한다"], "example": "예를 들어 A사는 특색 상도를 한 번에 500kg씩 받았는데, 도료사 창고에서 3개월을 보낸 뒤 출하돼 입고 때 남은 유효기간이 9개월뿐이었다. 발주 때마다 끝물 100kg 가까이가 만료되자 A사는 발주서에 '입고 시 잔여 유효기간 10개월 이상'을 넣고, 만료 도료는 도료사 재검사에 합격하면 1회 3개월 연장하는 조항을 품질 협정서에 더했다(가상 사례).", "media": [{"type": "image", "file": "r7-shelf-life-01.svg", "caption": "유효기간은 **제조일부터** 흐른다. 도료사 창고·운송에서 지난 시간을 빼면 입고 때 남는 기간이 실제로 쓸 수 있는 기간이다(예시값 — 유효기간 12개월).", "alt": "0개월에서 15개월까지의 가로 시간 막대. 제조일(0)부터 출하·운송 2개월은 회색, 입고(2개월)부터 사용 한계(11개월)까지는 파란 '사용 가능 9개월', 11~12개월은 주황 '안전 여유 1개월', 12개월에 빨간 '만료' 표시가 있고, 그 뒤 12~15개월은 점선 '재검사 합격 시 1회 연장(예: 3개월)'이다. 아래에 입고 시 잔여 유효기간 10개월 화살표가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzAwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+7Jyg7Zqo6riw6rCE7J2AIOygnOyhsOydvOu2gO2EsCDtnZDrpbTqs6AsIOyeheqzoCDrlYwg64Ko7J2AIOq4sOqwhOydtCDsi6TsoJzroZwg7JO4IOyImCDsnojripQg6riw6rCE7J2064ukKOyYiOyLnOqwkik8L3RpdGxlPgogIDxkZWZzPgogICAgPG1hcmtlciBpZD0iYXIiIHZpZXdCb3g9IjAgMCA4IDgiIHJlZlg9IjciIHJlZlk9IjQiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0by1zdGFydC1yZXZlcnNlIj48cGF0aCBkPSJNMCww 모두 유효기간이 6개월 남아 있다. 남은 혼합 도료는 어떻게 하나?", "options": ["가사 시간이 지나면 폐기한다 — 유효기간은 섞기 전 각 성분의 기간이다", "유효기간이 남았으니 다음 날 써도 된다", "시너를 더 타서 점도를 맞추면 쓸 수 있다", "냉장 보관하면 유효기간까지 쓸 수 있다"], "answer": 0, "explain": "섞은 순간부터 경화 반응이 시작되므로 쓸 수 있는 시간은 가사 시간이 정한다. 시너를 타면 점도는 내려가도 반응이 진행된 도료라 부착·경화가 나빠지고 VOC도 늘어난다. 유효기간은 혼합 전 미개봉 성분에 대한 기간이다."}], "ncs": ["c04-key-material"], "silmu": ["s8-shopfloor"], "pyo": ["p6-film-formation"], "scopes": ["test"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 2장(안료 입자와 저장 중 침강, 2액형 에폭시의 가사 시간), 3장(고형분 도료의 침강과 교반)", "Jones, Nichols, Pappas, Organic Coatings 4판(Wiley 2017), 12장(이소시아네이트와 물의 반응), 28장(분체 수지의 유리 전이 온도와 저장 중 뭉침)", "PCI Magazine 'Finishing Answers' — 분체 도료 보관 조건과 저장 수명 질의응답: https://www.pcimag.com/articles/95163-finishing-answers-ask-joe-powder-5"], "note": "유효기간 대표 범위(1액형 용제형 12~24개월, 수용성·분체·2액형 경화제 6~12개월)는 교재 원리와 공개 업계 자료로 잡은 범위이며 품번마다 다르다. 재검사 연장의 횟수·기간(예: 1회 3~6개월)은 도료사 관행 예시이고 법정 기준이 아니다. 확인 시점 2026-11."}, {"id": "r7-storage", "title": "도료 보관 조건: 온도·동결·습기·교반", "aliases": ["도료 보관 온도", "수용성 도료 동결", "분체 도료 보관", "도료 창고 관리", "paint storage"], "stage": "s7", "lens": "tech", "order": 2, "kind": "method", "oneLiner": "도료 보관 조건은 품번 TDS가 정한 온도 범위와 동결 방지, 습기 차단, 장기 보관 도료의 교반을 지켜 유효기간 안의 성능을 유지하게 하는 관리 기준이다.", "body": "유효기간은 '권장 보관 조건에서'라는 전제가 붙은 숫자다. 여름 철판 창고나 겨울 옥외 컨테이너에 두면 유효기간 안에서도 도료가 상한다. 보관 조건은 도료 종류마다 다르다(아래는 대표 범위이고 실제 값은 품번 TDS가 정한다).\n\n- **용제형**: 대개 5~35℃의 서늘한 실내다. 고온에서는 용제가 새거나 점도가 오르고, 불이 붙는 액체라 열원·직사광선을 피한다. 저장 수량은 위험물 기준을 따른다.\n- **수용성**: **동결이 가장 큰 적**이다. 물이 얼었다 녹으면 수지 입자가 엉겨 덩어리가 생기고 되돌릴 수 없다(Talbert 3장, Jones 외 9장). 대개 5℃ 아래로 내려가지 않게 하고 32℃ 안팎 이상의 고온도 피한다. 겨울철 운송과 하역 대기 중의 동결도 따진다.\n- **분체**: 열과 습기에 약하다. 여름 창고에서 알갱이끼리 엉겨 덩어리가 되고(블로킹), 습기를 먹으면 흐름성이 떨어져 도장 불량이 된다(Jones 외 28장). 대개 25~30℃ 이하, 상대습도 60% 안팎 이하로 둔다. 찬 창고에서 꺼낸 박스는 결로를 막으려 밀봉한 채 작업장 온도에 맞춘 뒤 연다.\n- **2액형 경화제**: 이소시아네이트계는 공기 중 수분과 반응해 탁해지고 굳는다(Jones 외 12장). 쓰고 남은 캔은 바로 밀봉한다.\n\n**오래 둔 도료는 가라앉는다.** 안료가 침강해 바닥에 단단한 층이 생기면 위아래 성분이 달라 색·은폐·광택이 흔들린다(Talbert 2·3장). 드럼은 정한 주기로 굴리거나 뒤집고, 쓰기 전에는 교반기로 바닥까지 섞는다. 풀리지 않는 단단한 케이크는 재검사 대상이다.\n\n개봉한 캔은 뚜껑을 바로 닫고 개봉일을 적는다. 덜어 쓰는 소분 용기에도 품번·로트·유효기간을 옮겨 적어야 추적이 끊기지 않는다. 구매는 도장 업체와 자사 창고를 실사할 때 온도 기록, 동결 우려 구역, 바닥 받침, 선입선출, 개봉 캔 표시를 본다.", "keyPoints": ["보관 조건은 품번 TDS가 정한다 — 유효기간은 권장 조건을 지킬 때만 보증된다", "수용성은 동결 금지(대개 5℃ 이상), 분체는 고온·습기 금지(대개 25~30℃ 이하, 습도 60% 안팎 이하)", "이소시아네이트계 경화제는 습기와 반응한다 — 개봉 후 바로 밀봉한다", "오래 둔 도료는 침강한다 — 주기적으로 굴리고 쓰기 전 바닥까지 교반, 단단한 케이크는 재검사", "소분 용기에도 품번·로트·유효기간을 옮겨 적어 추적을 잇는다"], "tables": [{"caption": "도료 종류별 보관 조건(대표값 — 품번 TDS가 우선)", "header": ["종류", "보관 온도(대표)", "피할 것", "창고에서 볼 것"], "rows": [["용제형", "5~35℃ 안팎", "열원·직사광선, 뚜껑 열어 두기", "위험물 저장 장소·환기, 용기 밀폐"], ["수용성", "5~30℃ 안팎(동결 금지)", "영하 노출(운송·하역 대기 포함), 32℃ 안팎 이상 고온", "겨울철 난방 구역, 동결 흔적(덩어리)"], ["분체", "25~30℃ 이하, 상대습도 60% 안팎 이하", "여름 고온, 결로, 박스 위 과적재", "온습도 기록, 개봉 박스 밀봉, 적재 높이"], ["2액형 경화제", "5~35℃ 안팎", "습기, 개봉 방치", "개봉일 표시, 탁해짐·결정"]]}], "checks": ["TDS와 MSDS 7항(취급 및 저장방법)에서 품번별 보관 온도 범위를 받아 창고 기준으로 정한다", "겨울철 수용성 도료는 운송·하역 대기 중 동결 방지 조건을 발주 조건에 넣는다", "분체 창고의 여름철 온도·습도 기록과 박스 적재 높이를 본다", "드럼을 굴리는 주기와 사용 전 교반 방법(교반기·시간)이 정해져 있는지 확인한다", "개봉 캔과 소분 용기에 품번·로트·개봉일·유효기간이 적혀 있는지 본다"], "example": "예를 들어 A사의 수용성 하도가 1월에 입고된 뒤 도장 업체에서 체 거름망이 자주 막히고 도막에 알갱이가 생겼다. 확인해 보니 납품 트럭이 밤새 옥외 하역장에서 대기하는 동안 도료가 얼었다 녹은 것이었다. A사는 해당 로트를 반품하고, 동절기 수용성 도료는 당일 하역·실내 보관을 납품 조건에 넣었다(가상 사례).", "media": [{"type": "image", "file": "r7-storage-01.svg", "caption": "보관 온도 범위는 도료 종류마다 다르다. **수용성은 아래쪽(동결)**, **분체는 위쪽(고온)**이 위험하다(대표값 — 품번 TDS가 우선).", "alt": "가로축이 영하 10℃부터 45℃까지인 온도 띠 그래프. 용제형은 5~35℃, 수용성은 5~30℃에 파란 띠가 있고 0℃ 아래에 빨간 '동결 금지' 구역이 표시된다. 분체는 30℃ 이하에 띠가 있고 그 위로 빨간 '뭉침(블로킹)' 구역이, 옆에 '습도 60% 안팎 이하' 메모가 있다. 2액형 경화제는 5~35℃ 띠와 '습기 차단' 메모가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzQwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+64+E66OMIOyiheulmOuzh or"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 2장(안료 침강), 3장(수용성 도료의 동결 방지와 약 32℃ 이상 보관 회피, 고형분 도료 교반)", "Jones, Nichols, Pappas, Organic Coatings 4판(Wiley 2017), 9장(라텍스의 동결·해동 안정성), 12장(이소시아네이트와 물의 반응), 28장(분체 수지의 유리 전이 온도와 저장 중 뭉침)", "PCI Magazine 'Finishing Answers' — 분체 도료 보관 온도·습도 질의응답: https://www.pcimag.com/articles/95163-finishing-answers-ask-joe-powder-5"], "note": "보관 온도·습도 범위는 대표값이다. 분체 보관 온도는 공개 자료에서 25℃ 이하와 30℃ 이하가 함께 쓰여 25~30℃ 이하로 적었다. 수용성의 고온 상한(약 32℃)은 Talbert 3장 값이다. 실제 기준은 품번 TDS와 MSDS 7항을 따른다. 확인 시점 2026-11."}, {"id": "r7-hazmat-storage", "title": "위험물 도료 보관: 인화성 액체와 지정수량", "aliases": ["위험물 도료 보관", "지정수량 배수", "제4류 위험물 도료", "인화성 액체 보관", "소량위험물"], "stage": "s7", "lens": "mgmt", "order": 3, "kind": "framework", "oneLiner": "위험물 도료 보관은 용제형 도료와 시너를 제4류 인화성 액체로 분류하고 품명별 지정수량 배수로 저장 장소의 허가·조례 기준을 판단하는 관리 체계이다.", "body": "용제형 도료와 시너는 불이 붙는 액체다. 위험물안전관리법은 이를 **제4류 위험물(인화성 액체)**로 정하고, 1기압에서의 **인화점**(불씨를 대면 불이 붙는 가장 낮은 온도)으로 품명을 나눈다(시행령 별표 1). 인화점 21℃ 미만은 제1석유류, 21℃ 이상 70℃ 미만은 제2석유류, 70℃ 이상 200℃ 미만은 제3석유류다. 같은 품명도 비수용성이냐 수용성이냐에 따라 **지정수량**이 달라, 비수용성 제1석유류는 200L, 제2석유류는 1,000L다. 도료류는 가연성 액체량이 40중량% 이하이면 제3·제4석유류에서 빠지고, 제2석유류도 인화점·연소점 조건을 함께 만족하면 빠진다. 그래서 같은 '도료'라도 품번마다 품명이 다르고, 확인 근거는 도료사 MSDS의 9항(인화점)과 14·15항이다.\n\n한 장소에 여러 위험물을 두면 품목마다 저장량을 지정수량으로 나눈 값을 더한 **지정수량 배수**로 판단한다. 이 합이 1 이상이면 지정수량 이상으로 보아, 시·도지사의 허가를 받은 저장소가 아닌 곳에는 둘 수 없다(법 제5·6조). 1 미만이라고 기준이 없는 것은 아니다. 지정수량 미만의 저장·취급 기준은 시·도 조례가 정하고(법 제4조), 서울특별시 조례처럼 지정수량의 5분의 1 이상을 **소량위험물**로 따로 관리하는 곳이 많다.\n\n이 의무는 도료를 저장하는 사업장, 곧 도장 업체나 자사 창고를 운영하는 쪽에 있다. 구매 담당이 허가를 받는 것은 아니지만, 발주량이 저장소의 허가 배수를 넘기면 업체가 법을 어기게 되거나 납품을 받을 수 없다. 그래서 대량 발주, 사급 전환, 포장 단위 변경 전에 보관 장소의 허가 품명·배수와 최대 재고를 맞춰 본다. 위험물 운반 용기와 적재·운반 기준(법 제20조)은 운반하는 쪽(도료사·운송사)이 지키고, 입고 때는 용기 표시와 MSDS의 품명이 맞는지 본다. 인화성 증기가 모이는 도장 부스의 방폭·환기는 표면처리편 도장 부스와 환경에서 다뤘다.", "keyPoints": ["용제형 도료·시너는 제4류 인화성 액체 — 인화점 21℃ 미만 제1석유류, 21~70℃ 제2석유류, 70~200℃ 제3석유류", "지정수량(비수용성): 제1석유류 200L, 제2석유류 1,000L, 제3석유류 2,000L — 수용성은 두 배", "배수 합 = Σ(저장량 ÷ 지정수량), 1 이상이면 허가받은 저장소에만 둔다(법 제5조)", "지정수량 미만은 시·도 조례가 정하고, 5분의 1 이상을 소량위험물로 관리하는 곳이 많다", "의무는 저장 사업장에 있다 — 구매는 발주량·포장 변경 전에 허가 배수와 최대 재고를 대조한다"], "tables": [{"caption": "제4류 인화성 액체의 품명과 지정수량(위험물안전관리법 시행령 별표 1, 2024.4.30 개정분, 확인 시점 2026-11)", "header": ["품명", "기준(1기압)", "지정수량 — 비수용성", "지정수량 — 수용성"], "rows": [["특수인화물", "발화점 100℃ 이하, 또는 인화점 −20℃ 이하이면서 비점 40℃ 이하", "50L", "50L"], ["제1석유류", "인화점 21℃ 미만", "200L", "400L"], ["알코올류", "탄소 1~3개인 포화 1가 알코올", "400L", "400L(구분 없음)"], ["제2석유류", "인화점 21℃ 이상 70℃ 미만", "1,000L", "2,000L"], ["제3석유류", "인화점 70℃ 이상 200℃ 미만", "2,000L", "4,000L"], ["제4석유류", "인화점 200℃ 이상 250℃ 미만", "6,000L", "6,000L(구분 없음)"]]}, {"caption": "도장 업체 창고의 지정수량 배수 계산(예시값 — 품명은 MSDS로 확인)", "header": ["품목", "품명(예시)", "저장량", "지정수량", "배수"], "rows": [["상도 도료 20L × 40캔", "제2석유류 비수용성", "800L", "1,000L", "0.80"], ["시너 20L × 5캔", "제1석유류 비수용성", "100L", "200L", "0.50"], ["경화제 20L × 10캔", "제2석유류 비수용성", "200L", "1,000L", "0.20"], ["합계", "—", "1,100L", "—", "1.50 → 지정수량 이상"]]}], "steps": ["품목마다 MSDS 9항(인화점)·14항(운송 정보)·15항(법적 규제 현황)으로 위험물 품명과 수용성 구분을 확인한다", "보관 장소별 최대 저장량(평소 재고 최대치 + 입고 직후 물량)을 정한다", "품목별 저장량 ÷ 지정수량을 더해 배수 합을 구한다", "1 이상이면 허가 저장소와 허가 배수를, 1 미만이면 관할 시·도 조례의 기준(소량위험물 등)을 확인한다", "발주량·포장 단위·사급 범위를 바꿀 때마다 다시 계산한다"], "checks": ["도료사 MSDS 9항 인화점과 15항 법적 규제 현황에서 품목별 위험물 품명과 수용성 구분을 확인한다", "도장 업체·자사 창고의 위험물 저장소 허가 서류에 적힌 품명·배수와 실제 최대 재고를 비교한다", "대량 발주·사급 전환·포장 단위 변경 전에 최대 재고 기준으로 배수 합을 다시 계산한다", "지정수량 미만 보관 장소는 관할 시·도 조례의 소량위험물 기준(표지·소화 설비 등)을 지키는지 본다", "입고 때 용기의 위험물 표시와 MSDS의 품명이 일치하는지 확인한다"], "example": "예를 들어 A사가 단가를 낮추려고 시너를 20L 캔 대신 200L 드럼으로 사급하기로 했다. 도장 업체 위험물 저장소의 허가 배수는 3배였는데, 비수용성 제1석유류 드럼 두 개(400L)만으로 배수가 2 늘어 기존 도료 재고와 합치면 4배를 넘었다. A사는 드럼 전환을 미루고 캔 단위로 월 2회 나눠 납품하게 바꿨다(가상 사례).", "media": [{"type": "image", "file": "r7-hazmat-storage-01.svg", "caption": "지정수량 배수는 품목마다 '저장량 ÷ 지정수량'을 더해 구한다. 합이 1 이상이면 허가 저장소, 1 미만은 시·도 조례 기준을 따른다(예시값).", "alt": "위쪽에 상도 도료 800L ÷ 1,000L = 0.80, 시너 100L ÷ 200L = 0.50, 경화제 200L ÷ 1,000L = 0.20의 세 막대가 쌓여 합계 1.50이 된다. 아래에 배수 합을 판정하는 세 칸 : "강판은 녹만 막으면 오래 두어도 쓸 수 있지만 도료는 유효기간이 지나면 못 쓴다. 그래서 도료 발주는 경제적 주문량(EOQ)처럼 주문비와 보관비만 맞추는 계산으로 끝나지 않고, **유효기간 안에 다 쓸 수 있는가**를 먼저 따진다.\n\n발주량을 묶는 제약은 셋이다.\n- **포장 단위**: 4L 캔, 18~20L 캔(말통), 200L 드럼, 1,000L IBC, 분체 20~25kg 박스. 단위가 클수록 kg당 값은 싸지만 한 번 열면 빨리 써야 한다.\n- **최소 생산량(MOQ)**: 도료사는 배치 단위로 만든다. 소량 특색은 한 배치가 수백 kg이라 월 사용량이 적으면 대부분이 창고에서 늙는다.\n- **잔여 유효기간**: 입고 때 남은 기간에서 재검사·사용 준비 여유를 빼면 실제로 쓸 수 있는 기간이 나온다(도료 유효기간과 재검사 연장 참고).\n\n이 셋을 묶은 것이 D3 공식이다. 월 사용량 U에 쓸 수 있는 기간(L − m)을 곱한 **사용 가능량** Q_use보다 발주량 Q가 크면 남는 W는 버려진다. 버린 도료값과 폐기 처리비는 실제로 쓴 도료가 떠안으므로, 표시 단가가 같아도 **실질 단가**는 크게 오른다. 예시처럼 월 40kg 쓰는 특색을 MOQ 500kg으로 사면 140kg이 버려져 실질 단가가 표시 단가보다 약 41% 비싸다.\n\n대응은 Q_use를 늘리거나 Q를 줄이는 쪽이다. 입고 시 잔여 유효기간을 계약으로 늘리고, 같은 색을 쓰는 품목을 묶어 U를 키우고(도료 원가 절감 참고), MOQ를 낮추거나 대리점 조색처럼 소량으로 받을 수 있는 경로를 찾는다. 단가가 조금 비싸도 폐기가 없으면 더 싼 경우가 많다. 안전 재고는 도료사 리드 타임 동안의 사용량으로 잡되 유효기간 안에 소진되는 수준을 넘지 않게 한다. 사급이면 이 재고와 폐기 책임이 발주사에 남는다. 단종되는 색은 마지막 생산 때 남은 수명 동안 쓸 양만 사고 대체 도료 승인 일정을 함께 잡는다. 아래 실습에서 월 사용량·최소 생산량·잔여 유효기간을 바꿔 보며 실질 단가가 어떻게 달라지는지 확인한다.", "keyPoints": ["사용 가능량 Q_use = U × (L − m) — 소비 속도와 입고 시 잔여 유효기간이 최대 발주량을 정한다", "발주량 Q = max(MOQ, U × 발주 주기)를 포장 단위로 올림, 폐기 예상량 W = max(0, Q − Q_use)", "실질 단가 = (Q × 단가 + W × 폐기 처리비) ÷ (Q − W) — 예시에서 표시 단가보다 약 41% 비싸다", "대응: 잔여 유효기간 계약, 색 통합으로 U 키우기, MOQ·포장 단위 조정, 소량 공급 경로", "사급 도료는 재고·폐기 책임이 발주사에 남는다 — 단종 색은 마지막 구매량을 계산한다"], "tables": [{"caption": "같은 특색 상도, 조건에 따른 실질 단가(예시값 — 단가 9,000원/kg, 폐기 처리비 500원/kg, 안전 여유 1개월, 발주 주기 3개월)", "header": ["조건", "발주량 Q", "사용 가능량 Q_use", "폐기 W", "실질 단가"], "rows": [["기본: U 40kg/월, L 10개월, MOQ 500kg", "500kg", "360kg", "140kg", "12,694원/kg(+41%)"], ["입고 시 잔여 유효기간 12개월로 계약", "500kg", "440kg", "60kg", "10,295원/kg(+14%)"], ["두 품목 색 통합으로 U 60kg/월", "500kg", "540kg", "0kg", "9,000원/kg"], ["대리점 소량 조색 11,000원/kg, MOQ 없음", "120kg", "360kg", "0kg", "11,000원/kg(+22%)"]]}], "formulas": [{"name": "유효기간을 따진 발주량과 실질 단가(D3)", "expr": "Q_use = U × (L − m) · Q = max(MOQ, U × 발주 주기) → 포장 단위로 올림 · W = max(0, Q − Q_use) · 실질 단가 = (Q × 단가 + W × 폐기 처리비) ÷ (Q − W)", "vars": {"Q_use": "사용 가능량(kg) — 유효기간 안에 쓸 수 있는 양", "U": "월 사용량(kg/월)", "L": "입고 시 잔여 유효기간(개월)", "m": "안전 여유(개월) — 재검사·사용 준비 여유", "Q": "발주량(kg)", "MOQ": "최소 생산량(kg)", "발주 주기": "몇 개월치씩 발주하는가(개월)", "W": "폐기 예상량(kg)", "단가": "표시 단가(원/kg)", "폐기 처리비": "지정폐기물 위탁 처리비(원/kg)"}, "example": "U 40kg/월, 발주 주기 3개월, MOQ 500kg, 포장 20kg, L 10개월, m 1개월, 단가 9,000원/kg, 폐기 처리비 500원/kg → Q_use = 40 × 9 = 360kg, Q = max(500, 120) = 500kg(20kg × 25캔), W = 500 − 360 = 140kg → 실질 단가 = (4,500,000 + 70,000) ÷ 360 = 12,694원/kg. 표시 단가보다 약 41% 비싸다"}], "checks": ["견적·발주 전에 월 사용량, MOQ, 포장 단위, 입고 시 잔여 유효기간을 한 표로 받아 Q_use와 W를 계산한다", "폐기 예상량이 생기면 표시 단가가 아니라 실질 단가로 소량 조색·잔여 유효기간 계약·색 통합 대안을 비교한다", "안전 재고가 리드 타임 사용량을 크게 넘어 유효기간 안에 소진되지 않는 수준은 아닌지 본다", "사급 도료는 재고·폐기 책임과 정산 기준을 계약서에 적었는지 확인한다", "단종 예정 색은 마지막 생산량을 남은 수명 동안의 사용량으로 정하고 대체 도료 승인 일정을 잡는다"], "example": "예를 들어 A사의 담당자는 특색 상도의 kg 단가 9,000원이 표준색보다 겨우 6% 비싸다고 보고했다. 그러나 월 40kg을 쓰는데 MOQ가 500kg이라 발주 때마다 140kg을 버리고 있었고, 실질 단가는 12,694원/kg이었다. 디자인 부서와 협의해 비슷한 회색을 쓰는 두 제품의 색을 통합하자 월 사용량이 60kg이 되어 폐기가 사라졌다(가상 사례, 예시값).", "media": [{"type": "image", "file": "r7-inventory-01.svg", "caption": "500kg을 받아 월 40kg씩 쓰면 사용 한계(9개월)에 140kg이 남는다. 이 **폐기 예상량**이 실질 단가를 올린다(D3, 예시값).", "alt": "가로축 개월(0~13), 세로축 재고(kg, 0~500)인 그래프. 재고선이 0개월 500kg에서 매달 40kg씩 내려간다. 9개월 위치에 빨간 세로 점선 '사용 한계 L − m = 9개월'이 있고, 그 시점 재고 140kg이 빨간 영역 '폐기 예상량 W 140kg'으로 칠해져 있다. 0~9개월 동안 쓴 양 360kg은 파란 화살표 '사용 가능량 Q_use 360kg'으로 표시된다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzYwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCiAgPHRpdGxlPjUwMGtn7J2EIOuwm+yVhCDsm5QgNDBrZ+yUqSDsk7DrqbQg7IKs7JqpIO2VnOqzhCA56rCc7JuU7JeQIDE0MGtn7J20IOuCqOyVhCDtj5DquLDrkJzri6QoRDMsIOyYiOyLnOqwkik8L3RpdGxlPg0KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQogIDx0ZXh0IHg9IjE2IiB5PSIyOCIgZm9udC1zaXplPSIxNyI 지 않았다. 확인 시점 2026-11."}, {"id": "r8-msds-ghs", "title": "MSDS와 GHS 표시: 구매 담당이 확인할 것", "aliases": ["물질안전보건자료 확인", "GHS 경고표지", "GHS 그림문자", "MSDS 16항목", "MSDS 개정본"], "stage": "s8", "lens": "mgmt", "order": 1, "kind": "document", "oneLiner": "MSDS와 GHS 표시는 도료의 유해성과 취급 방법을 16개 항목 자료와 용기 경고표지로 전하는 제도이며, 구매가 최신본과 품번·성분·규제 정보를 대조해야 하는 서류이다.", "body": "도료는 용제·안료·경화제가 섞인 화학 제품이라 대부분 산업안전보건법의 **물질안전보건자료**(MSDS, material safety data sheet) 대상이다. 의무는 단계마다 주체가 다르다(법 제110~115조).\n- **제조·수입자**(도료사, 수입 도료는 수입자): MSDS를 작성해 제조·수입 전에 제출하고, 성분·유해성이 바뀌면 개정본을 제출한다.\n- **양도·제공자**(도료사·대리점): 받는 쪽에 MSDS와 개정본을 주고, 용기·포장에 **경고표지**를 붙인다.\n- **취급 사업주**(도장 업체, 도료를 쓰는 자사 공장): 작업장에 MSDS를 게시하거나 비치하고, 근로자를 교육하고, 덜어 쓰는 용기에도 경고표시를 한다.\n\n구매 담당 개인의 법적 의무는 아니지만 공급 계약의 서류 요건으로 챙길 일이다. 새 품번은 승인 서류에, 개정 MSDS는 변경 통보 대상에 넣는다.\n\nMSDS는 고용노동부 고시가 정한 **16개 항목**을 순서대로 적는다. 구매가 주로 보는 곳은 1항(제품명·공급자 — 품번이 맞는가), 2항(유해성·위험성과 그림문자), 3항(구성 성분과 함유량), 7항(취급·저장 방법), 9항(인화점 등 물리화학적 특성), 13항(폐기), 14항(운송 정보), 15항(법적 규제 현황), 16항(작성·개정일)이다. 3항에 성분명 대신 영업비밀이라고 적혀 있으면 그 **대체자료**가 고용노동부 승인을 받은 것인지 확인한다. 승인의 유효기간은 5년이다(법 제112조).\n\n경고표지에는 제품명, **그림문자**, **신호어**('위험' 또는 '경고'), 유해·위험 문구, 예방조치 문구, 공급자 정보가 들어간다(시행규칙 제170조). 수입 도료도 MSDS는 한글 작성이 원칙이고(고시 제11조), 외국어 원본을 번역할 때는 처음 작성한 기관과 시기를 적는다. 안전보건공단 사이트의 공개 자료는 참고용이며, 실제로 납품되는 품번의 MSDS는 공급자에게서 받는다. 성능은 TDS, 위험은 MSDS라는 구분은 도료 품번과 TDS·MSDS 읽기에서 보았다.", "keyPoints": ["작성·제출은 제조·수입자, 제공·경고표지는 양도·제공자, 게시·교육은 취급 사업주(법 제110~115조)", "16개 항목 중 1·2·3·7·9·13·14·15·16항이 구매·창고·폐기 판단에 쓰인다", "영업비밀 성분은 고용노동부 승인(유효 5년)을 받은 대체자료인지 확인한다", "경고표지 = 제품명·그림문자·신호어·유해위험 문구·예방조치 문구·공급자 정보", "수입 도료도 한글 MSDS가 원칙 — 개정본은 변경 통보로 받는다"], "tables": [{"caption": "MSDS 16개 항목과 구매·현장에서 보는 것(「화학물질의 분류·표시 및 물질안전보건자료에 관한 기준」 제10조, 확인 시점 2026-11)", "header": ["항목", "이름", "구매·현장에서 보는 것"], "rows": [["1", "화학제품과 회사에 관한 정보", "제품명·공급자가 납품 품번·라벨과 같은가"], ["2", "유해성·위험성", "그림문자·신호어가 경고표지와 같은가"], ["3", "구성성분의 명칭 및 함유량", "규제 물질 함유, 영업비밀 대체자료 승인"], ["4", "응급조치요령", "현장 게시"], ["5", "폭발·화재시 대처방법", "알맞은 소화 수단"], ["6", "누출사고시 대처방법", "창고 방제 용품"], ["7", "취급 및 저장방법", "보관 온도, 혼합 보관 금지"], ["8", "노출방지 및 개인보호구", "도장 작업자 보호구"], ["9", "물리화학적 특성", "인화점(위험물 품명), 비중"], ["10", "안정성 및 반응성", "피해야 할 조건·물질"], ["11", "독성에 관한 정보", "안전 부서에 전달"], ["12", "환경에 미치는 영향", "환경 부서에 전달"], ["13", "폐기 시 주의사항", "폐도료·빈 용기 처리"], ["14", "운송에 필요한 정보", "UN 번호·운송 분류"], ["15", "법적규제 현황", "위험물·유해화학물질·화평법 해당 여부"], ["16", "그 밖의 참고사항", "작성·개정일과 개정 이력"]]}], "checks": ["새 품번 승인 서류에 최신 MSDS(작성·개정일 확인)와 경고표지 견본을 넣는다", "MSDS 1항 제품명·공급자가 TDS·성적서·라벨의 품번과 같은지 본다", "3항에 영업비밀 표시가 있으면 대체자료 승인번호와 유효기간을 확인한다", "15항 법적 규제 현황으로 위험물·유해화학물질 해당 여부를 창고·환경 담당에 전달한다", "수입 도료는 한글 MSDS·한글 경고표지가 오는지, 개정본 전달 경로가 계약에 있는지 확인한다"], "example": "예를 들어 A사가 도장 업체에서 받은 상도 MSDS를 보니 16항 개정일이 6년 전이었다. 도료사는 그사이 용제 조성을 바꿔 인화점이 내려간 개정본을 이미 냈고, 개정본으로 다시 따지니 창고의 위험물 품명이 제2석유류에서 제1석유류로 바뀌어 지정수량 배수가 늘었다. A사는 도료사가 MSDS를 개정하면 발주사에도 동시에 보내는 조항을 품질 협정서에 넣었다(가상 사례).", "media": [{"type": "image", "file": "r8-msds-ghs-01.svg", "caption": "경고표지는 **여섯 요소**로 이루어진다. 견본은 가상 제품이며 그림문자는 단순화해 그렸다(산업안전보건법 시행규칙 제170조 기준).", "alt": "가상 제품 '가상 상도 GX-100 회색(용제형)' 경고표지 견본. 위에 제품명, 그 아래 마름모 그림문자 세 개(불꽃, 느낌표, 사람 가슴 모양 건강 유해), 굵은 신호어 '위험', 유해·위험 문구 두 줄, 예방조치 문구 세 줄, 맨 아래 가상 공급자 이름과 전화번호가 있다. 각 요소 옆에 번호 말풍선으로 ① 명칭 ② 그림문자 ③ 신호어 ④ 유해·위험 문구 ⑤ 예방조치 문구 ⑥ 공급자 정보가 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDQwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+6rK96rOg7ZGc7KeA7J2YIOyXrOyEryDsmpTshowg4oCUIOuqhey5rSwg6re466a866y47J6QLCDsi6DtmLjslrQsIOycoO2VtMK37JyE7ZeYIOusuOq1rCwg7JiI67Cp7KGw7LmYIOusuOq1rCwg6rO16riJ7J6QIOygleuztCjqsIDsg4Eg7KCc7ZKIIOqyrOuzuCk8L3RpdGxlPgogIDxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNGQUZDRkIiLz4KICA8dGV4dCB4PSIxNiIgeT0iMzAiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxODIwMkEiPuqyveqzoO2RnOyngOuKlCDsl6zshK8g7JqU7IaM66GcIOydtOujqOyWtOynhOuLpCjqsIDsg4Eg7KCc7ZKIIOqyrOuzuCwg6 , "aliases": ["화평법", "화관법", "K-REACH", "화학물질 등록 확인", "유해화학물질 영업허가"], "stage": "s8", "lens": "mgmt", "order": 2, "kind": "framework", "oneLiner": "화평법·화관법은 화학물질의 등록·정보 제공과 유해화학물질의 취급기준·영업허가를 정한 두 법이며, 도료 구매에서는 의무를 지는 제조·수입자와 취급 사업장을 구분해 확인하는 틀이다.", "body": "도료 한 캔에는 수십 가지 화학물질이 들어 있고, 그 물질들은 두 법의 관리를 받는다. 이름이 비슷해 헷갈리지만 묻는 질문이 다르다.\n\n**화평법**(화학물질의 등록 및 평가 등에 관한 법률)은 '이 물질을 시장에 내놓아도 되는가'를 묻는다. 연간 1톤 이상 제조·수입하는 화학물질은 제조·수입 전에 등록하고, 연간 1톤 미만의 신규화학물질은 신고한다(제10조). 기존화학물질은 양에 따라 등록 유예기간이 있다. 의무를 지는 쪽은 **물질을 제조·수입하는 자**다. 도료는 혼합물이라 국내 도료사가 원료를 사서 만들면 등록 의무는 원료 제조·수입자에게 있고, 도료를 통째로 수입하면 그 **수입자**가 도료 속 물질들의 등록·신고를 맡는다. 등록·신고된 물질이 든 혼합물을 넘길 때는 등록번호 같은 정보를 MSDS에 담아 넘긴다(제29조).\n\n**화관법**(화학물질관리법)은 '이 물질을 다루는 곳이 안전한가'를 묻는다. 제조·수입자는 성분이 유해화학물질 등에 해당하는지 확인해 제출하고(제9조), 유해화학물질을 다루는 사람은 누구나 취급기준(종류가 다른 물질 혼합 보관 금지, 용기 관리 등)과 표시를 지켜야 한다(제13·16조). 유해화학물질을 제조·판매·보관·운반하거나 **도장 같은 작업에 쓰는 사용업**은 기준에 해당하면 영업허가 대상이다(제27·28조). 도료사·대리점뿐 아니라 도장 업체도 허가 대상일 수 있다는 뜻이다.\n\n구매가 볼 것은 두 가지다. 첫째, 공급 경로의 **의무 주체가 제 역할을 하는가**다. 국내 도료사에는 원료 등록 대응 현황을, 수입 대리점에는 수입자로서 등록·신고 이행 여부를 확인한다. 등록되지 않은 물질이 들어 있으면 어느 날 수입·판매가 막혀 공급이 끊긴다. 둘째, **발주사가 해외 도료를 직접 들여오면 발주사가 수입자**가 되어 등록·신고·화학물질확인과 MSDS 작성 의무를 떠안는다. 직구매로 단가를 낮추기 전에 이 비용과 책임을 넣어 비교한다. 도장 업체가 유해화학물질 사용업 허가 대상이라면 실사 때 허가증을 본다.", "keyPoints": ["화평법 = 시장 출시 전 물질 등록(연간 1톤 이상)·신고(1톤 미만 신규) — 의무는 제조·수입자(제10조)", "혼합물인 도료는 원료 제조·수입자 또는 도료 수입자가 물질별로 등록·신고한다", "화관법 = 취급기준·표시(누구나), 화학물질확인(제조·수입자), 영업허가(제조·판매·보관·운반·사용업)", "도장 업체도 유해화학물질 사용업 허가 대상일 수 있다 — 실사 때 허가증을 본다", "해외 도료 직구매 = 발주사가 수입자 — 등록·신고·MSDS 의무와 비용을 먼저 따진다"], "tables": [{"caption": "도료 공급 경로별 의무 주체(화평법 제10조, 화관법 제9조, 확인 시점 2026-11)", "header": ["공급 경로", "물질 등록·신고(화평법)", "화학물질확인(화관법)", "구매 확인 포인트"], "rows": [["국내 도료사가 제조", "원료 제조·수입자", "원료 제조·수입자", "원료 등록 대응 현황, 등록번호의 MSDS 반영"], ["수입 대리점 경유", "대리점(수입자)", "대리점(수입자)", "수입자로서 등록·신고 이행 증빙"], ["발주사가 직수입", "발주사(수입자)", "발주사(수입자)", "등록·신고 비용·기간, 한글 MSDS 작성 부담"]]}], "checks": ["공급 경로(국내 제조·수입 대리점·직수입)별로 화평법 등록·신고 의무 주체를 표로 정리한다", "수입 도료는 수입자의 등록·신고 이행 증빙과 MSDS의 등록번호 반영 여부를 받는다", "해외 도료 직구매를 검토할 때 발주사가 지게 될 수입자 의무와 비용을 단가 비교에 넣는다", "도장 업체 실사 때 유해화학물질 사용업 허가 대상인지, 허가증과 취급시설 검사 결과를 확인한다", "MSDS 15항의 화평법·화관법 규제 현황이 바뀌면 개정본을 받는다"], "example": "예를 들어 A사는 해외 도료사의 특수 하도를 국내 대리점보다 20% 싸게 직수입하려 했다. 검토해 보니 A사가 수입자가 되어 도료 속 물질의 등록·신고, 화학물질확인, 한글 MSDS 작성을 직접 해야 했고, 그 비용과 기간을 넣자 이점이 거의 사라졌다. A사는 국외 제조자가 선임한 국내 대리인이 등록을 맡는 방식이 가능한지 먼저 확인하기로 했다(가상 사례).", "media": [{"type": "image", "file": "r8-k-reach-01.svg", "caption": "공급 경로마다 **누가 수입자인가**가 의무를 정한다. 해외 도료를 직수입하면 발주사가 화평법·화관법의 수입자 의무를 진다(개념도, 확인 시점 2026-11).", "alt": "왼쪽에 원료 제조·수입자, 국내 도료사, 수입 대리점, 해외 도료사 상자가 있고 오른쪽의 도장 업체와 발주사로 화살표가 이어진다. 원료 제조·수입자와 수입 대리점 위에는 '화평법 등록·신고, 화관법 화학물질확인' 꼬리표가, 도료사·대리점에는 '정보 제공(MSDS)', 도장 업체에는 '취급기준·표시, 사용업 영업허가(해당 시)' 꼬리표가 붙어 있다. 해외 도료사에서 발주사로 바로 가는 빨간 점선 화살표에 '직수입 = 발주사가 수입자'가 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDEwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+64+E66OMIOqzteq4iSDqsr3roZzrp4jri6Qg64iE6rCAIOyImOyeheyekOyduOqwgOqwgCDtmZTtj4nrspXCt+2ZlOq0gOuylSDsnZjrrLTrpbwg7KCV7ZWc64ukKOqwnOuFkOuPhCwg7ZmV7J24IOyLnOygkCAyMDI2LTExKTwvdGl0bGU+CiAgPGRlZnM+CiAgICA8bWFya2VyIGlkPSJhciIgdmlld0JveD0iMCAwIDggOCIgcmVmWD0iNyIgcmVmWT0iNCIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCwwIEw4LDQgTDAsOCB6IiBmaWxsPSIjNDY1MjYwIi8+PC9tYXJrZXI+CiAgICA8bWFya2VyIGlkPSJhcnIiIHZpZXdCb3g9IjAgMCA4IDgiIHJlZlg9IjciIHJlZlk9IjQiIG1hcmtlcldpZHRoPSI4IiBtYXJrZXJIZWlnaHQ9IjgiIG9yaWVudD0iYXV0byI+PHBhdGggZD0iTTAsMCBMOCw0IEwwLDggeiIgZmlsbD0iI0M0MzgyQyIvPjwvbWFya2VyPgogIDwvZGVmcz4KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+CiAgPHRleHQgeD0iMTYiIHk9IjMwIiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMTgyMDJBIj7riITqsIAgJ+yImOyeheyekCfsnbjqsIDqsIAg7J2Y66y066W8IOygle2VnOuLpCjtmZTtj4nrspXCt+2ZlOq0gOuylSk8L3RleHQ+CiAgPCEtLSDsmbzsq 등록번호만", "유해화학물질 사용업 영업허가 대상인지와 허가증, 취급기준 이행 상태"], "answer": 3, "explain": "화관법은 도장처럼 작업 과정에서 유해화학물질을 쓰는 영업을 사용업으로 보고, 기준에 해당하면 영업허가를 받게 한다. 취급기준과 표시는 허가와 상관없이 누구나 지켜야 한다. 단가·두께·등록번호는 이 질문과 관계가 없다."}], "silmu": ["s6-hazmat"], "pyo": ["p9-environment"], "scopes": ["vendor", "spec"], "sources": ["화학물질의 등록 및 평가 등에 관한 법률 제10조(연간 1톤 이상 등록, 1톤 미만 신규화학물질 신고, 기존화학물질 등록 유예), 제29조(혼합물 양도 시 정보 제공), 제38조(국외 제조·생산자가 선임한 자): https://www.law.go.kr/법령/화학물질의등록및평가등에관한법률", "화학물질관리법 제9조(화학물질확인 — 제조·수입자), 제13조(유해화학물질 취급기준), 제16조(표시), 제27조(영업 구분 — 사용업에 도장 포함), 제28조(영업허가): https://www.law.go.kr/법령/화학물질관리법", "신규화학물질 등록 기준 0.1톤 → 1톤 상향 법 개정 보도(서울신문, 2024.1.26): https://m.seoul.co.kr/news/2024/01/26/20240126008001", "한국화학융합시험연구원(KTR) 화관법 개요 — 물질별 영업자 의무: https://ktr.or.kr/educonsulting/test-technology/contentsid/172/index.do"], "note": "등록 기준(연간 1톤)과 의무 주체는 법 원문(2026.5.12 시행본)과 2024년 개정 보도를 대조했다. 유해화학물질 영업허가의 함량·수량 기준과 면제 범위는 시행규칙·고시(유해화학물질의 영업허가 등에 관한 규정)로 정해지며 이 카드에서는 다루지 않았다. 국외 제조자가 선임한 대리인이 화관법 화학물질확인까지 맡을 수 있는지는 확인하지 못했다. 확인 시점 2026-11."}, {"id": "r8-svhc", "title": "REACH SVHC·RoHS와 금지·제한 성분", "aliases": ["REACH SVHC", "SVHC 함유 신고", "RoHS 도막 판정", "유해 물질 미함유 보증", "후보 목록 물질"], "stage": "s8", "lens": "qual", "order": 3, "kind": "framework", "oneLiner": "REACH SVHC·RoHS 대응은 고객이 요구하는 금지·제한 성분 정보를 도료사에서 받아 건조 도막이나 부품 기준으로 환산해 넘기는 일이며, 규제마다 분모가 다른 것이 핵심이다.", "body": "EU로 가는 제품의 부품이면 고객은 도장 부위까지 성분 정보를 요구한다. 판금 부품에서 그 정보의 출발점은 도료다. 납·크롬산염 방청 안료처럼 예전에 흔했던 성분은 대부분 퇴출됐지만(안료와 PVC 참고), 지금도 가소제·안료·첨가제로 규제 목록 물질이 들어갈 수 있다. 제도의 큰 틀은 실무편 유해 물질 규제에서 보았으니 여기서는 도료를 사는 쪽에서 달라지는 점을 본다.\n\n**RoHS**(EU 전기·전자제품)는 **균질 물질** 기준이다. 납·수은·6가 크롬·PBB·PBDE·프탈레이트 4종은 0.1%, 카드뮴은 0.01%를 넘으면 안 된다(EU 2015/863). 도막은 바탕 금속과 조성이 달라 보통 별도의 균질 물질로 보므로, 부품 전체가 아니라 **건조 도막 속 농도**로 판정한다.\n\n**REACH 제33조**는 고위험 우려 물질(SVHC) 후보 목록 물질이 **성형품(부품)**에 0.1%(w/w)를 넘게 들어 있으면 받는 쪽에 최소한 물질 이름을 포함한 안전 사용 정보를 주게 한다. 도막은 부품의 일부이므로 분모가 부품 무게다. 도료 자체는 혼합물이라 제33조가 아니라 SDS 규정을 따른다. 위험 분류 대상이 아닌 도료라도 후보 목록 물질이 0.1% 이상이면 요청 시 SDS를 줘야 한다(제31조 제3항).\n\n그래서 같은 숫자에 분모가 셋이다. 도료사 성분표는 대개 **액체 도료(습윤) 기준**이고, RoHS는 **건조 도막 기준**, REACH 제33조는 **부품 기준**이다. 습윤 기준 0.15%인 물질은 불휘발분 50%(질량) 도료에서 건조 도막 기준 0.3%가 된다. 도료사에는 습윤 기준 함량과 불휘발분(질량%)을 함께 받아 고객 양식에 맞춰 환산한다.\n\n후보 목록은 계속 늘어나므로 보증서는 한 번 받고 끝나지 않는다. 목록이 갱신되면 사용 중인 품번마다 새 물질 함유 여부를 묻고, 처방이 바뀌면 다시 받는다. 고객이 IMDS 같은 재료 정보 시스템 등록을 요구하면 도료사가 데이터를 직접 올릴지 발주사에 넘길지 정해 둔다.", "keyPoints": ["RoHS: 균질 물질 기준 0.1%(카드뮴 0.01%) — 도막은 건조 도막 농도로 판정한다", "REACH 제33조: SVHC 후보 목록 물질이 부품(성형품)에 0.1% w/w를 넘으면 정보를 전달한다", "도료사 성분표는 대개 습윤 기준 — 불휘발분(질량%)으로 건조 도막 기준으로 환산한다", "후보 목록 갱신·처방 변경 때마다 함유 여부를 다시 확인한다", "보증서·성분 신고서·IMDS 데이터의 제출 주체와 갱신 시점을 계약에 정한다"], "tables": [{"caption": "같은 물질, 세 가지 분모(예시값 — 물질 X 습윤 0.15%, 불휘발분 50%, 건조 도막 2.0g, 부품 200g)", "header": ["기준", "분모", "계산", "판단"], "rows": [["도료사 성분표", "액체 도료(습윤)", "0.15%", "출발 자료"], ["RoHS(균질 물질)", "건조 도막", "0.15% ÷ 0.50 = 0.30%", "X가 RoHS 물질이면 0.1% 초과 — 부적합"], ["REACH 제33조(성형품)", "도장 부품", "2.0g × 0.30% = 0.006g ÷ 200g = 0.003%", "0.1% 이하 — 제33조 정보 전달 의무 없음(고객 요구는 별개)"]]}], "checks": ["수출 제품 부품은 고객 요구 양식(RoHS·REACH·IMDS)을 먼저 받고 도료사에 같은 기준으로 자료를 요청한다", "도료사 성분 자료가 습윤 기준인지 건조 도막 기준인지 확인하고 불휘발분(질량%)을 함께 받는다", "SVHC 후보 목록이 갱신되면 사용 중인 도료 전 품번의 함유 여부 회신을 받는다", "유해 물질 미함유 보증서의 대상 품번, 기준 규제 목록의 판, 유효기간을 확인한다", "규제 물질 대체로 처방이 바뀌면 변경 통보와 재승인 대상으로 처리한다"], "example": "예를 들어 A사의 EU 수출용 제어반 함체 고객이 RoHS 자료를 요구했다. 도료사 성분표에는 가소제로 든 프탈레이트가 습윤 기준 0.06%로 적혀 있어 문제없어 보였지만, 불휘발분 55%로 환산하니 건조 도막 기준 약 0.11%였다. A사는 도료사에 대체 처방을 요청하고, 대체 도료는 변경 관리 절차로 재승인한 뒤 전환했다(가상 사례, 예시값).", "media": [{"type": "image", "file": "r8-svhc-01.svg", "caption": "같은 도막이라도 **RoHS는 건조 도막**, **REACH 제33조는 부품 무게**로 나눈다. 습윤 기준 성분표를 그대로 쓰면 판정이 틀린다(예시값).", "alt": "왼쪽에 액체 도료 캔 '습윤 0.15%', 가운데에 건조 도막 층 '불휘발분 50% → 0.30%', 오른쪽에 도장 브래킷 '부품 200g 중 0.006g → 0.003%'가 화살표로 이어진다. 가운데 아래에 빨간 'RoHS 0.1% 초과', 오른쪽 아래에 초록 'REACH 제33조 0.1% 이하' 판정 꼬리표가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzMwIiBmb250LWZhbWls 다. 도막을 RoHS의 균질 물질로 보는 것은 EU 위원회 FAQ의 해석으로 알려져 있으며 법적 구속력은 없다 — 원문 FAQ는 확인하지 못했다. 후보 목록 항목 수는 계속 늘어 숫자를 적지 않았다. 확인 시점 2026-11."}, {"id": "r8-voc-waste", "title": "VOC 함유기준과 폐도료 처리", "aliases": ["도료 VOC 함유기준", "휘발성유기화합물 함유기준", "최대희석비", "폐도료 처리", "폐페인트 지정폐기물"], "stage": "s8", "lens": "mgmt", "order": 4, "kind": "framework", "oneLiner": "VOC 함유기준과 폐도료 처리는 기준을 넘는 도료의 공급·판매를 막는 대기환경보전법 규정과 폐페인트·폐유기용제를 지정폐기물로 다루는 폐기물관리법 규정을 함께 보는 틀이다.", "body": "도료의 휘발성유기화합물(VOC) 규제와 저VOC 전환의 기술적 배경은 표면처리편 용제형·하이솔리드·수용성·분체와 VOC 규제에서 다뤘다. 여기서는 도료를 사는 쪽이 받아야 할 서류와 버리는 쪽의 의무를 본다.\n\n**함유기준은 공급·판매 단계의 규제다.** 대기환경보전법은 도료의 VOC 함유기준(g/L)을 부령으로 정하고, 도료를 제조·수입해 공급·판매하는 자와 그 밖에 공급·판매하는 자(대리점 등)가 기준을 넘는 도료를 공급·판매하지 못하게 한다(제44조의2). 기준은 시행규칙 별표 16의2에 건축용·자동차 보수용·도로용·공업용으로 나뉘어 있고, 공업용 안에서도 '기계 및 금속용', '전기·전자제품용(금속용)'처럼 세분된다. 한 도료가 두 용도에 걸치면 낮은 기준을 쓴다.\n\n눈여겨볼 점은 **희석**이다. 함유량은 도료사가 도장사양서에 적은 **최대희석비**를 적용해 산정한다. 현장에서 TDS보다 시너를 더 타면 서류상 적합한 도료도 기준을 넘는 상태로 칠하게 된다. 그래서 구매는 도료사에 용도 분류와 VOC 함유량(최대희석비 적용값)을 TDS·성적서에 적어 달라고 하고, 도장 업체의 희석 기록을 본다. 도장 시설의 배출 신고와 방지 시설은 도료 기준과 별개로 도장 업체가 지는 의무다.\n\n**남은 도료는 지정폐기물이다.** 폐기물관리법 시행령 별표 1은 폐유기용제와 폐페인트·폐래커를 지정폐기물로 정한다. 일정 규모 이상의 도장 시설에서 나온 도료·용제 혼합물, 용기에 남은 도료를 씻어 낸 용제, 그리고 빈 용기도 들어간다. 빈 용기는 남은 도료가 말라 있고 바닥 잔존량이 6mm를 넘지 않을 때만 빠진다. 배출 사업장은 처리 전에 폐기물처리계획서를 제출해 확인받고, 위탁 기준에 맞게 처리를 맡겨야 한다(법 제17조).\n\n폐기물 처리비는 결국 도료값에 얹힌다. 남지 않게 사는 것이 가장 싼 처리다. 발주량을 사용 가능량에 맞추고(도료 재고와 발주 참고), 캔 바닥까지 긁어 쓰는 작업 습관과 소분 공급을 함께 챙긴다.", "keyPoints": ["VOC 함유기준(g/L)은 공급·판매 규제 — 의무는 도료 제조·수입·판매자(대기환경보전법 제44조의2)", "함유량은 TDS 최대희석비를 적용해 산정 — 현장 과희석은 기준 초과 도료를 칠하는 것과 같다", "공업용은 '기계 및 금속용'·'전기·전자제품용' 등으로 세분 — 두 용도에 걸치면 낮은 기준", "폐페인트·폐유기용제·잔량 있는 빈 용기는 지정폐기물 — 잔량이 마르고 6mm 이하인 빈 용기만 제외", "배출 사업장이 처리계획 확인·위탁 처리 — 남지 않게 사는 것이 가장 싼 처리다"], "tables": [{"caption": "공업용 도료 VOC 함유기준 일부(대기환경보전법 시행규칙 별표 16의2, 2020.1.1부터 적용분, 확인 시점 2026-11)", "header": ["용도 분류", "세부", "함유기준(g/L)"], "rows": [["기계 및 금속용 도료", "수성", "200 이하"], ["기계 및 금속용 도료", "유성", "750 이하"], ["기계 및 금속용 도료", "특수기능도료", "850 이하"], ["전기·전자제품용(금속용) 도료", "하도용(메탈·유색·투명)", "750 이하"], ["전기·전자제품용(금속용) 도료", "상도용(메탈·유색·투명)", "800 이하"], ["PCM 도료", "고체(안료 함량 15% 이상)", "800 이하"]]}, {"caption": "도료와 관련된 지정폐기물(폐기물관리법 시행령 별표 1, 2025.10.1 개정분, 확인 시점 2026-11)", "header": ["구분", "해당하는 것", "구매·현장 포인트"], "rows": [["폐유기용제", "할로겐족(부령 지정 물질)과 그 밖의 폐유기용제", "세척 시너 회수·위탁 기록"], ["폐페인트·폐래커", "도료 제조업, 용적 5m³ 이상 또는 동력 3마력 이상 도장 시설에서 나온 도료·용제 혼합물", "잔량 줄이기"], ["용기 세척 혼합물", "보관 용기에 남은 도료를 없애려고 유기용제와 섞은 것", "세척량 줄이기"], ["폐페인트 용기", "잔량이 마르고 바닥 6mm 이하인 용기는 제외", "끝까지 쓰고 말린 뒤 배출"]]}], "checks": ["도료사에 용도 분류와 VOC 함유량(최대희석비 적용값)을 TDS·성적서에 적어 달라고 요청한다", "도장 업체의 희석 기록이 TDS 최대희석비 안에 있는지 실사 때 본다", "저VOC 도료로 바꿀 때 단가와 함께 작업성·건조 설비 변경 비용을 비교한다", "도장 업체·자사의 지정폐기물 처리계획 확인서, 위탁 계약, 처리 실적 기록을 확인한다", "폐도료 발생량을 품번별로 모아 발주량·포장 단위 조정의 근거로 쓴다"], "example": "예를 들어 A사의 협력 도장 업체가 겨울철 점도를 맞추려 시너를 TDS 최대희석비 30%보다 많은 50%까지 탔다. 원액 VOC 700g/L인 기계·금속용 유성 도료라 30% 희석에서는 약 739g/L로 기준(750g/L) 안이었지만, 50% 희석에서는 약 757g/L로 넘었다(예시값 — 시너 870g/L, 단순 부피 합산 가정). A사는 도료 가온기로 점도를 맞추게 하고 희석비를 작업 일지에 적게 했다(가상 사례).", "media": [{"type": "image", "file": "r8-voc-waste-01.svg", "caption": "VOC 함유량은 **최대희석비를 적용한 값**으로 따진다. 원액이 적합해도 현장에서 더 희석하면 기준을 넘을 수 있다(예시값 — 시너 870g/L, 단순 부피 합산).", "alt": "세로 막대 세 개. 원액 700g/L, TDS 최대희석비 30% 적용 739g/L, 현장 과희석 50% 757g/L. 750g/L 위치에 빨간 가로 점선 '기계 및 금속용 유성 함유기준 750g/L'이 있고 세 번째 막대만 선을 넘어 빨갛게 칠해져 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzUwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+Vk9DIO2VqOycoOufieydgCDstZzrjIDtnazshJ3ruYTrpbwg7KCB7Jqp7ZW0IOuUsOyngOupsCwg7ZiE7J6l7JeQ7IScIOuNlCDtnazshJ3tlZjrqbQg6riw7KSA7J2EIOuEmOydhCDsiJgg7J6I64ukKOyYiOyLnOqwkik8L3RpdGxlPgogIDxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNGQUZDRkIiLz4KICA8dGV4dCB4PSIxNiIgeT0iMjgiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxODIwMkEiPuybkOyVoeydtCDsoIHtlantlbTrj4Qg642UIO2drOyEne2V "폐기물관리법 제17조(사업장폐기물배출자의 의무 — 지정폐기물 처리계획 확인), 제18조의2(유해성 정보자료): https://www.law.go.kr/법령/폐기물관리법", "서울 중구청 소량 지정폐기물 처리 안내(폐유기용제·폐페인트·폐락카를 지정폐기물로 수거): https://junggu.seoul.kr/content.do?cmsid=15486"], "note": "VOC 함유기준의 의무 주체·최대희석비 산정 원칙은 법·시행규칙 원문과 기후에너지환경부 안내를 대조했다. 표의 세부 수치(기계 및 금속용 유성 750g/L 등)는 별표 16의2 원문에서 읽었고, 같은 수치를 실은 두 번째 공공 자료는 찾지 못했다. 지정폐기물 세부 요건(5m³·3마력·6mm)도 시행령 별표 1 원문 기준이며 두 번째 자료는 품목(폐유기용제·폐페인트)만 확인했다. 희석 예시의 시너 VOC 870g/L와 부피 합산은 설명용 가정이고 법정 계산법(국립환경과학원 고시)과 다를 수 있다. 확인 시점 2026-11."}, {"id": "r9-change-control", "title": "도료 변경 관리: 4M 변경과 재승인", "aliases": ["도료 4M 변경", "도료 변경 통보", "도료 재승인", "도료 처방 변경", "paint change notification"], "stage": "s9", "lens": "mgmt", "order": 1, "kind": "process", "oneLiner": "도료 변경 관리는 도료사의 원료·처방·공장·품번 변경과 도장 업체의 도료 전환을 사전 통보로 받아 변경 등급에 맞는 재시험·재승인을 거친 뒤에만 적용하게 하는 절차이다.", "body": "승인은 '그 도료로 그 조건에서 칠한 부품'에 대한 것이다. 같은 품번이라도 원료 하나가 바뀌면 색·부착·내식이 달라질 수 있다. 실무편 승인 판정과 변경점 재승인의 4M 원칙을 도료에 옮기면 변경은 두 갈래에서 온다.\n- **도료사 쪽 변경**: 원료 공급처·원료 등급 변경(수지·안료·용제), 처방 변경(규제 물질 대체 포함), 생산 공장·설비 이전, 품번 통합·단종.\n- **도장 업체 쪽 변경**: 다른 도료사·다른 품번으로 전환, 희석제·경화제 변경, 경화 조건·도장 방식 변경.\n\n도료사 쪽 변경은 발주사가 모르고 지나가기 쉽다. 도료사는 도장 업체에만 알리고, 도장 업체는 '같은 품번'이라며 발주사에 알리지 않는 일이 흔하다. 그래서 품질 협정서에 **도료사가 발주사에도 직접 사전 통보**하는 조항을 넣는다. 통보 시점은 적용 몇 개월 전(예: 3개월)으로 정하고, 통보 없는 변경은 클레임 사유로 삼는다.\n\n통보를 받으면 **변경 등급**을 정하고 영향이 큰 만큼 시험 범위를 넓힌다.\n- 서류 검토: 포장·라벨 양식 변경, 동등 등급 원료의 공급처 추가(도료사 비교 시험 결과 첨부)\n- 시편 시험: 원료 등급·처방의 작은 변경, 공장 이전 — 성적서 항목, 색차, 부착·내식 같은 핵심 도막 시험\n- 라인 시험과 고객 재승인: 수지 계열·경화제 변경, 도료사 전환 — 새 도료 승인 절차를 다시 밟고, 고객이 요구하면 PPAP를 다시 제출한다\n\n전환할 때는 **전환 로트**를 기록한다. 마지막 구 도료 로트와 첫 신 도료 로트가 어느 부품 로트에 들어갔는지 남겨야 문제가 생겼을 때 범위를 좁힐 수 있다. 승인이 끝나면 지정 도료 목록과 사양서, 부품 BOM의 품번을 고치고 구 품번 재고 처리 계획을 세운다. 변경 이력은 품번별로 쌓아 두었다가 정기 평가에서 통보 준수 여부를 따지는 근거로 쓴다.", "keyPoints": ["도료 변경 = 도료사 쪽(원료·처방·공장·품번)과 도장 업체 쪽(도료 전환·희석제·경화 조건)", "도료사가 발주사에도 직접 사전 통보하는 조항을 품질 협정서에 넣는다", "변경 등급별 재시험: 서류 검토 / 시편 시험 / 라인 시험·고객 재승인(PPAP)", "전환 로트(구·신 도료 로트와 부품 로트)를 기록해 추적 범위를 좁힌다", "승인 뒤 지정 도료 목록·사양서·BOM 개정, 구 재고 처리, 변경 이력 누적"], "tables": [{"caption": "도료 변경 등급과 재시험 범위(예시 — 고객 규격과 품질 협정서가 우선)", "header": ["변경 예", "등급", "재시험 범위", "고객 통보"], "rows": [["포장 용기·라벨 양식 변경", "경미", "서류 검토", "기록만"], ["동등 등급 원료의 공급처 추가", "중간", "도료사 비교 시험 결과와 성적서 항목 확인", "협정에 따름"], ["생산 공장 이전, 처방의 작은 변경", "중간", "시편 시험(색차·광택·부착·내식)", "통보"], ["수지 계열·경화제 변경, 도료사 전환", "중대", "새 도료 승인 절차(라인 시험 포함), PPAP 재제출", "사전 승인"]]}], "steps": ["변경 통보를 받는다 — 변경 내용, 사유, 적용 예정일, 도료사의 영향 평가", "품질·설계·구매가 함께 변경 등급을 정한다", "재시험 계획과 시험 비용 부담을 문서로 합의한다", "시험을 하고 결과를 판정한다", "고객 통보·승인이 필요한 등급이면 고객 승인을 받는다", "적용: 전환 로트 기록, 지정 도료 목록·사양서·BOM 개정, 구 재고 처리"], "checks": ["품질 협정서에 도료사의 발주사 직접 사전 통보 조항과 통보 시점(예: 적용 3개월 전)을 넣는다", "도장 업체가 도료사·품번·희석제·경화제를 바꾸려면 사전 승인을 받도록 계약에 적는다", "변경 통보마다 등급·재시험 범위·비용 부담을 문서로 정한다", "전환 때 마지막 구 로트와 첫 신 로트의 도료 로트 번호와 부품 로트를 기록하게 한다", "승인 뒤 지정 도료 목록·사양서·BOM의 품번을 함께 고쳤는지 확인한다"], "example": "예를 들어 A사의 옥외 함체에서 출하 1년 만에 상도 초킹 클레임이 늘었다. 추적해 보니 도료사가 반년 전 이산화티타늄(TiO₂) 원료 등급을 바꾸며 도장 업체에만 알렸고 품번은 그대로였다. A사는 원료 등급 변경을 '시편 시험' 등급으로 정한 변경 등급표를 품질 협정서에 붙이고, 도료사가 분기마다 변경 이력을 직접 보고하게 했다(가상 사례).", "media": [{"type": "image", "file": "r9-change-control-01.svg", "caption": "변경은 **도료사 쪽**과 **도장 업체 쪽** 두 갈래에서 온다. 둘 다 발주사의 등급 판정과 재승인 관문을 거쳐야 양산에 들어간다(개념도).", "alt": "위 줄에 도료사 쪽 변경(원료·처방·공장·품번), 아래 줄에 도장 업체 쪽 변경(도료 전환·희석제·경화 조건) 상자가 있고, 두 줄 모두 가운데의 '사전 통보 → 변경 등급 판정' 관문으로 모인다. 관문에서 세 갈래(서류 검토, 시편 시험, 라인 시험·PPAP)로 나뉜 뒤 '승인 → 전환 로트 기록 → 지정 도료 목록·사양서 개정'으로 이어진다. 도료사에서 도장 업체로만 가는 회색 점선에 '여기서 정보가 끊기기 쉽다' 표시가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDEwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+64+E66OMIOuzgOqyveydgCDrj4Tro4zsgqwg7Kq96rO8IOuPhOyepSDsl4XssrQg7Kq97JeQ7IScIOyYpOqzoCwg65GYIOuLpCDsgqzsoIQg7Ya167O07JmAIOuzgOqyvSDrk7HquIkg7YyQ7KCV7J2EIOqxsOyzkCDsnqzsirnsnbjtlZzri6Qo6rCc64WQ64+EKTwvdGl0bGU+CiAgPGRlZnM+CiAgICA8bWFya2VyIGlkPSJhciIgdml {"id": "r9-consumption", "title": "도료 소요량 관리: 이론량과 실적 대조", "aliases": ["도료 소요량", "이론 도료량", "도료 실적 사용량", "도료 인정 손실률", "도료 소요량 BOM"], "stage": "s9", "lens": "cost", "order": 2, "kind": "method", "oneLiner": "도료 소요량 관리는 부품 면적·막두께·고형분·도착 효율로 구한 이론 도료량과 실제 사용량을 대조해 과도장·손실·폐기를 찾아내고 정산과 절감의 근거로 쓰는 방법이다.", "body": "부품 하나에 도료가 얼마나 들어야 하는지는 표면처리편 도착 효율과 도료 소요량의 P3 식으로 구한다. 부피 고형분(VS)과 건조 막두께(DFT)로 이론 도포 면적을 내고 도착 효율(TE)을 곱하면 도료 1L로 실제로 칠하는 면적이 나온다. 부품 면적을 그것으로 나누면 개당 도료량(L)이고, 비중을 곱하면 kg, 월 생산량을 곱하면 월 이론 소요량이다. 단가 비교 기준 환산의 m² 단가와 같은 식이다.\n\n도료편에서 중요한 것은 그다음, **실적과 대조하는 일**이다. 입고·재고 기록으로 구한 실제 사용량은 대개 이론보다 많다. 차이는 다음으로 쪼갠다.\n- **과도장**: 사양 최소 두께를 지키려다 평균이 두꺼워진다. 최소 25μm 사양에 평균 28μm면 그것만으로 12%가 더 든다.\n- **불량 재도장**: 재작업 부품에 다시 칠한 도료.\n- **라인 손실**: 색 교체 때 배관·건 세척으로 버리는 도료, 탱크·호스 잔량.\n- **잔량 폐기**: 유효기간 만료, 2액형 가사 시간 초과, 개봉 뒤 겔화.\n- **설명되지 않는 차이**: 기록 누락이나 다른 품목 전용.\n\n이 대조는 세 군데에 쓰인다. 첫째, **사급 정산**이다. 사급 도료는 이론량에 인정 손실률을 더한 양을 기준으로 정산하고, 그보다 더 쓴 몫은 도장 업체가 부담하게 한다. 인정 손실률은 몇 달의 실적으로 정하되 해마다 다시 본다. 둘째, **소요량 BOM**이다. 부품 BOM에 도료 품번과 개당 도료량(kg)을 넣어야 소요 계획과 발주가 맞는다. 셋째, **절감 후보**다. 차이 항목 가운데 가장 큰 것이 다음 개선 대상이다.\n\n비교는 같은 기준으로 한다. 실적은 희석 전 원액 kg으로, 이론은 TDS의 VS와 실제 평균 막두께로 계산하고, 희석제는 따로 집계한다. 차이를 항목으로 설명하지 못할 만큼 크면 TE 가정부터 의심한다(Talbert 7·12장).", "keyPoints": ["개당 이론 도료량 = 부품 면적 ÷ (10 × VS ÷ DFT × TE) × 비중 — 표면처리편 P3를 그대로 쓴다", "실적 − 이론 = 과도장 + 불량 재도장 + 라인 손실 + 잔량 폐기 + 설명되지 않는 차이", "사급 정산 기준 = 이론량 × (1 + 인정 손실률), 초과분은 도장 업체 부담", "부품 BOM에 도료 품번과 개당 도료량을 넣어 소요 계획을 맞춘다", "실적은 원액 기준, 이론은 실제 평균 막두께 기준 — 희석제는 따로 집계한다"], "tables": [{"caption": "브래킷 월 10,000개의 도료 소요량 대조(예시값 — 도장 면적 0.40m², VS 50%, 사양 DFT 25μm, TE 60%, 비중 1.30)", "header": ["항목", "계산", "kg/월"], "rows": [["이론 소요량", "0.40m² ÷ (10 × 50 ÷ 25 × 0.60 = 12m²/L) = 0.0333L × 1.30 × 10,000개", "433.3"], ["과도장(평균 28μm)", "433.3 × (28 ÷ 25 − 1)", "52.0"], ["불량 재도장 4%", "(433.3 + 52.0) × 0.04", "19.4"], ["라인 손실(색 교체 세척)", "월 10회 × 2.5kg", "25.0"], ["잔량 폐기(만료·겔화)", "폐기 기록", "20.0"], ["설명되지 않는 차이", "실적 − 위 항목 합계", "10.3"], ["실적 사용량(원액)", "입고량 − 재고 증가분", "560.0"]]}], "checks": ["부품별 도장 면적·실제 평균 DFT·VS·TE 가정을 받아 개당 이론 도료량을 계산한다", "월 실적 사용량(원액 kg)과 이론량을 대조하고 차이를 과도장·재도장·라인 손실·폐기로 나눠 받는다", "사급 도료 정산 기준(이론량 × (1 + 인정 손실률))과 초과분 부담 주체를 계약에 적는다", "부품 BOM에 도료 품번과 개당 도료량이 들어 있는지 확인한다", "차이가 큰 품목은 막두께 분포와 색 교체 횟수부터 확인한다"], "example": "예를 들어 A사는 사급 도료가 매달 이론보다 30% 가까이 더 나가는데도 도장 업체가 요청하는 대로 채워 주었다. 항목을 나눠 보니 과도장이 이론량의 12%, 색 교체 세척이 6%였고, 세척 손실은 같은 색 부품을 몰아 칠하는 일정으로 절반이 줄었다. A사는 인정 손실률을 15%로 정하고 초과분은 도장 업체가 부담하는 정산 조항을 넣었다(가상 사례, 예시값).", "media": [{"type": "image", "file": "r9-consumption-01.svg", "caption": "이론 433kg과 실적 560kg의 차이 127kg을 **항목으로 쪼개면** 과도장이 가장 크다. 가장 큰 막대가 다음 개선 대상이다(예시값).", "alt": "왼쪽에서 오른쪽으로 이어지는 폭포형 막대 그래프. 이론 소요량 433.3kg 파란 막대에서 시작해 과도장 +52.0, 라인 손실 +25.0, 잔량 폐기 +20.0, 불량 재도장 +19.4, 설명되지 않는 차이 +10.3 주황 막대가 계단처럼 쌓이고, 마지막 실적 560.0kg 회색 막대에 이른다. 이론량 × 1.15 = 498.3kg 위치에 초록 점선 '인정 손실률 15% 정산 기준'이 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzkwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4KICA8dGl0bGU+7J2066GgIDQzM2tn6rO8IOyLpOyggSA1NjBrZ+ydmCDssKjsnbTrpbwg7ZWt66qp7Jy866GcIOyqvOqwnOuptCDqs7zrj4TsnqXsnbQg6rCA7J6lIO2BrOuLpCjsmIjsi5zqsJIpPC90aXRsZT4KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+CiAgPHRleHQgeD0iMTYiIHk9IjI4IiBmb250LXNpemU9IjE3IiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjMTgyMDJBIj7snbTroaAgNDMza2fqs7wg7Iuk7KCBIDU2MGtn7J2YIOywqOydtOulvCDtla3rqqnsnLzroZwg7Kq86rCg64ukKOyYiOyLnOqwkiwga2cv7JuUKTwvdGV4dD4KICA8bGluZSB4MT0iODAiIHkxPSI1NCIgeDI9IjExMiIgeTI9IjU0IiBzdHJva2U9IiMyRjhGNUIiIHN0cm9rZS13aWR0aD0iMi41IiBzdHJva2UtZGFzaGFycmF5PSI3IDQiLz4KICA8dGV4dCB4PSIxMjAiIHk9IjU5IiBmaWxsPSIjMUM3NDQ4IiBmb250LXdlaWdodD0iNzAwIj7soJXsgrAg6riw7KSAID0g7J2066GgIMOXIDEuMTUgPSA0OTguM2tnKOyduOyglSDshpDsi6TrpaAgMTUlKTwvdGV4dD4KICA8IS0tIHkgPSAzMzAgLSB2KjAuNDMzMyAtLT4KICA8ZyBzdHJva2U9IiNFNEVBRTgiIHN0cm9rZS13aWR0aD0iMSI+Ci ², 부피 고형분 60%, 건조 막두께 30μm, 도착 효율 50%인 액체 도료의 개당 이론 도료량은?", "options": ["0.015L", "0.03L", "0.06L", "0.3L"], "answer": 1, "explain": "이론 도포 면적 = 10 × 60 ÷ 30 = 20m²/L, 실제 = 20 × 0.5 = 10m²/L, 개당 = 0.30 ÷ 10 = 0.03L다. 도착 효율을 빼먹으면 0.015L로 절반만 잡게 되고, 반대로 곱하면 0.06L가 된다."}, {"q": "사급 도료 실적이 이론량보다 25% 많다. 도장 업체는 '도장은 원래 손실이 많다'고 한다. 먼저 할 일은?", "options": ["25%를 손실률로 인정해 계속 공급한다", "사급을 끊고 업체 구매로 바꾼다", "차이를 과도장·재도장·라인 손실·폐기로 나눈 자료를 받아 항목별로 인정 범위를 정한다", "도료 단가를 25% 깎는다"], "answer": 2, "explain": "차이를 항목으로 쪼개야 어느 몫이 불가피하고 어느 몫이 관리로 줄일 수 있는지 알 수 있다. 그 결과로 인정 손실률을 정하고 초과분 부담을 계약에 넣는다. 근거 없이 다 인정하거나 공급 방식을 바꾸는 것은 원인을 덮는다."}], "ncs": ["c07-scrap-loss-yield", "c04-bom"], "silmu": ["s7-material-review"], "pyo": ["p7-transfer-efficiency"], "scopes": ["price", "claim"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 7장(도착 효율과 스프레이 기법), 12장(도장 원가 분석 — 도료 사용량 계산)", "표면처리편 P3(액체 도료 소요량) — 이론 도포 면적 = 10 × VS ÷ DFT, 실제 = 이론 × TE"], "note": "예시 숫자는 Python으로 검산했다(이론 433.3kg, 과도장 52.0kg, 재도장 19.4kg, 설명되지 않는 차이 10.3kg, 이론 × 1.15 = 498.3kg). 인정 손실률 15%와 각 손실 항목은 예시값이다. P3는 표면처리편에서 정의했으므로 다시 정의하지 않고 계산에만 썼다. 확인 시점 2026-11."}, {"id": "r9-cost-down", "title": "도료 원가 절감: 색 통합·품번 축소·고형분·분체 전환", "aliases": ["도료 색 통합", "도료 품번 축소", "하이솔리드 전환", "분체 전환 원가", "도료 절감 효과 계산"], "stage": "s9", "lens": "cost", "order": 3, "kind": "framework", "oneLiner": "도료 원가 절감은 kg 단가 협상보다 색·품번 통합, 막두께 과잉 감축, 고형분·분체 전환, 포장·계약 조정으로 쓰는 양과 버리는 양을 줄여 m²당 도료비를 낮추는 접근이다.", "body": "도료비는 kg 단가에 쓰는 양을 곱한 값이다. 단가는 원료 지수에 묶여 협상으로 몇 퍼센트 움직이기 어렵지만, 쓰는 양과 버리는 양은 구매·설계·도장 업체가 함께 바꿀 수 있다. 대표적인 지렛대는 다음과 같다.\n\n- **색·품번 통합**: 비슷한 회색이 품번 다섯 개로 나뉘어 있으면 품번마다 MOQ와 재고, 만료 폐기, 색 교체 손실이 따로 생긴다. 통합하면 물량이 모여 단가도 내려가고, 도료 재고와 발주에서 본 실질 단가가 표시 단가에 가까워진다. 디자인·고객 승인이 필요한 일이라 품번별 사용량·폐기량 같은 근거 숫자를 모아 제안한다.\n- **막두께 과잉 줄이기**: 사양 최소를 지키려 평균이 지나치게 두꺼우면 그만큼 도료가 더 든다. 도장 업체의 막두께 분포를 받아 편차를 줄이면 평균을 낮출 수 있다. 사양 두께 자체를 낮추려면 내식 시험이 필요하다.\n- **고형분 높이기·분체 전환**: 하이솔리드는 같은 막두께에 드는 액체 도료가 적고, 분체는 붙지 않은 가루를 회수해 다시 쓰므로 이용률이 높다(Jones 외 25·28장). 그러나 kg 단가·설비·소부 온도·색 교체 조건이 함께 바뀌므로 단가 비교 기준 환산의 m² 단가로 비교하고 설비 투자와 재승인 비용까지 넣는다.\n- **포장·계약**: 많이 쓰는 품번은 캔에서 드럼·IBC로 바꾸고, 여러 도장 업체 물량을 묶어 통합 구매·연간 계약으로 단가와 물량을 약정한다. 큰 포장은 위험물 저장 배수와 잔량 폐기를 다시 따진다.\n\n절감 효과는 **연간 기준으로 항목마다** 계산한다. 연간 절감액은 m² 단가 차이에 연간 도장 면적을 곱한 값이고, 여기에서 시험·승인·설비·재고 처분 같은 일회성 비용을 따로 적어 회수 기간을 본다. 항목이 겹치면 앞 항목을 반영한 뒤의 단가로 다음 항목을 계산해 이중 계산을 막는다. 모든 대안은 도료 변경이므로 도료 변경 관리 절차와 재승인 기간을 일정에 넣는다(Talbert 12장).", "keyPoints": ["도료비 = kg 단가 × 쓰는 양 — 쓰는 양과 버리는 양을 줄이는 쪽이 효과가 크다", "색·품번 통합은 MOQ·재고·만료 폐기·색 교체 손실을 함께 줄이고 물량을 모은다", "막두께 편차를 줄여 평균을 낮춘다 — 사양 두께를 바꾸려면 내식 시험이 필요하다", "하이솔리드·분체 전환은 m² 단가와 설비·재승인 비용으로 비교한다", "연간 절감액 = m² 단가 차이 × 연간 도장 면적, 겹치는 항목은 순서대로 계산한다"], "tables": [{"caption": "절감안별 연간 효과(예시값 — 연간 도장 면적 120,000m², 기존 m² 도료비 900원 = 연 1억 800만 원, 앞 항목 반영 후 순서대로 계산)", "header": ["절감안", "m² 도료비 변화", "연간 절감(원)", "일회성 비용(원)"], "rows": [["① 회색 5품번 → 2품번 통합(폐기·색 교체 손실 감소)", "900 → 830원", "8,400,000", "3,000,000(색 승인·시험·재고 처분)"], ["② 막두께 평균 32 → 28μm(편차 관리)", "830 → 726.25원", "12,450,000", "1,000,000(막두께 관리 개선)"], ["③ 드럼 전환·연간 계약 단가 −4%", "726.25 → 697.20원", "3,486,000", "0(위험물 배수 재확인)"], ["합계", "900 → 697.20원(−22.5%)", "24,336,000", "4,000,000"]]}], "checks": ["품번별 연간 사용량·폐기량·색 교체 횟수를 모아 통합 후보 목록을 만든다", "도장 업체에 막두께 분포(평균·최소·편차)를 받아 과잉 두께를 확인한다", "하이솔리드·분체 전환안은 kg 단가가 아니라 m² 단가와 설비·재승인 비용으로 비교한다", "절감 효과는 연간 절감액·일회성 비용·회수 기간으로 정리하고 겹치는 항목의 이중 계산을 뺀다", "모든 절감안에 변경 등급과 재승인 일정을 붙여 제출한다"], "example": "예를 들어 A사는 도료사에 5% 인하를 요구했지만 원료 지수가 올라 받아들여지지 않았다. 대신 품번별 사용량을 정리해 보니 회색 다섯 품번 가운데 세 개가 월 50kg 미만이었고 해마다 만료 폐기가 나왔다. 고객 승인을 받아 두 품번으로 통합하고 막두께 편차를 줄이자 연간 도료비가 20% 넘게 줄었다(가상 사례, 예시값).", "media": [{"type": "image", "file": "r9-cost-down-01.svg", "caption": "단가 인하보다 **쓰는 양을 줄이는 항목**이 더 크다. 앞 항목을 반영한 뒤 순서대로 계산해 이중 계산을 막는다(예시값).", "alt": "왼쪽에서 오른쪽으로 내려가는 폭포형 막대. 기존 연간 도료비 1억 800만 원 회색 막대에서 색 통합 −840만 원, 막두께 관리 −1,245만 원, 드럼·연간 계약 −348.6만 원 초록 막대가 차례로 내려가 개선 후 8,366.4만 원(−22.5%) 파란 막대에 이른다. 각 막대 아래에 일회성 비용이 작게 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+x
