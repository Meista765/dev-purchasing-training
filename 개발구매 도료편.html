<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>개발구매 도료편</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="판금·프레스 부품에 칠할 도료를 원자재로 사는 개발구매 신입 사원을 위한 교재 — 도료 사양·단가·도료사 승인·색 관리·성적서·수입검사·보관·화학물질 규제·변경 관리">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar + one view at a time. Roadmap = 9 stage columns on graph paper with a drawing title block;
   concept = reading column + side rail (결재란 stamps, ego map). Accent = drafting blue for anything clickable; seal red only for completion stamps. */
:root{
  --paper:#EEF2F1; --sheet:#FAFCFB; --sunk:#E4EAE8; --ink:#18202A; --ink-2:#465260; --ink-3:#77838F;
  --rule:#CFD8D6; --rule-2:#B7C3C1; --grid:rgba(36,92,170,.07);
  --accent:#1D5BB8; --accent-2:#164A97; --accent-soft:#DFE9F8; --on-accent:#FFFFFF;
  --seal:#C4382C; --seal-soft:#F7E2DF;
  --ok:#1C7448; --ok-soft:#DDF0E5; --bad:#B03428; --bad-soft:#F7E0DC; --warn:#9A6700; --warn-soft:#FBF0D2;
  --mark:#FFE27A;
  --shadow:0 1px 0 rgba(20,30,40,.04), 0 6px 18px -10px rgba(20,30,40,.25);
  --f-display:"Hahmlet","Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161C; --sheet:#171D24; --sunk:#0D1116; --ink:#E4E9EE; --ink-2:#AAB5C0; --ink-3:#7E8A96;
  --rule:#2A333D; --rule-2:#3A4550; --grid:rgba(120,165,235,.06);
  --accent:#78A6F5; --accent-2:#9BBEFA; --accent-soft:#1D2B42; --on-accent:#0E1520;
  --seal:#F06A5C; --seal-soft:#3A1E1B;
  --ok:#5CC48E; --ok-soft:#173226; --bad:#F07D70; --bad-soft:#3A1F1B; --warn:#E3B341; --warn-soft:#332A12;
  --mark:#5A4B12;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#11161C; --sheet:#171D24; --sunk:#0D1116; --ink:#E4E9EE; --ink-2:#AAB5C0; --ink-3:#7E8A96;
  --rule:#2A333D; --rule-2:#3A4550; --grid:rgba(120,165,235,.06);
  --accent:#78A6F5; --accent-2:#9BBEFA; --accent-soft:#1D2B42; --on-accent:#0E1520;
  --seal:#F06A5C; --seal-soft:#3A1E1B;
  --ok:#5CC48E; --ok-soft:#173226; --bad:#F07D70; --bad-soft:#3A1F1B; --warn:#E3B341; --warn-soft:#332A12;
  --mark:#5A4B12;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.7;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--sheet)}
a{color:var(--accent);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;gap:14px;min-height:56px;max-width:1500px;margin:0 auto;padding-block:6px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em;white-space:nowrap}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:6px 10px;border-radius:var(--r);text-decoration:none;color:var(--ink-2);font-size:14px;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-2)}
.search{position:relative}
.search input{width:220px;max-width:100%;height:34px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--paper);color:var(--ink);padding:0 10px 0 30px;font:inherit;font-size:14px}
.search svg{position:absolute;left:9px;top:9px;width:16px;height:16px;color:var(--ink-3)}
.sres{position:absolute;right:0;top:40px;width:min(420px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--sheet);border:1px solid var(--rule-2);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;z-index:50}
.sres a{display:block;padding:8px 10px;border-radius:4px;text-decoration:none;color:var(--ink)}
.sres a:hover,.sres a.on{background:var(--accent-soft)}
.sres small{display:block;color:var(--ink-3);font-size:12px;line-height:1.4}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.meter .bar{width:80px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--seal);width:0;transition:width .4s}
.theme-btn{border:1px solid var(--rule-2);background:transparent;border-radius:var(--r);height:34px;width:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
@media (max-width:900px){.search input{width:160px}.meter .bar{width:48px}}
@media (max-width:640px){.top{position:static}.top-in{gap:8px 10px}.brand{order:1;flex:1}.brand span{display:none}.meter{order:2}.meter>span:first-child,.meter .bar{display:none}.theme-btn{order:3}.search{order:4;flex:1 1 100%}.search input{width:100%}.nav{order:5;width:100%;overflow-x:auto;flex-wrap:nowrap;margin:0 -4px}}

main{max-width:1500px;margin:0 auto;padding-block:24px 80px}

/* ---------- roadmap ---------- */
.rm-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:18px}
.rm-head h1{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:-.03em}
.rm-head p{margin:.4em 0 0;color:var(--ink-2);max-width:62ch}
.tblock{border:1.5px solid var(--ink);background:var(--sheet);font-size:12px;display:grid;grid-template-columns:auto auto;min-width:300px}
.tblock div{padding:4px 10px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.tblock div:nth-child(2n){border-right:0}
.tblock div:nth-last-child(-n+2){border-bottom:0}
.tblock dt{display:none}
.tblock .k{color:var(--ink-3);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.tblock .v{font-weight:600}
@media (max-width:760px){.rm-head{grid-template-columns:1fr}.tblock{min-width:0}}
.rm-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.rm-tools select,.rm-tools label{font:inherit}
.rm-tools select{height:32px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);color:var(--ink);padding:0 8px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.x{border-top-style:dashed;border-color:var(--seal)}

.map-wrap{border:1px solid var(--rule);background:color-mix(in srgb,var(--sheet) 88%,transparent);border-radius:var(--r);padding:0 18px}
.map{position:relative;display:flex;flex-direction:column}
.map svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.stage{position:relative;display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px;padding:18px 0;border-bottom:1px dashed var(--rule-2)}
.stage:last-child{border-bottom:0}
.stage-h{position:relative;padding-left:14px;border-left:2px solid var(--ink)}
.stage-h .no{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.08em}
.stage-h h2{font-size:19px;margin:1px 0 3px}
.stage-h p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.stage-h .mods{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center}
.stage-h .prog{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);margin-left:2px}
.stage:not(:last-child) .stage-h::after{content:"";position:absolute;left:-6px;bottom:-26px;width:10px;height:10px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);background:transparent}
.tag{font-family:var(--f-mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--rule-2);border-radius:3px;color:var(--ink-2);background:var(--sheet);white-space:nowrap;line-height:1.5}
.stage-nodes{display:flex;flex-direction:column;gap:10px;min-width:0}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.grp .gl{width:100%;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.node{position:relative;display:inline-flex;gap:7px;align-items:flex-start;text-align:left;max-width:300px;border:1px solid var(--rule-2);background:var(--sheet);border-radius:5px;padding:5px 9px;cursor:pointer;font-size:13.5px;line-height:1.35;transition:opacity .15s,border-color .15s,background .15s;z-index:3}
.node:hover{border-color:var(--accent)}
.node .t{min-width:0}
.node .st{flex:none;width:9px;height:9px;border-radius:50%;margin-top:4px;border:1.5px solid var(--rule-2)}
.node .st.half{border-color:var(--seal);background:linear-gradient(90deg,var(--seal) 50%,transparent 50%)}
.node .st.full{border-color:var(--seal);background:var(--seal)}
.node .lab{flex:none;font-size:9px;color:var(--accent);margin-top:3px}
.map.focus .node{opacity:.3}
.map.focus .node.nb,.map.focus .node.sel{opacity:1}
.map.focus .node.nb{border-color:var(--accent);background:var(--accent-soft)}
.map.focus .node.nb.xn{border-color:var(--seal);border-style:dashed;background:var(--seal-soft)}
.map.focus .node.sel{border-color:var(--ink);background:var(--ink);color:var(--sheet)}
.map.focus .node.sel .lab{color:inherit}
.map.modf .node{opacity:.25}
.map.modf .node.mod{opacity:1;border-color:var(--accent)}
.edges path{fill:none;stroke:var(--accent);stroke-width:1;opacity:0}
.edges path.x{stroke:var(--seal);stroke-dasharray:4 3}
.map.all-edges .edges path{opacity:.18}
.edges path.on{opacity:.95 !important;stroke-width:1.6}
.loop{display:flex;align-items:center;gap:10px;padding:12px 0 16px;font-size:13px;color:var(--ink-2);border-top:1.5px solid var(--ink)}
.loop b{font-family:var(--f-mono);font-weight:600}
.preview{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:12px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;z-index:5}
.preview h3{font-size:19px}
.preview .meta{font-size:12px;color:var(--ink-3)}
.preview p{margin:4px 0 0;color:var(--ink-2)}
.preview .nbs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;max-height:120px;overflow:auto}
.chip{border:1px solid var(--rule-2);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--accent);color:var(--accent-2)}
.chip.x{border-style:dashed;border-color:color-mix(in srgb,var(--seal) 60%,var(--rule-2))}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:7px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:transparent;color:var(--accent-2)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:4px 10px;font-size:13px}
.x-btn{border:0;background:transparent;cursor:pointer;color:var(--ink-3);font-size:20px;line-height:1;padding:2px 6px}
@media (max-width:760px){
  .map-wrap{padding:0 12px}
  .stage{grid-template-columns:1fr;gap:12px}
  .stage:not(:last-child) .stage-h::after{display:none}
  .node{max-width:100%}
  .preview{grid-template-columns:1fr}
}
.start{margin-top:28px}
.start h2{font-size:20px;margin-bottom:12px}
.start-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card .tag{display:inline-block}
.card{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{font-size:16px;margin-bottom:4px}
.card p{margin:0;color:var(--ink-2);font-size:14px}
a.card{text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:var(--accent)}

/* ---------- concept ---------- */
.crumb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.crumb a{color:var(--ink-2)}
.c-grid{display:grid;grid-template-columns:minmax(0,760px) 300px;gap:56px;align-items:start;justify-content:start}
@media (max-width:1000px){.c-grid{grid-template-columns:1fr;gap:24px}}
.article{max-width:74ch;min-width:0}
.article h1{font-size:clamp(26px,3.2vw,36px);font-weight:800;letter-spacing:-.025em}
.lead{font-size:17.5px;color:var(--ink-2);margin:.6em 0 1.4em;line-height:1.6}
.article h2{font-size:20px;margin:2em 0 .6em;display:flex;align-items:baseline;gap:10px}
.article h2 .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3);font-weight:500;text-transform:uppercase}
.prose p{margin:0 0 1em}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.3em}
.prose li{margin:.2em 0}
.prose strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%)}
.prose a.auto{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:1.5px}
.prose a.auto:hover{color:var(--accent-2)}
.keys{border:1.5px solid var(--ink);border-radius:var(--r);padding:14px 18px;background:var(--sheet);margin:1.2em 0}
.keys h3{font-size:14px;font-family:var(--f-body);font-weight:700;margin-bottom:6px;letter-spacing:.02em}
.keys ol{margin:0;padding-left:1.3em}
.keys li{margin:.25em 0}
.tbl{overflow-x:auto;margin:1em 0;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
.tbl table{border-collapse:collapse;width:100%;font-size:13.5px;line-height:1.5}
.tbl caption{text-align:left;padding:8px 12px;font-size:12.5px;color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--rule);caption-side:top}
.tbl th,.tbl td{padding:7px 12px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.tbl th{background:var(--sunk);font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.formula{border-left:3px solid var(--accent);background:var(--sheet);padding:10px 14px;margin:1em 0;border-radius:0 var(--r) var(--r) 0}
.formula .n{font-size:12.5px;color:var(--ink-3);font-weight:600}
.formula .e{font-family:var(--f-mono);font-size:15px;margin:2px 0 6px;overflow-x:auto;white-space:pre-wrap}
.formula dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.formula dt{font-family:var(--f-mono);color:var(--accent-2)}
.formula dd{margin:0;color:var(--ink-2)}
.formula .ex{font-size:13px;color:var(--ink-2);margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule)}
.steps{counter-reset:s;list-style:none;padding:0;margin:1em 0}
.steps li{counter-increment:s;position:relative;padding:6px 0 6px 40px;border-left:1.5px solid var(--rule-2);margin-left:12px}
.steps li::before{content:counter(s);position:absolute;left:-13px;top:6px;width:25px;height:25px;border-radius:50%;background:var(--sheet);border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600}
.steps li:last-child{border-left-color:transparent}
.example{background:var(--sunk);border-radius:var(--r);padding:12px 16px;font-size:14px;color:var(--ink-2)}
.example b{color:var(--ink)}
.source-note{font-size:12px;color:var(--ink-3);margin-top:6px}

.rail{position:sticky;top:76px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:1000px){.rail{position:static}}
.rail h3{font-size:12px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-bottom:6px}
.kyul{border-collapse:collapse;width:100%;background:var(--sheet);table-layout:fixed}
.kyul th,.kyul td{border:1.5px solid var(--ink);text-align:center}
.kyul th{font-size:12px;font-weight:600;padding:3px 0;background:var(--sunk)}
.kyul td{height:66px;position:relative}
.kyul td .none{color:var(--ink-3);font-size:12px}
.stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;border:2.5px solid var(--seal);border-radius:50%;color:var(--seal);font-family:var(--f-display);font-weight:800;font-size:14px;transform:rotate(-14deg);line-height:1.05;text-align:center;box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3.5px color-mix(in srgb,var(--seal) 70%,transparent)}
.stamp small{display:block;font-size:8.5px;font-family:var(--f-mono);font-weight:500;letter-spacing:.02em}
.stamp.new{animation:stampin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{from{transform:rotate(-14deg) scale(1.8);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:1}}
.ego{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r)}
.ego svg{display:block;width:100%;height:auto}
.ego text{font-family:var(--f-body);font-size:10.5px;fill:var(--ink)}
.ego .en{cursor:pointer}
.ego .en circle{fill:var(--sheet);stroke:var(--accent);stroke-width:1.5}
.ego .en.x circle{stroke:var(--seal);stroke-dasharray:3 2}
.ego .en:hover circle,.ego .en:focus circle{fill:var(--accent-soft)}
.ego .ctr circle{fill:var(--ink)}
.ego .ctr text{fill:var(--sheet);font-weight:700}
.ego line{stroke:var(--rule-2);stroke-width:1}
.ego line.x{stroke-dasharray:3 3}
.ego .cap{font-size:11px;color:var(--ink-3);padding:6px 10px;border-top:1px solid var(--rule)}
.mini-list{list-style:none;margin:0;padding:0;font-size:13.5px;border-top:1px solid var(--rule)}
.mini-list li{border-bottom:1px solid var(--rule)}
.mini-list a{display:flex;gap:8px;padding:6px 2px;text-decoration:none;color:var(--ink)}

<script>
window.DATA={"stages": [{"id": "s1", "no": 1, "title": "도료 구매 입문", "sub": "도료는 부품에 붙어 나가는 원자재다 — 누가 사고, 무엇을 보고 사는지 안다"}, {"id": "s2", "no": 2, "title": "도료 사양", "sub": "무엇을 사는지 글로 정한다 — 구매 사양서·규격·지정 도료·도장계"}, {"id": "s3", "no": 3, "title": "도료 단가", "sub": "도료값은 수지·안료·용제값이다 — 원가를 쪼개고, 같은 기준으로 비교한다"}, {"id": "s4", "no": 4, "title": "도료사 선정·승인", "sub": "도료사를 고르고, 새 도료를 승인하고, 둘째 공급원을 세운다"}, {"id": "s5", "no": 5, "title": "색 관리", "sub": "색은 기준이 있어야 판정된다 — 마스터 샘플·색 승인·로트 색차"}, {"id": "s6", "no": 6, "title": "성적서·수입검사", "sub": "로트마다 같은 도료인지 숫자로 확인한다 — 성적서·수입검사·추적·클레임"}, {"id": "s7", "no": 7, "title": "보관·재고", "sub": "도료는 시간이 지나면 상한다 — 유효기간·보관 조건·위험물·재고"}, {"id": "s8", "no": 8, "title": "화학물질 규제", "sub": "도료는 화학물질이다 — MSDS·화평법·화관법·REACH·VOC"}, {"id": "s9", "no": 9, "title": "변경·원가 절감", "sub": "바뀌면 다시 승인하고, 쓰는 양과 가짓수를 줄여 값을 낮춘다"}], "lenses": [{"code": "tech", "title": "공정·기술"}, {"code": "qual", "title": "품질"}, {"code": "cost", "title": "원가"}, {"code": "mgmt", "title": "관리·점검"}], "concepts": [{"id": "r1-why-paint-buy", "title": "도료를 원자재로 사는 이유: 품질·원가·책임의 연결", "aliases": ["도료 구매의 의미", "원자재로서의 도료", "도료비 비중", "paint as raw material", "도료 구매 책임"], "stage": "s1", "lens": "mgmt", "order": 1, "kind": "framework", "oneLiner": "도료는 부품에 붙어 나가는 원자재라서, 도료가 바뀌면 색·부착·내식이 바뀌고 도장비와 품질 책임도 함께 움직이는 구매 품목이다.", "body": "판금 부품의 도막은 몇십 μm에 지나지 않지만, 고객이 가장 먼저 보는 색·광택과 몇 년 뒤에 드러나는 녹·박리를 정한다. 그 도막의 재료가 도료다. 도료는 수지·안료·용제·첨가제를 섞어 만든 설계품이고(표면처리편 「도료의 구성: 수지·안료·용제·첨가제」), 공장에서 칠하는 산업용 도료는 고객의 라인 조건과 요구 성능에 맞춰 따로 설계하는 경우가 많다(Jones 외 1장). 그래서 같은 '회색 분체'라도 도료사나 품번이 다르면 다른 물건이다.\n\n구매가 도료를 따로 알아야 하는 이유는 세 가지다.\n- **품질**: 도료가 바뀌면 색차, 층간 박리, 내식·내후 저하가 생긴다. 이런 불량은 출하 검사에서 바로 보이지 않고 몇 달 뒤 현장 클레임으로 돌아오는 경우가 많다.\n- **원가**: 도료비는 도장비 안에서 가장 큰 재료 항목이다. 예를 들어 m²당 도장비 3,000원 중 도료비가 900원(30%, 예시값)이면, 도료 단가가 10% 오를 때 도장비는 3% 오른다. 비중은 도장 방식·두께·물량에 따라 크게 다르다.\n- **책임**: 도료를 누가 사느냐에 따라 불량이 났을 때 누구에게 물을지가 달라진다.\n\n책임 범위는 조달 방식으로 갈린다. 도장 업체가 도료를 알아서 사면 구매는 완성 도막의 사양과 시험만 관리하고, 도료는 업체 몫이다. 대신 업체가 싼 도료로 바꿔도 알기 어렵다. 회사가 도료사·품번을 지정하거나 직접 사서 주면 도료의 성능·공급·재고까지 구매 책임이 된다. 어느 쪽을 고를지는 도료 사급과 도장 업체 구매에서 다룬다.\n\n이 교재는 도료를 하나의 구매 품목으로 다룬다. 도막이 녹을 막는 원리, 수지 계열, 도장 방식과 도착 효율은 표면처리편에서 배웠다고 보고 다시 설명하지 않는다. 여기서는 사양서를 쓰고, 도료사를 승인하고, 단가를 검증하고, 색·로트·성적서·창고·화학물질 의무와 변경을 관리하는 일을 본다.", "keyPoints": ["도료는 부품에 붙어 나가는 원자재다 — 도료가 바뀌면 같은 공정에서도 다른 도막이 나온다", "도료 문제(색차·박리·내식 저하)는 출하 검사를 지나 늦게 드러난다", "도료비는 도장비의 큰 재료 항목이라 도료 단가 변동이 부품 단가로 옮겨 간다", "도료를 누가 사느냐(업체 구매·지정 구매·사급)에 따라 구매가 책임질 범위가 달라진다", "원리·도장 공정은 표면처리편, 이 교재는 도료를 품목으로 사고 관리하는 판단을 다룬다"], "tables": [{"caption": "도료가 바뀌면 생기는 문제와 드러나는 시점(대표 사례)", "header": ["바뀐 것", "나타나는 문제", "드러나는 시점"], "rows": [["도료사(같은 색 번호)", "색차·메타메리즘, 광택 차", "조립 라인에서 옆 부품과 맞댈 때"], ["수지 계열·경화제", "초킹·변색, 내약품성 저하", "옥외 사용 수개월~수년 뒤"], ["하도 또는 희석제", "층간 박리, 부착 불량", "조립·운송 충격, 현장 사용 중"], ["안료·체질 안료(저가 처방)", "은폐 부족, 내식 저하", "염수 분무 시험, 현장 녹"]]}], "checks": ["도장품 견적서에 도료비가 따로 적혀 있는지 보고, m²당 도료비와 도장비 대비 비중을 계산해 본다", "도면·도장 사양에 도료사·품번이나 수지 계열이 적혀 있는지 확인한다", "도장 업체가 쓰는 도료의 도료사·품번·TDS를 받아 두고, 바꿀 때 사전 신고하게 했는지 본다", "도료를 누가 사는지와 그에 따른 품질 책임을 계약서·품질 협정서에 적었는지 확인한다"], "example": "예를 들어 A사는 옥외 함체 도장 업체가 원가를 아끼려고 같은 색의 실내용 하이브리드 분체로 바꾼 것을 몰랐다. 출하 검사(색·두께·부착)는 모두 합격이었다. 1년 뒤 남향 설치품에서 초킹·변색 클레임이 들어왔고, 업체 입고 기록을 거슬러 가서야 도료사와 품번이 바뀐 것을 알았다. A사는 이후 사양서에 수지 계열과 품번을 적고 지정 도료 목록으로 관리하기 시작했다(가상 사례).", "media": [{"type": "image", "file": "r1-why-paint-buy-01.svg", "caption": "m²당 도장비 3,000원 중 **도료비가 900원(30%)**인 예다. 도료 단가가 10% 오르면 도장비는 **90원, 3%** 오른다(예시값 — 비중은 도장 방식·두께·물량에 따라 다르다).", "alt": "가로 막대 하나가 도장비 3,000원을 도료비 900원(30%), 인건비 750원(25%), 설비·에너지 600원(20%), 전처리 약품·기타 재료 240원(8%), 관리비·이윤 510원(17%)으로 나눈다. 도료비 칸 아래 상자에 '도료 단가 +10% → 도료비 900원 → 990원, 도장비 3,000원 → 3,090원 = +3%'가 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzAwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT5twrLri7kg64+E7J6l67mEIDMsMDAw7JuQ7J2YIOq1rOyEs q": "옥외 함체 도장 업체가 '같은 RAL 번호이고 더 싸다'며 도료사를 통보 없이 바꿨다. 출하 검사(색·두께·부착)는 모두 합격이다. 구매의 판단으로 가장 알맞은 것은?", "options": ["출하 검사에 합격했으므로 문제없다", "내후·내식은 출하 검사로 보이지 않으므로 바뀐 도료사·품번·수지 계열을 받아 재승인 여부를 판단한다", "색 번호가 같으므로 같은 도료로 본다", "단가가 내려갔으니 부품 단가 인하만 요청한다"], "answer": 1, "explain": "색·두께·부착은 출하 때 보이지만 내후·내식은 옥외 사용이나 장시간 시험에서야 드러난다. 같은 RAL 번호라도 수지 계열이 다르면 다른 도료다. 출하 검사 합격이나 색 번호만으로 판단하면 늦게 클레임을 맞고, 단가 인하만 챙기면 품질 위험을 놓친다."}, {"q": "m²당 도장비 3,000원 중 도료비가 900원(예시)인 부품이다. 도료사가 도료 단가 10% 인상을 요청했다. 도장비에 미치는 영향은?", "options": ["10% 인상", "30% 인상", "변화 없음", "약 3%(90원) 인상"], "answer": 3, "explain": "도료비만 10% 오르므로 900원 × 0.10 = 90원이 늘고, 90 ÷ 3,000 = 3%다. 도장비 전체에 10%를 곱하면 인건비·설비비까지 올리는 셈이 된다. 30%는 도료비 비중을 인상률로 착각한 값이다."}], "ncs": ["c05-purchased-item-classification"], "silmu": ["s6-coating-types"], "pyo": ["p6-paint-components"], "scopes": ["spec", "price"], "sources": ["Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 1장(도료의 분류 — 공장 도장용 제품 도료는 고객의 제조 조건·성능 요구에 맞춰 설계되는 경우가 많다)", "Talbert, Paint Technology Handbook(CRC Press 2008), 2장(도료는 여러 원료로 만든 설계품이고 원료 선택이 저장 안정성·도장성·성능을 정한다), 12장(도장비 구성 — 재료비·인건비·설비비·불량비)"], "note": "도장비 구성비(도료비 30% 등)는 설명용 예시값이다. 실제 비중은 도장 방식·두께·물량·업체에 따라 크게 다르다."}, {"id": "r1-supply-chain", "title": "도료 공급망: 원료사·도료사·대리점·도장 업체", "aliases": ["도료 유통 구조", "도료사", "조색점", "도료 대리점", "paint supply chain", "배치 생산"], "stage": "s1", "lens": "mgmt", "order": 2, "kind": "process", "oneLiner": "도료는 원료사의 수지·안료·용제가 도료사의 배치 생산과 조색을 거쳐 대리점·도장 업체로 가는 공급망을 타며, 리드 타임과 결품 위험이 그 단계에서 생긴다는 구조이다.", "body": "강판이 제철소에서 코일센터를 거쳐 협력사로 가듯(실무편 「코일·시트와 철강 유통 구조(밀·코일센터·대리점)」), 도료도 여러 단계를 거쳐 도장 라인에 닿는다.\n- **원료사**: 수지, 안료(TiO₂·산화철·유기 안료), 용제, 첨가제를 만든다. 대부분 세계 시장에서 거래되는 원료라 도료 값과 공급은 이들의 시황을 따른다.\n- **도료사**: 원료를 처방대로 섞는다. 수지·용제에 안료를 넣어 잘게 푸는 **분산(밀링)**, 나머지 수지·용제를 더하는 **희석**, 시험실에서 색·점도·광택을 재고 맞추는 **조색·조정**, 여과·충전 순이다(Talbert 4장). 이 한 묶음이 **배치**이고, 배치마다 로트 번호가 붙는다.\n- **대리점·조색점**: 도료사 제품을 지역에 나눠 팔고, 일부는 원색을 섞어 소량의 색을 만든다. 납기는 짧지만 조색 품질은 도료사 공장보다 흔들리기 쉽다.\n- **도장 업체**: 도료를 사거나 받아서 칠한다. 회사에서 보면 도료의 최종 사용자다.\n\n리드 타임은 배치 생산에서 나온다. 재고가 있는 표준색은 며칠이면 오지만, 주문 생산하는 특색은 원료 확보, 생산 계획, 조색, 시험을 거친다. 그래서 예를 들어 2~4주가 걸린다(예시값 — 도료사·품목마다 다르다). 배치에는 경제적인 크기가 있어 특색은 **최소 생산량**(MOQ)을 요구한다. 월 20kg 쓰는 특색에 MOQ가 수백 kg이면 다 쓰기 전에 유효기간이 지날 수 있다. 이 계산은 도료 재고와 발주에서 다룬다.\n\n공급망이 끊기는 지점도 미리 안다. 원료사 한 곳에 의존하는 안료·수지, 해외에서만 들여오는 원료, 한 공장에서만 만드는 품번, 화학물질 규제로 퇴출되는 원료가 대표적이다. 구매 시장 조사 때 도료사에 주요 원료의 공급원 수, 대체 처방 여부, 생산 공장, 표준 리드 타임을 묻는다. 그래야 결품 위험이 큰 품번을 골라 재고나 둘째 공급원을 미리 준비할 수 있다.", "keyPoints": ["원료사 → 도료사 → 대리점·조색점 → 도장 업체 순으로 흐르고, 도료 값은 원료 시황을 따른다", "도료사는 분산·희석·조색·여과·충전을 한 배치로 만들고 배치마다 로트 번호를 붙인다", "특색은 주문 생산이라 리드 타임이 길고 최소 생산량(MOQ)이 붙는다", "단일 원료 공급원·단일 공장·해외 원료·규제 퇴출 원료가 공급이 끊기는 지점이다", "시장 조사 때 공급원 수·대체 처방·공장·리드 타임을 물어 결품 위험 품번을 골라 둔다"], "tables": [{"caption": "공급망 단계별로 구매가 확인할 것", "header": ["단계", "하는 일", "구매가 묻는 것", "끊기는 위험"], "rows": [["원료사", "수지·안료·용제·첨가제 생산", "주요 원료 공급원 수, 원산지", "단일 공급원, 규제 퇴출, 공장 사고"], ["도료사", "분산·희석·조색·시험·충전", "생산 공장, 배치 크기, 리드 타임, MOQ", "단일 공장 품번, 생산 계획 밀림"], ["대리점·조색점", "지역 판매, 소량 조색", "재고 품번, 조색 기록·로트 관리", "조색 편차, 로트 추적 단절"], ["도장 업체", "구매·보관·사용", "입고 로트, 보관 조건, 재고 일수", "재고 부족, 유효기간 경과"]]}], "checks": ["품번마다 표준 리드 타임과 MOQ·포장 단위를 도료사에 서면으로 받는다", "주요 원료(수지·TiO₂·특수 안료)의 공급원 수와 대체 처방 여부를 묻는다", "생산 공장이 한 곳뿐인 품번과 해외 원료에 의존하는 품번을 목록에 표시해 둔다", "대리점·조색점에서 조색한 도료는 원색 로트와 조색 기록이 남는지 확인한다", "도장 업체의 도료 재고 일수와 긴급 발주 경로를 확인한다"], "example": "예를 들어 A사의 옥외 함체용 진녹색 특색은 한 도료사의 한 공장에서만 만들고, 핵심 유기 안료는 해외 원료사 한 곳에서 들여온다. 원료사 공장이 멈추자 도료 납기가 6주 밀렸고 도장 라인이 2주 섰다. A사는 이후 이 품번의 안전 재고를 늘리고, 다른 도료사의 동등품 승인 시험을 시작했다(가상 사례).", "media": [{"type": "image", "file": "r1-supply-chain-01.svg", "caption": "도료는 **원료사 → 도료사 → 대리점·조색점 → 도장 업체**로 흐른다. 빨간 표시는 공급이 끊기기 쉬운 지점이다(개념도).", "alt": "왼쪽부터 원료사(수지·안료·용제·첨가제), 도료사(분산 → 희석 → 조색·시험 → 충전, 배치마다 로트 번호), 대리점·조색점, 도장 업체가 화살표로 이어진다. 각 단계 아래에 빨간 느낌표와 함께 원료사 '단일 공급원·규제 퇴출', 도료사 '단일 공장 품번·생산 계획 밀림', 조색점 '조색 편차·로트 추적 단절', 도장 업체 '재고 부족·유효기간 경과'가 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz 급)**: 회사가 도료사에서 사서 업체에 준다. 여러 업체 물량을 묶어 단가를 낮추고, 같은 로트를 나눠 줘 색을 맞추기 쉽다. 대신 재고·유효기간·폐기·결품 책임이 회사로 온다.\n\n품질 책임 경계도 방식마다 다르다. 사급 도료로 칠한 부품에 박리가 나면 업체는 '받은 도료가 문제'라고, 회사는 '도장 관리 문제'라고 하기 쉽다. 사급이라면 입고 때 성적서와 로트를 확인하고, 업체가 보관·교반·희석·경화를 어떻게 했는지 기록을 남기게 해야 가릴 근거가 생긴다.\n\n사급 도료는 **소요량 정산**이 핵심이다. 칠한 면적으로 이론 사용량을 구하고(표면처리편 「도착 효율과 도료 소요량」), 인정 손실률(예: 이론량의 10%, 예시값)을 더한 양을 넘게 쓴 몫은 업체가 부담하게 정한다. 색 교체 때 버리는 도료, 유효기간이 지나 폐기하는 도료, 남은 도료의 반납·폐기 비용을 누가 낼지도 계약서에 적는다. 실적 대조는 도료 소요량 관리에서 다시 본다.\n\n고르는 기준은 물량과 위험이다. 여러 업체가 같은 도료를 많이 쓰면 사급이나 도료사와의 직접 단가 합의가 유리하다. 한 업체만 쓰는 소량 품목은 지정 구매가 낫다.", "keyPoints": ["업체 구매는 관리가 가볍지만 도료 변경을 늦게 안다", "지정 구매는 품질 기준은 회사가, 재고·발주는 업체가 맡는 절충이다 — 기준 단가 합의가 함께 필요하다", "사급은 물량 통합으로 단가를 낮추지만 재고·유효기간·폐기·결품 책임이 회사로 온다", "사급 도료는 이론 사용량 + 인정 손실률로 정산하고 초과분은 업체 부담으로 정한다", "여러 업체 공통 대량 도료는 사급·직접 단가 합의, 한 업체 소량 도료는 지정 구매가 맞다"], "tables": [{"caption": "도료 조달 방식 비교", "header": ["항목", "업체 구매", "지정 구매", "사급(지급)"], "rows": [["도료 선택", "도장 업체", "회사(도료사·품번 지정)", "회사"], ["단가 협상", "업체–도료사", "업체–도료사(회사가 기준 단가 합의 가능)", "회사–도료사(물량 통합)"], ["재고·유효기간·폐기", "업체", "업체", "회사(보관은 업체에 맡김)"], ["도료 품질 책임", "업체", "도료 성능은 회사 승인, 사용은 업체", "도료는 회사, 도장은 업체"], ["관리 부담", "가장 가벼움", "중간", "가장 무거움(정산·재고)"], ["맞는 경우", "소량·비외관 부품", "일반 판금 부품", "여러 업체 공통 대량·외관 색"]]}], "checks": ["도료 품번마다 조달 방식(업체 구매·지정 구매·사급)을 정하고 계약서·품질 협정서에 적었는지 확인한다", "지정 구매 품번은 도료사와 기준 단가를 합의해 업체마다 단가가 다르지 않은지 본다", "사급 도료는 업체별 월 이론 사용량·인정 손실률·실사용량을 대조하는 정산표가 있는지 확인한다", "사급 도료의 입고 성적서·로트와 업체의 보관·교반·희석 기록을 받아 두는지 본다", "유효기간 경과·색 교체·잔량 반납 도료의 폐기 비용을 누가 내는지 정했는지 확인한다"], "example": "예를 들어 A사는 도장 업체 세 곳에 같은 백색 분체를 사급한다. 한 달 동안 칠한 면적으로 계산한 B 업체의 이론 사용량이 1,000kg이고 인정 손실률이 10%(예시)면 인정량은 1,100kg이다. B 업체가 1,250kg을 받아 썼다면 초과 150kg × 9,000원/kg(예시) = 135만 원을 업체 부담으로 정산한다. B 업체는 색 교체 때 버린 분체가 많았다고 설명했고, 다음 달부터 같은 색 부품을 묶어 칠하도록 생산 순서를 바꿨다(가상 사례).", "media": [{"type": "image", "file": "r1-supply-mode-01.svg", "caption": "세 방식은 **누가 도료를 고르고 돈을 내느냐**가 다르다. 회사 쪽 칸이 늘수록 단가 협상력과 함께 **재고·폐기 책임**도 회사로 온다(개념도).", "alt": "세 칸 비교도. 업체 구매는 도료사 → 도장 업체로 도료와 대금이 , 용도, 색, 광택을 코드로 묶는다. 예를 들어 가상 품번 'PE-7035-G60'은 폴리에스터·RAL 7035·광택 60GU를 뜻하는 식이다. 색 번호가 같아도 수지나 광택 코드가 다르면 다른 도료이므로, 사양서와 발주서에는 색 이름이 아니라 **전체 품번**을 적는다.\n\n**TDS**는 도료사가 내는 제품 설명서다. 구매가 보는 항목은 다음과 같다(Talbert 2·10장).\n- 불휘발분: 질량%와 부피%(VS)를 따로 본다. 도포 면적과 단가 비교는 부피%로 한다.\n- 비중(kg/L): kg 단가를 L 단가로 바꿀 때 쓴다.\n- 점도: 출하 점도와 도장 점도(유출컵 초 또는 mPa·s)를 구분한다.\n- 희석제와 희석비, 2액형이면 혼합비와 가사 시간\n- 경화 조건(온도 × 시간), 권장 막두께, 이론 도포 면적(m²/L)\n- 보관 조건과 보관 기간\nTDS 값은 대개 대표값이라 성적서의 규격값과 다를 수 있다. 사양서에 넣을 값은 도료사에 '로트마다 보증하는 범위'로 다시 받는다.\n\n**MSDS**에서 구매가 먼저 볼 곳은 구성 성분(함유 물질과 함량 범위), 물리·화학적 특성의 인화점(위험물 보관 판단), 법적 규제 현황이다. 자세한 읽기는 MSDS와 GHS 표시에서 다룬다.\n\n마지막으로 **개정**이다. 같은 품번이라도 도료사가 원료나 처방을 바꾸면 TDS·MSDS의 개정일과 값이 바뀐다. 받은 문서의 개정일을 기록해 두고, 새 판이 오면 불휘발분·비중·경화 조건·성분이 달라졌는지 비교한다. 품번은 그대로인데 숫자가 바뀌었다면 도료 변경 관리 대상인지 도료사에 묻는다.", "keyPoints": ["품번은 수지·용도·색·광택을 묶은 코드다 — 발주서에는 색 이름이 아니라 전체 품번을 적는다", "TDS의 불휘발분은 질량%와 부피%(VS)를 구분하고, 단가 비교에는 VS를 쓴다", "TDS는 대표값이다 — 사양서에는 도료사가 로트마다 보증하는 범위를 받아 적는다", "MSDS에서 구매는 구성 성분·인화점·법적 규제 현황을 먼저 본다", "같은 품번이라도 TDS·MSDS 개정일과 숫자가 바뀌면 변경 여부를 묻는다"], "tables": [{"caption": "TDS 항목과 구매가 쓰는 곳", "header": ["TDS 항목", "단위·표시", "구매에서 쓰는 곳"], "rows": [["불휘발분(질량)", "질량%", "성적서 대조(로트 일관성)"], ["불휘발분(부피, VS)", "부피%", "고형분 L 단가·m² 단가 비교"], ["비중", "kg/L", "kg 단가 ↔ L 단가 환산"], ["점도", "초(유출컵)·mPa·s", "성적서·수입검사 규격"], ["희석비·혼합비·가사 시간", "부피비·시간", "실사용량·폐기량 추정"], ["경화 조건", "℃ × 분", "도장 업체 라인 조건과 맞는지"], ["이론 도포 면적", "m²/L(막두께 기준)", "소요량 계산 검증"], ["보관 기간", "개월(제조일 기준)", "발주량·재고 회전"]]}], "checks": ["견적서·발주서에 색 이름이 아니라 도료사 전체 품번이 적혀 있는지 확인한다", "TDS의 불휘발분이 질량%인지 부피%인지 구분해, 단가 비교에는 부피%를 쓴다", "사양서에 넣을 TDS 항목은 도료사가 보증하는 범위(최소·최대)로 다시 받는다", "받은 TDS·MSDS의 개정일을 기록하고, 새 판이 오면 바뀐 숫자를 이전 판과 대조한다", "MSDS의 구성 성분·인화점·법적 규제 현황을 보고 보관·규제 담당에 넘길 정보가 있는지 본다"], "example": "예를 들어 A사 구매 담당은 도료사가 보낸 같은 품번의 새 TDS에서 부피 고형분이 58%에서 54%로, 비중이 1.32에서 1.38로 바뀐 것을 발견했다. 도료사에 물으니 체질 안료 원료를 바꿨다고 했다. 품번은 그대로였지만 A사는 이를 처방 변경으로 보고 시편 시험을 다시 받기로 했다(가상 사례).", "media": [{"type": "image", "file": "r1-tds-msds-01.svg", "caption": "가상 TDS 견본에서 구  오븐 온도만 바꾸면 변경을 놓치고, 단가는 이 문제와 관계없다."}], "ncs": ["c05-quality-requirements"], "pyo": ["p6-paint-components"], "scopes": ["spec", "test"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 2장(도료 성분과 고형분), 10장(도료 시험 — 점도 유출컵 측정, 입고 도료의 색·광택 확인)", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 1장(고형분은 휘발분이 날아간 뒤 남는 수지·안료)"], "note": "품번 체계와 TDS 견본은 가상이다. 실제 품번 체계·TDS 항목·표시 방식은 도료사마다 다르다. MSDS의 법정 항목과 읽기는 S8 카드에서 다룬다."}, {"id": "r2-spec-sheet", "title": "도료 구매 사양서: 무엇을 적어야 같은 도료가 오나", "aliases": ["도료 사양서", "paint specification", "도료 구매 규격", "성능 사양", "처방 지정"], "stage": "s2", "lens": "mgmt", "order": 1, "kind": "document", "oneLiner": "도료 구매 사양서는 도장계·수지·색·광택·액상 물성·도막 성능·포장·유효기간·규제 적합을 숫자 범위로 적어, 매번 같은 도료가 오게 하는 구매 문서이다.", "body": "도면의 도장 주기(표면처리편 「도면·사양서의 표면처리 기호 읽기: ISO 2081·ISO 1461·도장 사양」)는 **완성 도막**을 정한다. 도료 구매 사양서는 그 도막을 만들 **도료 자체**를 정한다. 도막 사양만 있으면 어떤 도료로든 맞추기만 하면 되고, 도료 사양서가 있어야 매번 같은 도료가 온다. 사양서를 쓰는 일반 원칙은 재료편 「재료 사양서와 도면 재질란 작성」을 따른다.\n\n사양서에 적을 항목은 여섯 묶음이다.\n1. 용도와 도장계: 적용 부품, 실내·옥외, 하도·상도 구성, 함께 쓰는 희석제·경화제\n2. 도료 정체: 수지 계열, 도료사·품번(지정할 때), 색 번호와 기준 견본, 광택 범위\n3. 액상 물성: 비중, 불휘발분(질량%·부피%), 점도, 분산도 — 로트마다 성적서로 확인할 값\n4. 도막 성능: 정한 막두께에서의 부착·경도·내식·내후 시험과 합격 기준\n5. 공급 조건: 포장 단위·용기, 라벨 표시, 제조일 기준 유효기간, 입고 때 남은 유효기간\n6. 규제 적합: 금지·제한 물질 불포함, VOC 함량, MSDS 제출\n\n쓰는 방식은 두 가지다. **성능 사양**은 '이 시험을 통과하면 어떤 도료든 된다'고 쓰고, **처방 지정**은 도료사·품번을 못 박는다. 성능 사양은 경쟁을 열어 값을 낮추지만, 도료사가 처방을 바꿔도 시험만 맞으면 막을 근거가 없다. 처방 지정은 품질이 고정되지만 한 도료사에 묶인다. 판금 부품에서는 성능 사양으로 승인한 뒤 승인된 품번을 지정 도료 목록에 올리는 방식이 흔하다.\n\n허용 범위는 반드시 숫자로 쓴다. '고형분 높을 것'이 아니라 '불휘발분 58~62질량%', '광택 좋을 것'이 아니라 '60° 광택 80±5GU'다. TDS 대표값을 그대로 옮기지 말고, 도료사가 로트마다 보증할 수 있는 범위로 합의한다.\n\n사양서는 문서 번호와 개정 번호를 붙여 관리한다. 개정하면 도료사와 도장 업체에 새 판을 배포하고 받았다는 확인을 받는다. 옛 판으로 만든 도료가 섞이지 않게 새 판을 적용할 첫 로트도 정한다.", "keyPoints": ["도면은 완성 도막을, 도료 구매 사양서는 도료 자체를 정한다", "여섯 묶음: 용도·도장계, 도료 정체, 액상 물성, 도막 성능, 공급 조건, 규제 적합", "성능 사양은 경쟁을 열고, 처방 지정은 품질을 고정한다 — 성능으로 승인하고 품번으로 묶는 방식이 흔하다", "허용 범위는 도료사가 로트마다 보증하는 숫자 범위로 쓴다", "문서·개정 번호로 관리하고, 개정 때 배포·수령 확인·적용 첫 로트를 정한다"], "tables": [{"caption": "사양서 허용 범위 쓰기: 나쁜 예와 좋은 예(예시값)", "header": ["항목", "나쁜 예", "좋은 예"], "rows": [["불휘발분", "고형분 높을 것", "58~62질량%(성적서 항목)"], ["점도", "작업에 적합할 것", "유출컵(규격·구경 명시) 25℃에서 60~80초"], ["광택", "고광택", "60° 광택 80±5GU"], ["색", "RAL 7035", "RAL 7035, 기준 견본 번호 지정, 측색 조건과 ΔE 한도 명시"], ["유효기간", "신선할 것", "제조일로부터 12개월, 입고 때 9개월 이상 남을 것"], ["규제", "유해 물질 없을 것", "고객 금지 물질 목록(판 번호) 불포함, 성분 보증서 제출"]]}], "checks": ["도면 도장 주기와 별도로 도료 구매 사양서(문서 번호·개정 번호)가 있는지 확인한다", "액상 물성(비중·불휘발분·점도)의 허용 범위가 숫자로 적혀 있고 성적서 항목과 같은지 본다", "희석제·경화제 품번과 혼합비가 사양서에 함께 적혀 있는지 확인한다", "포장 단위·유효기간·입고 때 남은 유효기간 조건이 적혀 있는지 본다", "사양서를 개정하면 도료사·도장 업체에 새 판을 배포하고 수령 확인과 적용 첫 로트를 받는다"], "example": "예를 들어 A사의 도료 사양서에는 '회색, 고광택, 내식성 우수'만 적혀 있었다. 도료사가 공장을 옮긴 뒤 들어온 로트는 광택이 70GU로 떨어졌지만 사양서에 숫자가 없어 반품 근거가 약했다. A사는 사양서를 개정해 60° 광택 80±5GU, 불휘발분 58~62질량%, 염수 분무 시험 조건과 합격 기준을 숫자로 넣었다(가상 사례).", "media": [{"type": "image", "file": "r2-spec-sheet-01.svg", "caption": "도면의 도장 주기는 **완성 도막**(색·두께·시험)을, 도료 구매 사양서는 **통 안의 도료**(품번·액상 물성·포장·규제)를 정한다. 두 문서가 맞물려야 같은 도막이 나온다(개념도).", "alt": "겹친 두 상자. 왼쪽 '도면 도장 주기 = 완성 도막'에는 막두께(최소·최대), 두께 측정 위치, 부착·내식 시험 판정, 유효면·마스킹이, 오른쪽 '도료 구매 사양서 = 통 안의 도료'에는 도장계·품번, 비중·불휘발분·점도, 포장·유효기간, 규제 적합·MSDS가 적혀 있다. 두 상자가 겹친 가운데에는 색 번호·기준 견본, 광택 범위, 도막 성능 시험이 '두 문서 공통'으로 놓여 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzMwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7rj4TrqbQg64+E7J6lIOyjvOq4sOyZgCDrj4Tro4wg6rWs66ekIOyCrOyWkeyEnOydmCDqsr3qs4Qg4oCUIOyZhOyEsSDrj4Trp4kg7ZWt66qpLCDthrUg7JWI7J2YIOuPhOujjCDtla3rqqksIOuRkCDrrLjshJzqsIAg7ZWo6ruYIOyggeuKlCDsg4nCt+q0ke2DncK364+E66eJIOyEseuKpTwvdGl0bGU+DQo8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQo8dGV4dCB4PSIyMC4wIiB5PSIzMi4wIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMTgyMDJBIiBmb250LXdlaWdodD0iNzAwIj7rj4TrqbQg64+E7J  보증 범위와 고객 규격으로 합의한다."}, {"id": "r2-standards", "title": "도료 관련 규격 읽기: 고객 규격·KS·ISO 시험 방법", "aliases": ["도료 시험 규격", "KS M ISO", "액상 도료 시험", "도장 규격", "paint test standard"], "stage": "s2", "lens": "qual", "order": 2, "kind": "framework", "oneLiner": "도료 규격은 고객·사내 도장 규격, ISO와 이를 채택한 KS M ISO 시험 방법, 도료사 사내 시험법의 세 층이며, 액상 시험과 도막 시험을 나눠 읽어야 하는 문서 체계이다.", "body": "도료와 관련된 규격은 세 층이다.\n- **고객·사내 도장 규격**: 고객사나 회사가 정한 문서다. 보통 적용 범위, 도장계 종류와 등급, 요구 성능표, 시험 방법(ISO·KS 번호 인용), 승인·변경 절차로 이뤄진다. 합격 숫자는 여기서 나오고, 시험을 어떻게 하는지는 인용한 규격이 정한다.\n- **시험 방법 규격**: ISO 도료 규격과 이를 그대로 채택한 KS M ISO 규격이다. 예를 들어 KS M ISO 2811-1은 ISO 2811-1과 내용이 일치(IDT)한다. 국내 성적서에는 KS M ISO 번호가 많이 적힌다.\n- **도료사 사내 시험법**: 도료사가 자체로 정한 방법이다. 성적서에 사내 번호만 있으면 어느 규격과 같은지 묻는다.\n\n구매가 가장 자주 헷갈리는 것이 **액상 시험**과 **도막 시험**의 구분이다. 액상 시험은 통 안의 도료를 재서 '같은 도료가 왔는지'를 본다. 밀도, 불휘발분, 점도, 분산도(연화도)가 대표이고 도료사 성적서와 수입검사가 이것이다. 도막 시험은 칠하고 굳힌 막을 재서 '쓸 만한 도막이 되는지'를 본다. 승인 시험과 도장 업체 검사가 이것이다(표면처리편 「도막 물성 시험: 부착·경도·충격·굴곡·내약품」). 로트마다 염수 분무를 수백 시간씩 할 수는 없으므로, 로트마다 액상 시험으로 동일성을 확인하고 도막 성능은 승인 때와 정기 시험으로 확인한다. 색과 광택은 정해진 조건으로 칠한 시험판으로 로트마다 본다.\n\n규격을 읽을 때는 세 가지를 확인한다.\n1. 번호와 판: 번호 뒤의 연도(판)까지 본다. 판이 바뀌면 조건이나 판정이 달라질 수 있다.\n2. 부와 방법: ISO 2811은 비중병법·침강체법·진동법처럼 여러 부로 나뉜다. 어느 부로 쟀는지 알아야 값을 비교할 수 있다.\n3. 조건: 시험 온도, 불휘발분의 가열 온도·시간, 유출컵의 종류·구경, 광택 측정 각도. 조건이 다르면 같은 도료도 다른 숫자가 나온다.\n\n고객 규격이 인용한 판과 도료사 성적서의 판이 다르면 어느 판을 따를지 도료 구매 사양서에 정한다.", "keyPoints": ["세 층: 고객·사내 도장 규격(합격 숫자), ISO·KS M ISO(시험 방법), 도료사 사내 시험법", "액상 시험은 '같은 도료가 왔나', 도막 시험은 '쓸 만한 막이 되나'를 본다", "로트마다 액상 시험, 도막 성능은 승인·정기 시험으로 나눠 확인한다", "규격은 번호·판(연도)·부(방법)·시험 조건까지 읽어야 숫자를 비교할 수 있다", "KS M ISO는 ISO를 그대로 채택한 규격이 많다 — 일치(IDT) 여부를 확인한다"], "tables": [{"caption": "액상 시험과 도막 시험의 구분(대표 규격 — KS M ISO는 같은 번호로 채택돼 있다)", "header": ["구분", "시험", "대표 규격", "주로 언제"], "rows": [["액상", "시료 채취·시험 시료 준비", "ISO 15528, ISO 1513", "성적서·수입검사"], ["액상", "밀도(비중)", "ISO 2811-1~-3(비중병·침강체·진동)", "로트마다"], ["액상", "불휘발분(질량)", "ISO 3251", "로트마다"], ["액상", "불휘발분(부피)", "ISO 3233-1", "승인 때(측정이 번거롭다)"], ["액상", "점도(유출컵)", "ISO 2431", "로트마다"], ["액상", "분산도(연화도)", "ISO 1524", "로트마다"], ["시험판", "색 시각 비교, 광택", "ISO 3668, ISO 2813", "로트마다(정한 조건으로 칠한 판)"], ["도막", "막두께, 부착(크로스컷) 등", "ISO 2808, ISO 2409", "승인·정기·도장 업체 검사"]]}], "checks": ["고객 도장 규격이 인용한 시험 규격의 번호·판을 목록으로 만들어 둔다", "도료사 성적서의 시험 방법이 규격 번호인지 사내 시험법인지 확인하고, 사내법이면 대응 규격을 묻는다", "성적서의 밀도·불휘발분·점도 값에 측정 방법(부)과 조건(온도·가열 조건·유출컵 종류)이 적혀 있는지 본다", "로트마다 할 액상 시험과 승인·정기에 할 도막 시험을 사양서에서 나눠 정했는지 확인한다", "고객 규격 판과 성적서 판이 다르면 어느 판을 따를지 사양서에 적었는지 본다"], "example": "예를 들어 A사는 도료사 성적서의 점도가 매번 규격 안인데도 도장 업체에서 '너무 묽다'는 말을 들었다. 확인해 보니 사양서는 ISO 2431의 한 구경 컵을, 도료사는 사내법으로 다른 구경 컵을 쓰고 있었다. 두 숫자는 애초에 비교할 수 없는 값이었다. A사는 사양서에 유출컵 규격·구경·온도를 적고 성적서 양식을 맞추게 했다(가상 사례).", "media": [{"type": "image", "file": "r2-standards-01.svg", "caption": "액상 시험은 **통 안의 도료**로 '같은 도료가 왔나'를, 도막 시험은 **칠해 굳힌 판**으로 '쓸 만한 막이 되나'를 본다. 로트마다 하는 것과 승인 때 하는 것이 다르다(개념도).", "alt": "두 줄 흐름도. 위 줄은 도료 통 → 액상 시험(밀도·불휘발분·점도·분산도) → 성적서·수입검사 → '같은 도료가 왔나, 로트마다'. 아래 줄은 칠한 시험판 → 도막 시험(막두께·부착·내식·내후) → 승인·정기 시험 → '쓸 만한 막이 되나, 승인·정기'. 가운데에 색·광택 시험판이 두 줄을 잇는다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzMwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7slaHsg4Eg7Iuc7ZeY6rO8IOuPhOuniSDsi5ztl5jsnZgg65GQIOykhCDtnZDrpoTrj4Qg4oCUIOuPhOujjCDthrXsnLzroZwg66Gc7Yq466eI64ukIO2VmOuKlCDslaHsg4Eg7Iuc7ZeYLCDsuaDtlZwg7YyQ7Jy866GcIOyKueyduMK37KCV6riw7JeQIO2VmOuKlCDrj4Trp4kg7Iuc7ZeYPC90aXRsZT4NCjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiNGQUZDRkIiLz4NCjx0ZXh0IHg9IjIwLjAiIHk9IjMyLjAiIGZvbnQtc2l6ZT0iMTciIGZpbGw9IiMxODIwMkEiIGZvbnQtd2VpZ2h0PSI3MDAiPuyVoeyDgSDsi5ztl5jqs7wg64+E66eJIOyLnO2XmCDigJQg66y07JeH7Jy866GcLCDslrjsoJwgKOqwnOuFkOuPhCk8L3RleHQ+DQo8cmVjdCB4PSI0MC4wIiB5PSI3MC4wIiB3aWR0aD0iNjAuMCIgaGVpZ2h0PSI1OC4wIiBmaWxsPSIjQzlEMkRCIiBzdHJva2U9IiM0NjUyNjAiIHN0cm9rZS13aWR0aD0iMS4yIi8+DQo8ZWxsaXBzZSBjeD0iNzAiIGN5PSI3MCIgcng9IjMwIiByeT0 거가 없다."}], "ncs": ["c05-inspection-standard"], "silmu": ["s6-coating-test"], "pyo": ["p9-film-tests"], "scopes": ["spec", "test"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 10장(입고 도료 시험과 도막 시험의 구분, 점도 유출컵 종류에 따라 값이 다름)", "e나라 표준인증 KS M ISO 2811-1(밀도 측정 — 비중병법, 표준분야 M 화학·M18 안료·도료잉크, ISO 2811-1 IDT 일치, 최종 개정·확인 2022-11-09) https://standard.go.kr/KSCI/standardIntro/getStandardSearchView.do?ksNo=KSMISO2811-1", "e나라 표준인증 KS M ISO 3251(비휘발분 함량 측정), KS M ISO 3233-1(비휘발분의 부피분율 측정), KS M ISO 2431(흐름 컵 흐름 시간), KS M ISO 1524(연화도 측정), KS M ISO 15528(시료 채취), KS M ISO 1513(시험용 시료의 검사와 제조) https://standard.go.kr", "e나라 표준인증 KS M ISO 2813(광택값 측정), KS M ISO 3668(도료 색채의 시각적 비교), KS M ISO 2808(도막 두께 측정), KS M ISO 2409(밀착성 시험) https://standard.go.kr"], "note": "KS M ISO 규격 이름은 e나라 표준인증(standard.go.kr)에서 확인했다(확인 시점 2026-11). 각 규격의 최신 판 연도는 2811-1 외에는 확인하지 않았으므로 판은 원문에서 확인한다."}, {"id": "r2-approved-list", "title": "지정 도료 목록 운영: 승인된 도료만 쓰게 하는 장치", "aliases": ["지정 도료 목록", "승인 도료 목록", "approved paint list", "도료 승인 목록"], "stage": "s2", "lens": "mgmt", "order": 3, "kind": "tool", "oneLiner": "지정 도료 목록은 승인된 도료의 도료사·품번·용도·승인일·적용 품목·상태를 한 표에 모아, 목록 밖 도료가 라인에 들어오지 못하게 하는 관리 장치이다.", "body": "지정 도료 목록(approved paint list)은 회사가 승인한 도료만 적은 표다. 도장 업체가 여럿이고 도료 품번이 수십 개가 되면, 사양서만으로는 '지금 어느 업체가 어떤 도료를 쓰는지' 알 수 없다. 목록은 이 질문에 한 장으로 답한다.\n\n목록의 한 줄에는 다음을 적는다.\n- 도료사·생산 공장, 전체 품번, 짝이 되는 희석제·경화제 품번\n- 용도(하도·상도, 실내·옥외)와 도장계\n- 근거 사양서 번호·판, 승인 시험 보고서 번호, 승인일\n- 적용 품목(부품 번호)과 사용 도장 업체\n- 상태: 사용 중·조건부(기간 한정)·신규 적용 금지·폐지\n\n도면이나 도료 구매 사양서에는 목록 번호를 적어 '이 목록의 승인 품번 가운데서 쓴다'고 연결한다. 그러면 품번이 바뀔 때 도면을 고치지 않고 목록만 개정하면 된다.\n\n목록 밖 도료를 쓰면 생기는 일은 분명하다. 승인 시험을 거치지 않은 도료라 내식·내후 결과를 아무도 모르고, 클레임이 나도 책임을 물을 근거가 약하다. 도장 업체가 결품을 이유로 '같은 색 다른 도료'를 쓰는 일이 가장 흔하다. 그래서 대체품은 사전 신청을 받아 수량·기간을 한정한 임시 승인으로만 쓰게 한다.\n\n목록은 살아 있어야 한다. 새 도료 승인 절차를 마치면 등록하고, 도료사의 단종 통보·처방 변경·규제 성분 발견 때는 상태를 바꾼다. 몇 년째 쓰지 않는 품번은 폐지해 재고와 혼동을 줄인다. 개정할 때마다 개정 번호와 날짜를 붙여 도장 업체에 배포하고, 업체 점검 때는 도료 창고의 품번을 목록과 대조해 목록 밖 도료가 있는지 본다.", "keyPoints": ["목록 한 줄 = 도료사·공장·품번(희석제·경화제 포함), 용도·도장계, 근거 사양서·승인 보고서·승인일, 적용 품목·업체, 상태", "도면·사양서에는 목록 번호를 적고 품번은 목록에서 개정 관리한다", "목록 밖 도료는 승인 시험이 없어 성능도 책임도 불분명하다", "결품 대체품은 사전 신청과 수량·기간 한정 임시 승인으로만 쓰게 한다", "단종·처방 변경·규제 성분 발견 때 상태를 바꾸고, 업체 창고와 정기 대조한다"], "tables": [{"caption": "지정 도료 목록 견본(가상 도료사·가상 품번·예시값)", "header": ["목록 번호", "도료사·품번", "용도·도장계", "승인일", "적용 품목·업체", "상태"], "rows": [["PL-01", "A 도료사 AP-7035-G60", "실내 상도, 분체 1코트", "2025-03", "캐비닛 외판 / 갑 도장", "사용 중"], ["PL-02", "B 도료사 BE-100 + BU-9005", "옥외 하도 + 상도", "2024-11", "옥외 함체 / 을 도장", "사용 중"], ["PL-03", "C 도료사 CP-7035", "실내 상도, 분체 1코트", "2026-07(임시)", "캐비닛 외판 / 병 도장, 3개월 한정", "조건부"], ["PL-04", "B 도료사 BA-0012", "실내 상도(알키드)", "2019-05", "—", "폐지(2026-01, 규제 성분)"]]}], "checks": ["도면 도장 주기나 도료 구매 사양서에 지정 도료 목록 번호가 인용돼 있는지 확인한다", "목록의 품번마다 승인 시험 보고서 번호·승인일·적용 품목·도장 업체가 채워져 있는지 본다", "도장 업체 점검 때 도료 창고의 품번·로트를 목록과 대조해 목록 밖 도료가 있는지 확인한다", "결품 대체품은 사전 신청과 수량·기간 한정 임시 승인으로만 쓰게 했는지 본다", "도료사의 단종·처방 변경 통보를 받으면 목록 상태를 바꾸고 개정판을 배포했는지 확인한다"], "example": "예를 들어 A사 구매 담당은 도장 업체 정기 점검에서 창고의 도료 11종을 지정 도료 목록과 대조했다. 그중 1종은 목록에 없는 다른 도료사의 같은 색 도료였다. 업체는 두 달 전 결품 때 들여왔다고 했다. A사는 그 도료로 칠한 로트를 찾아 시편 시험을 하고, 이후 대체품은 임시 승인 신청서로만 받기로 했다(가상 사례).", "media": [{"type": "image", "file": "r2-approved-list-01.svg", "caption": "목록의 품번은 **승인 → 사용 중 → 신규 적용 금지 → 폐지**로 상태가 바뀐다. 결품 대체품은 **조건부(임시 승인)**로만 들어온다(개념도).", "alt": "상태 흐름도. '새 도료 승인' 화살표가 '사용 중' 상자로 들어가고, 단종 예고·처방 변경이 '신규 적용 금지'로, 규제 성분 발견·장기 미사용이 '폐지'로 이어진다. 옆에서 '결품 대체 신청'이 '조건부(수량·기간 한정)' 상자로 들어갔다가 기간이 끝나면 재승인 또는 종료로 나뉜다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzIwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7sp4DsoJUg64+E66OMIOuqqeuhneydmCDsg4Htg5wg7Z2Q66aE64+EIOKAlCDsirnsnbgsIOyCrOyaqSDspJEsIOyLoOq3nCDsoIHsmqkg6riI7KeALCDtj5Dsp4DsmYAg6rKw7ZKIIOuMgOyytOyaqSDsobDqsbTrtoAg7J6E7IucIOyKueyduDwvdGl0bGU+D 는 하도, 색·광택·내후를 맡는 상도가 쌓인다. 층마다 맡는 일은 표면처리편 「도막이 녹을 막는 원리와 부착·내후성」, 수지 계열 고르기는 「수지 계열별 성질: 에폭시·폴리에스터·아크릴·우레탄·멜라민」에서 봤다. 도료 구매에서 중요한 것은 이 층들을 **하나의 묶음, 도장계**(paint system)로 승인하고 사야 한다는 점이다.\n\n왜 묶음인가. 상도는 그 하도 위에서, 하도는 그 전처리 위에서 시험해 합격한 것이다. 층 사이 부착은 두 도료의 수지와 용제가 서로 맞아야 생긴다. 상도의 강한 용제가 하도를 녹여 들뜨게 하거나(리프팅), 하도가 너무 굳은 뒤 칠해 상도가 붙지 않거나, 두 층의 유연성이 달라 충격 때 층 사이가 갈라질 수 있다. 하도와 상도의 성질 차이가 크면 사이에 중간층을 넣기도 한다(Talbert 3장). 그래서 도료사는 자기 하도·상도 조합으로 시험한 결과만 보증한다. 다른 도료사의 하도와 상도를 섞으면 각각 승인품이어도 그 조합은 시험한 적이 없고, 층간 박리가 나면 두 도료사가 서로 상대 도료 탓을 할 수 있다.\n\n희석제와 경화제도 도장계의 일부다. 지정하지 않은 싼 범용 희석제를 쓰면 용해력과 증발 속도가 달라 흐름·광택·건조가 바뀐다. 2액형 도료는 주제와 경화제를 정한 비율(예: 부피비 4:1)로 섞어야 가교가 제대로 된다. 경화제가 모자라면 덜 굳어 내용제성과 경도가 떨어지고, 넘쳐도 물성이 나빠진다. 섞은 뒤에는 가사 시간 안에 써야 한다.\n\n구매가 할 일은 도장계를 한 줄로 적는 것이다. 사양서와 지정 도료 목록에 '전처리 – 하도 품번 – 상도 품번 – 희석제 품번 – 경화제 품번·혼합비'를 묶어 적고, 그 조합 그대로 승인 시험을 받는다. 한 층이라도 바꾸면 조합 전체를 다시 본다.", "keyPoints": ["도장계 = 전처리 + 하도 + 상도 + 희석제 + 경화제 — 이 묶음으로 시험하고 승인한다", "층간 부착은 두 도료의 수지·용제 궁합에서 나온다 — 리프팅·층간 박리가 혼용의 대표 문제다", "다른 도료사의 하도·상도를 섞으면 시험하지 않은 조합이 되고 책임도 흐려진다", "희석제·경화제를 바꾸거나 2액형 혼합비를 어기면 같은 도료라도 물성이 달라진다", "한 층이라도 바꾸면 조합 전체를 다시 승인한다"], "tables": [{"caption": "도장계 한 줄 적기(가상 도료사·가상 품번·예시값)", "header": ["층", "적을 것", "예시"], "rows": [["전처리", "종류·약품", "지르코늄 화성 처리"], ["하도", "도료사·품번, 막두께", "A 도료사 AE-100(에폭시), 20~30μm"], ["상도", "도료사·품번, 막두께", "A 도료사 AU-9005(아크릴 우레탄), 30~40μm"], ["희석제", "품번, 희석비", "A 도료사 AT-01, 10~15%"], ["경화제", "품번, 혼합비, 가사 시간", "A 도료사 AH-20, 주제:경화제 4:1(부피), 25℃에서 4시간"]]}], "checks": ["사양서·지정 도료 목록에 전처리·하도·상도·희석제·경화제 품번이 한 묶음으로 적혀 있는지 확인한다", "하도와 상도의 도료사가 다르면 그 조합으로 한 부착·층간 시험 결과가 있는지 본다", "2액형 도료는 혼합비·가사 시간이 작업 표준에 있고 혼합 기록이 남는지 확인한다", "도장 업체가 쓰는 희석제가 지정 품번인지 창고와 라인에서 확인한다", "층간 박리 클레임이 나면 박리 위치(소지–하도, 하도–상도)를 먼저 확인해 어느 층의 문제인지 가린다"], "example": "예를 들어 A사의 옥외 함체는 A 도료사 에폭시 하도와 아크릴 우레탄 상도로 승인돼 있었다. 도장 업체가 상도만 더 싼 B 도료사 제품으로 바꾼 뒤, 운송 중 찍힌 부위에서 상도가 판처럼 벗겨지는 클레임이 들어왔다. 벗겨진 면을 보니 하도는 그대로 남아 있어 하도–상도 사이의 문제였다. 두 도료사 모두 '그 조합은 시험한 적 없다'고 했고, A사는 원래 조합으로 되돌린 뒤 혼용 금지를 계약서에 적었다(가상 사례).", "media": [{ dbook(CRC Press 2008), 3장(하도·중간층·상도의 역할, 하도와 상도의 부착·팽창·충격 성질이 다르면 층 사이가 갈라질 수 있어 중간층을 쓴다, 2액형 촉매 경화)", "Talbert, Paint Technology Handbook(CRC Press 2008), 6장(2액형 도료는 도장 전에 정한 비율로 섞는다)"], "note": "혼합비 4:1, 가사 시간 4시간, 희석비 10~15%는 예시값이다. 실제 값은 도료사 TDS를 따른다."}, {"id": "r3-cost-structure", "title": "도료 원가 구조: 수지·안료·용제·첨가제·포장", "aliases": ["도료 원가", "도료 원가 구성", "paint cost structure", "소량 특색 할증", "도료 원료비"], "stage": "s3", "lens": "cost", "order": 1, "kind": "framework", "oneLiner": "도료 단가는 수지·안료·용제·첨가제의 원료비에 분산·조색·충전 제조비와 포장·물류·관리비·이윤을 더한 값이며, 원료비가 가장 큰 몫이라는 원가 구조이다.", "body": "강판 부품의 재료비를 투입 중량 × 강판 단가로 쪼개듯(실무편 「재료비 검토: 투입 중량·정미 중량·스크랩 환입」), 도료 단가도 쪼갤 수 있다. 도료는 원료를 섞어 만드는 제품이라 **원료비**가 원가의 가장 큰 몫이다. 일반 산업용 도료라면 원료비가 판매가의 절반 안팎이고, 나머지가 제조비·포장·물류·관리비·이윤이라고 보고 시작한다(예시값 — 도료 종류와 물량에 따라 크게 다르다).\n\n원료비 안에서 무엇이 큰지는 도료마다 다르다.\n- **백색·밝은 색**: 이산화티타늄(TiO₂)이 은폐력을 주는 핵심 백색 안료라 많이 들어간다(Jones 외 20장). 백색 도료는 TiO₂가 원료비의 가장 큰 항목인 경우가 많아 TiO₂ 시황이 단가를 흔든다.\n- **에폭시·우레탄 같은 고성능 도료**: 수지가 비싸고 함량도 많아 수지가 원료비를 좌우한다. 2액형은 경화제 값도 크다.\n- **용제형 도료**: 용제는 kg당 값이 싸도 양이 많아 무시할 수 없고 유가를 따라 움직인다. 분체 도료는 용제가 없는 대신 수지·안료 몫이 크다.\n- **특수 색**: 선명한 유기 안료나 메탈릭용 알루미늄 안료는 kg당 값이 높아 적게 넣어도 원가를 올린다.\n\n**제조비**는 분산(밀링) 시간, 조색·시험 횟수, 여과·충전, 설비 세척에서 나온다(Talbert 4장). 잘 풀리지 않는 안료일수록 밀링이 길고, 색을 맞추느라 조정을 여러 번 하면 시간이 든다. **포장비**는 용기 크기에 따라 kg당 값이 다르다. 4L 소포장은 200L 드럼보다 kg당 포장·충전비가 훨씬 크다.\n\n**소량 특색 할증**도 이 구조에서 나온다. 배치를 작게 만들어도 조색·시험·세척 시간은 거의 같으므로, 그 고정비를 적은 양에 나누면 kg당 값이 오른다. 견적에 소량 할증이 붙으면 배치 크기와 배치당 고정비를 물어 계산이 맞는지 본다.\n\n원가 구조를 알아야 인상 요청을 검증할 수 있다. 원료 지수 연동 단가와 도료 단가 인상 요청 검증과 협상이 모두 이 구성비 위에서 움직인다.", "keyPoints": ["도료 단가 = 원료비(수지·안료·용제·첨가제) + 제조비(분산·조색·충전) + 포장·물류 + 관리비·이윤", "원료비가 가장 큰 몫이다 — 일반 산업용 도료는 판매가의 절반 안팎(예시값)", "백색은 TiO₂, 에폭시·우레탄은 수지, 용제형은 용제가 원료비의 큰 항목이 된다", "소량 특색 할증은 배치당 고정비(조색·시험·세척)를 적은 양에 나눈 결과다", "계약 시점의 원가 구성비가 연동식 비중과 인상 검증의 기준이 된다"], "tables": [{"caption": "도료 종류별 원가 구성 비교(예시값, %)", "header": ["항목", "백색 폴리에스터 분체", "에폭시 하도(용제형)", "회색 상도(용제형)"], "rows": [["수지", "25", "28", "20"], ["안료(TiO₂·유색)", "18(TiO₂ 15)", "10", "12"], ["체질 안료·첨가제", "5", "6", "5"], ["용제", "0", "8", "12"], ["원료비 소계", "48", "52", "49"], ["제조비(분산·조색·충전)", "15", "14", "15"], ["포장·물류", "7", "8", "8"], ["관리비·이윤", "30", "26", "28"]]}], "checks": ["도료 견적을 원료비·제조비·포장·관리비·이윤으로 나눠 달라고 요청하고, 원료비 비중이 상식 범위인지 본다", "그 도료에서 가장 큰 원료가 무엇인지(백색은 TiO₂, 에폭시·우레탄은 수지) 확인한다", "소량 특색 할증은 배치 크기와 배치당 고정비를 받아 kg당 할증을 다시 계산한다", "포장 단위별 kg당 단가 차이를 받아 사용량에 맞는 용기를 고른다", "계약 시점의 원가 구성비를 기록해 두고 연동식 비중과 인상 검증에 쓴다"], "example": "예를 들어 A사가 월 50kg 쓰는 특색 상도 견적에서 kg당 14,000원을 받았다. 같은 처방의 표준색은 9,000원이었다. 도료사에 물으니 특색은 배치 200kg에 조색·시험·세척 고정비가 약 90만 원(예시)이라 kg당 4,500원이 붙고, 4L 소포장 할증 500원이 더해졌다고 했다. 계산이 맞아 할증은 받아들이되, A사는 특색 두 가지를 비슷한 표준색으로 통합할 수 있는지 설계 부서와 검토하기로 했다(가상 사례).", "media": [{"type": "image", "file": "r3-cost-structure-01.svg", "caption": "kg당 8,000원짜리 백색 용제형 상도를 쪼개면 **수지 2,400원·TiO₂ 1,600원·용제 800원**이 원료비의 큰 몫이다. 이 세 원료가 연동식의 비중(0.30·0.20·0.10)이 된다(예시값 — 원료 지수 연동 단가 실습과 같은 숫자).", "alt": "가로 막대 하나가 8,000원/kg을 수지 2,400원(30%), TiO₂ 1,600원(20%), 용제 800원(10%), 기타 원료 400원(5%), 제조비 960원(12%), 포장·물류 640원(8%), 관리비·이윤 1,200원(15%)으로 나눈다. 앞의 세 칸 위에 '연동 대상 원료 60%' 괄호가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMjkwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7rsLHsg4kg7Jqp7KCc7ZiVIOyDgeuPhCA4LDAwMOybkC9rZ+ydmCDsm5DqsIAg6rWs7ISxIOunieuMgCDigJQg7IiY7KeAIDIsNDAw7JuQLCBUaU/igoIgMSw2MDDsm5AsIOyaqeygnCA4MDDsm5Ag65OxIOyYiOyLnDwvdGl0bGU+DQo8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQo8dGV4dCB4PSIyMC4wIiB5PSIzMi4wIiBmb250LXNpemU9IjE3IiBmaWxsPSIjMTgyMDJBIiBmb250LXdlaWdodD0iNzAwIj7rsLHsg4kg7Jqp7KCc7ZiVIOyDgeuPhCA4LDAwMOybkC9rZ+ydmCDqtazshLEgKOyYiOyLnOqwkik8L3RleHQ+DQo8cmVjdCB4PSIzMC4wIiB5PSIxMDAuMCIgd2lkdGg9IjE5OC4wIiBoZWlnaHQ9IjY2LjAiIGZpbGw9IiM1RThGQzkiIHN0cm9rZT0iI0ZGRkZGRiIgc3Ryb2tlLXdpZHRoPSIxLjIiLz4NCjx0ZXh0IHg9IjEyOS  구성비(원료비 절반 안팎, 표의 %)와 배치당 고정비는 설명용 예시값이다. 실제 구성은 도료 종류·처방·물량·도료사에 따라 크게 다르다."}, {"id": "r3-index-linkage", "title": "원료 지수 연동 단가: 수지·이산화티타늄·용제 가격을 단가에 반영하기", "aliases": ["연동 단가", "원료 지수 연동", "index-linked price", "도료 가격 연동", "D1 연동식"], "stage": "s3", "lens": "cost", "order": 2, "kind": "formula", "oneLiner": "원료 지수 연동 단가는 원료마다 기준 단가 속 비중 × 지수 변동률을 더한 변동률로 기준 단가를 조정하고, 문턱 미만이면 그대로 두는 단가 결정 방식이다.", "body": "도료 원가의 절반 안팎이 원료비이고(도료 원가 구조), 수지·TiO₂·용제 값은 석유화학·광물 시황을 따라 분기마다 움직인다. 단가를 고정해 두면 원료가 오를 때는 도료사가, 내릴 때는 회사가 손해를 본다. 그래서 원료비 몫만 원료 지수에 묶어 조정하는 **연동 단가**를 쓴다. 강판 연동(실무편 「강재 시황과 단가 연동(납품대금 연동제)」)과 원리는 같지만, 도료는 원료가 여럿이라 **원료마다 비중을 곱해 더한다**는 점이 다르다.\n\n비중의 합은 1보다 작다. 제조비·포장·이윤처럼 원료와 관계없는 몫은 연동하지 않기 때문이다. 단가 전체에 원료 지수 변동률을 그대로 곱하면 안 되는 이유가 이것이다.\n\n약정할 것은 다섯 가지다.\n1. **원료와 비중**: 원가에서 큰 원료 2~4개만 고르고, 계약 시점 원가 구성비로 비중을 정한다.\n2. **지수**: 양쪽이 같은 값을 확인할 수 있는 공표 지수를 쓴다. 공공 물가지수의 해당 품목이나 공신력 있는 시황 자료다. 도료사가 혼자 내는 내부 가격표는 피한다.\n3. **기준 시점과 조정 주기**: 기준 지수를 언제 값으로 할지(예: 계약 직전 분기 평균), 분기·반기 중 언제 다시 볼지 정한다. 조정한 뒤에는 그 시점 지수를 새 기준으로 삼는다.\n4. **문턱**: |r|이 약정 비율(예: 3%) 미만이면 조정하지 않는다. 작은 흔들림마다 단가를 바꾸는 사무 부담을 줄인다. 오를 때와 내릴 때 같은 문턱을 둔다.\n5. **지연 적용**: 지수 공표 시차와 도료사 원료 재고 때문에 원료값 변화는 도료 원가에 늦게 반영된다. '직전 분기 평균 지수를 다음 분기 단가에 적용'처럼 시차를 정하고 소급하지 않는다.\n\n법정 제도도 있다. 하도급 거래에는 하도급법의 하도급대금 연동이, 그 밖의 수·위탁 거래에는 상생협력법의 **납품대금 연동제**가 적용된다. 납품대금의 10% 이상을 차지하는 주요 원재료는 10% 이내에서 협의한 비율 이상 변동하면 대금을 조정하도록 약정서에 적어야 한다. 도장 외주 계약에서는 도료가 주요 원재료에 해당할 수 있다. 적용 여부와 예외는 거래 구조마다 다르므로 법무·상생 담당과 확인한다.\n\n아래 실습에서 원료 비중·지수·문턱을 바꿔 보며 새 단가를 확인한다.", "keyPoints": ["r = Σ 비중 × 지수 변동률, 새 단가 = 기준 단가 × (1 + r) — 비중 합은 1보다 작다", "단가 전체에 원료 지수 변동률을 곱하지 않는다 — 제조비·이윤은 연동하지 않는다", "약정 다섯 가지: 원료·비중, 공표 지수, 기준 시점·주기, 문턱(인상·인하 같게), 지연 적용", "조정한 뒤에는 그 시점 지수를 새 기준으로 삼아 중복 계산을 막는다", "도장 외주처럼 도료가 주요 원재료인 거래는 납품대금·하도급대금 연동 대상인지 확인한다"], "tables": [{"caption": "연동 약정 항목 견본(예시값)", "header": ["항목", "약정 예", "확인할 점"], "rows": [["연동 원료·비중", "수지 0.30, TiO₂ 0.20, 용제 0.10", "계약 시점 원가 구성비와 맞는지"], ["지수", "품목별 공표 물가지수·시황 지수", "양쪽이 같은 값을 볼 수 있는지"], ["기준 시점", "계약 직전 분기 평균 = 100", "단가를 정한 시점과 같은지"], ["조정 주기", "분기", "지수 공표일과 맞는지"], ["문턱", "|r| 3% 이상일 때 조정", "인상·인하에 같은 문턱인지"], ["적용 시점", "직전 분기 평균 → 다음 분기 첫 발주분", "소급 적용하지 않는지"], ["조정 후 기준", "조정한 분기 지수를 새 기준으로", "누적 변동을 두 번 반영하지 않는지"]]}], "formulas": [{"name": "원료 지수 연동 단가(D1)", "expr": "r = Σ w_i × (I_i,신 ÷ I_i,기준 − 1) · 새 단가 = 기준 단가 × (1 + r) · |r| < 문턱이면 조정하지 않음", "vars": {"r": "단가 변동률(소수, 0.045 = 4.5%)", "w_i": "원료 i가 기준 단가에서 차지하는 비중(소수) — 합은 1보다 작다", "I_i,기준": "원료 i의 기준 시점 지수", "I_i,신": "원료 i의 비교 시점 지수", "문턱": "조정을 시작하는 |r|의 최소값(예: 3%)"}, "example": "기준 단가 8,000원/kg(예시). 수지 0.30 × (115 ÷ 100 − 1) = +0.045, TiO₂ 0.20 × (90 ÷ 100 − 1) = −0.020, 용제 0.10 × (120 ÷ 100 − 1) = +0.020 → r = 0.045(4.5%). 문턱 3% 이상이므로 조정한다 → 새 단가 8,000 × 1.045 = 8,360원/kg"}], "checks": ["연동 원료의 비중이 계약 시점 원가 구성비와 맞고 합이 1보다 작은지 확인한다", "지수가 공표 지수인지, 기준 시점·조정 주기·적용 시점이 계약서에 숫자로 적혀 있는지 본다", "인상과 인하에 같은 문턱을 적용하는지 확인한다", "도료사가 낸 조정 계산을 D1 식으로 다시 계산해 단가 전체에 지수 변동률을 곱하지 않았는지 본다", "도장 외주 계약에서 도료가 주요 원재료에 해당하는지 법무·상생 담당과 확인해 연동 약정을 빠뜨리지 않는다"], "example": "예를 들어 A사와 도료사는 백색 상도에 수지 0.30·TiO₂ 0.20·용제 0.10 비중, 문턱 3%로 연동을 약정했다. 한 분기 뒤 수지 지수는 115, TiO₂는 90, 용제는 120이 되었다. 도료사는 처음에 '원료 평균 15% 상승'이라며 8% 인상을 요청했지만, 약정 식으로 계산한 r은 4.5%였다. 두 회사는 다음 분기 첫 발주분부터 8,360원/kg을 적용하고 이 분기 지수를 새 기준으로 삼았다(가상 사례).", "media": [{"type": "image", "file": "r3-index-linkage-01.svg", "caption": "기준 단가 8,000원에서 수지 **+360원**, TiO₂ **−160원**, 용제 **+160원**을 더해 새 단가 **8,360원**(r = 4.5%)이 된다. 원료와 관계없는 40%는 움직이지 않는다(예시값 — 실습 기본값과 같다).", "alt": "폭포 막대 그림(세로축은 7,600원부터 표시). 왼쪽 기준 단가 8,000원 막대에서 수지 +360원(지수 100→115) 초록 막대가 오르고, TiO₂ −160원(100→90) 빨간 막대가 내려가고, 용제 +160원(100→120) 초록 막대가 오른 뒤 오른쪽 새 단가 8,360원 막대로 끝난다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzg1IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7sl7Drj5kg64uo6rCAIO2Pre2PrCDrp4nrjIAg4oCUIOq4sO "answer": 3, "explain": "r = 0.30 × 0.20 = 0.06, 곧 6%다. 문턱 3% 이상이므로 조정한다. 20%는 단가 전체에 원료 지수 변동률을 곱한 값이고, 30%는 비중을 인상률로 착각한 값이다."}, {"q": "이번 분기 연동식으로 계산한 r이 −2.5%이고 문턱은 ±3%다. 도료사는 지난 분기 r이 +2.8%일 때 조정을 요청하지 않았다. 이번 분기 처리로 맞는 것은?", "options": ["문턱 미만이므로 조정하지 않는다 — 인상과 인하에 같은 문턱을 적용한다", "인하는 문턱과 관계없이 바로 적용한다", "지난 분기와 합쳐 +0.3%로 올린다", "도료사에 인하 대신 포장 변경을 요구한다"], "answer": 0, "explain": "문턱은 오를 때나 내릴 때나 같아야 공정하다. |−2.5%| < 3%이므로 조정하지 않는다. r은 기준 시점 대비로 매번 계산하므로 지난 분기 값과 더하지 않는다. 포장 변경은 연동과 별개의 협상이다."}], "ncs": ["c08-raw-material-techniques", "c07-price-quantity-variance"], "silmu": ["s1-price-linkage"], "jae": ["m6-metal-pricing"], "scopes": ["price"], "sources": ["국가법령정보센터, 대·중소기업 상생협력 촉진에 관한 법률 제21조(약정서의 발급 — 납품대금 연동 대상 물품명·주요 원재료·조정요건·기준 지표·산식 기재, 소기업·단기·소액·미연동 합의 때 예외, 탈법행위 금지) https://www.law.go.kr/LSW/lsLawLinkInfo.do?lsJoLnkSeq=1000467863&chrClsCd=010202&lsId=010165", "중소벤처기업부, 정책뉴스 「중기·벤처업계 14년 숙원 과제 '납품단가 연동제' 도입」(2022-12-09 — 주요 원재료는 비용이 납품대금의 10% 이상, 조정요건 비율은 10% 이내에서 협의) https://www.korea.kr/news/policyNewsView.do?newsId=148909237", "실무편 s1-price-linkage(하도급대금 연동제와 상생협력법 납품대금 연동제의 구분, 2023-10-04 시행)"], "note": "확인 시점 2026-11. 납품대금 연동제는 국가법령정보센터 제21조(시행 2026. 9. 29. 판)와 중기부 정책뉴스로 대조했다. '주요 원재료' 정의 조문(제2조) 원문은 직접 보지 못해 중기부 자료와 실무편 카드의 설명을 따랐다. 에너지 경비를 연동 대상에 넣는 상생협력법 개정(2025-11 국회 통과, 중기부 보도자료로는 공포 1년 뒤 적용)은 한 곳에서만 확인해 본문에 넣지 않았다. 도료 구매·도장 외주가 수·위탁·하도급 거래에 해당하는지는 거래마다 다르다. 비중·지수·문턱은 예시값이며 실습 기본값과 같다."}, {"id": "r3-price-basis", "title": "단가 비교 기준 환산: kg·L·고형분·m²당 단가", "aliases": ["단가 환산", "고형분 단가", "m² 단가", "applied cost", "도료 단가 비교"], "stage": "s3", "lens": "cost", "order": 3, "kind": "formula", "oneLiner": "도료 단가 비교는 kg 단가를 비중으로 L 단가로, 부피 고형분으로 고형분 L 단가로, 이론 도포 면적과 도착 효율로 m² 단가로 바꿔 같은 기준에서 하는 환산이다.", "body": "도료 견적은 도료사마다 단위가 다르다. kg당, L당, 통당으로 오고, 같은 단위라도 고형분이 달라 그대로 비교하면 틀린다. 부품에 남는 것은 통의 무게가 아니라 **마른 도막**이다. 그래서 단가는 '도막 1m²를 만드는 데 드는 돈'까지 바꿔서 비교한다(Talbert 12장).\n\n환산은 네 단계다.\n1. **kg → L**: L 단가 = kg 단가 × 비중(kg/L). 비중은 TDS에 있다. 안료를 많이 넣은 무거운 도료는 kg 단가가 싸 보여도 L 단가는 비싸질 수 있다.\n2. **고형분 L 단가**: L 단가 ÷ (VS ÷ 100). 용제는 날아가므로 막이 되는 고형분 1L의 값을 본다. 불휘발분은 반드시 부피%(VS)를 쓴다.\n3. **이론 도포 면적**: 10 × VS ÷ DFT(μm). 표면처리편 「도착 효율과 도료 소요량」의 식 그대로다.\n4. **m² 단가**: L 단가 ÷ (이론 도포 면적 × TE ÷ 100). DFT와 TE가 같으면 2단계와 순위가 같고, 권장 두께나 라인이 다르면 순위가 바뀔 수 있다.\n\n**희석제**도 넣는다. 도장 전에 10~20% 희석한다면 희석제 값은 더해지지만 고형분은 늘지 않는다. 희석비가 큰 도료는 희석제 비용과 VOC가 함께 늘어난다. **분체**는 용제가 없어 고형분이 거의 100%이므로 kg 단가를 m²/kg(1,000 ÷ (비중 × DFT))으로 바꿔 비교한다. 분체끼리는 비중이 낮은 쪽이 같은 무게로 더 넓게 칠한다.\n\n**싸 보이는 도료의 함정**은 대개 고형분이 낮거나, 비중이 높거나, 은폐를 위해 권장 두께가 두꺼운 도료다. kg 단가가 10% 싸도 VS가 낮으면 m²당 값은 더 비쌀 수 있다. 견적을 받으면 kg 단가·비중·VS·권장 DFT를 한 표에 놓고 m² 단가로 순위를 다시 매긴다. 아래 예에서는 kg 단가가 14% 비싼 B가 m²당 약 11% 싸다.\n\n아래 실습에서 두 도료의 kg 단가·비중·VS·DFT·TE를 바꿔 보며 m² 단가를 확인한다.", "keyPoints": ["L 단가 = kg 단가 × 비중, 고형분 L 단가 = L 단가 ÷ (VS ÷ 100)", "이론 도포 면적 = 10 × VS ÷ DFT, m² 단가 = L 단가 ÷ (이론 도포 면적 × TE ÷ 100)", "불휘발분은 부피%(VS)로 계산한다 — 질량%를 쓰면 도료가 싸 보인다", "희석제는 비용에 더하고 고형분에는 더하지 않는다. 분체는 m²/kg으로 비교한다", "kg 단가가 싼 도료도 VS·비중·권장 두께가 불리하면 m²당 더 비싸다"], "tables": [{"caption": "두 도료 견적 환산표(예시값 — 실습 기본값과 같다, DFT 30μm·TE 60%)", "header": ["항목", "도료 A", "도료 B"], "rows": [["kg 단가", "7,000원", "8,000원"], ["비중 SG", "1.30", "1.25"], ["L 단가", "9,100원", "10,000원"], ["부피 고형분 VS", "50%", "62%"], ["고형분 L 단가", "18,200원", "16,129원"], ["이론 도포 면적", "16.67m²/L", "20.67m²/L"], ["m² 단가", "910원", "806원"]]}], "formulas": [{"name": "단가 비교 기준 환산(D2)", "expr": "L 단가 = kg 단가 × SG · 고형분 L 단가 = L 단가 ÷ (VS ÷ 100) · 이론 도포 면적(m²/L) = 10 × VS ÷ DFT · m² 단가 = L 단가 ÷ (이론 도포 면적 × TE ÷ 100)", "vars": {"SG": "비중(kg/L) — TDS 값", "VS": "부피 고형분(%) — TDS 값", "DFT": "건조 도막 두께(μm)", "TE": "도착 효율(%)"}, "example": "DFT 30μm·TE 60%(예시). A: 7,000원/kg × 1.30 = 9,100원/L → ÷ 0.50 = 고형분 18,200원/L → 10 × 50 ÷ 30 = 16.67m²/L → 9,100 ÷ (16.67 × 0.6) = 910원/m². B: 8,000원/kg × 1.25 = 10,000원/L → ÷ 0.62 = 고형분 16,129원/L → 20.67m²/L → 10,000 ÷ (20.67 × 0.6) = 806원/m². kg 단가가 14% 비싼 B가 m²당 약 11% 싸다"}], "checks": ["도료 견적을 kg 단가·비중·VS·권장 DFT를 한 표에 모아 m² 단가로 순위를 다시 매긴다", "불휘발분이 부피%(VS)인지 확인하고, 질량% 값으로 고형분 단가를 계산하지 않았는지 본다", "희석비와 희석제 단가를 받아 도장 직전 기준 단가에 더했는지 확인한다", "분체 도료는 비중과 DFT로 m²/kg을 구해 비교한다", "kg 단가가 낮은 제안은 VS·비중·권장 두께가 불리하지 않은지 먼저 확인한다"], "example": "예를 들어 A사는 회색 상도 견적에서 kg 단가가 가장 싼 C 도료사를 고르려 했다. 환산표를 만들어 보니 C 도료는 비중이 높고 VS가 45%라 m² 단가가 다른 두 도료보다 약 20% 비쌌다. A사는 m² 단가가 가장 낮은 도료로 승인 시험을 진행하고, 이후 모든 도료 견적에 비중·VS·권장 DFT를 함께 적어 내게 했다(가상 사례).", "media": [{"type": "image", "file": "r3-price-basis-01.svg", "caption": "kg·L 단가로는 **A가 싸지만**, 고형분 L 단가와 m² 단가로 바꾸면 **B가 싸다**. 비교 기준을 바꾸면 순위가 뒤집힌다(예시값 — 실습 기본값과 같다).", "alt": "네 쌍의 막대그래프. kg 단가 A 7,000·B 8,000원, L 단가 A 9,100·B 10,000원에서는 A 막대가 낮고, 고형분 L 단가 A 18,200·B 16,129원, m² 단가 A 910·B 806원에서는 B 막대가 낮다. 쌍마다 더 싼 쪽에 초록 표시가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzYwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7rj4Tro4wgQeyZgCBC66W8IGtnIOuLqOqwgMK3TCDri6jqsIDCt+qzoO2Yleu2hCBMIOuLqOqwgMK3bcKyIOuLqOqwgOuhnCDruYTqtZDtlZwg66eJ64yAIOKAlCDqs6DtmJXrtoTCt23CsiDquLDspIDsl5DshJwg7Iic7JyE6rCAIOuSpOynke2eiOuKlCDsmIjsi5w8L3RpdGxlPg0KPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI0ZBRkNGQiIvPg0KPHRleHQgeD0iMjAuMCIgeT0iMzIuMCIgZm9udC1zaXplPSIxNyIgZmlsbD0iIzE4MjAyQSIgZm9udC13ZWlnaHQ9IjcwMCI+67mE6rWQIOq4sOykgOydhCDrsJTqvrjrqbQg7Iic7JyE6rCAIOuSpOynke2ejOuLpCDigJQg64+E66OMIEEgdnMgQiAo7JiI7Iuc6rCSKTwvdGV4dD4NCjxyZWN0IHg9IjIwLjAiIHk9IjQ2LjAiIHdpZHRoPSIxNC4wIiBoZWlnaHQ9IjE0LjAiIGZpbGw9IiMyRjhGNUIiLz4NCjx0ZXh0IHg9IjQwLjAiIHk9IjU4LjAiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM0NjUyNjAiPuq3uCDquLDspIDsl5DshJwg642UIOyLvCDrj4Tro4w8L3RleHQ+DQo8cmVjdCB4PSIyMDAuMCIgeT0iNDYuMCIgd2lkdGg9IjE0LjAiIGhlaWdodD0iMTQuMCIgZmlsbD0iIzk4QThCQSIvPg0KPHRleHQgeD0iMjIwLjAiIHk9IjU4LjAiIGZvbnQtc2l6ZT0iMTQiIGZpbGw9IiM0NjUyNjAiPuuNlCDruYTsi7wg64+E66OMPC90ZXh0Pg0KPHJlY3QgeD0iNjAuMCIgeT0iMTMxLjIiIHdpZHRoPSI1Mi4wIiBoZWlnaHQ9IjE0OC44IiBmaWxsPSIjMkY4RjVCIi8+DQo8dGV4d ces": ["Talbert, Paint Technology Handbook(CRC Press 2008), 7장(도장 방식별 도착 효율), 12장(액체 도료의 면적당 도료비 — 고형분으로 이론 도포 면적을 구하고 막두께·도착 효율로 실제 도포 면적을 구해 L 단가를 나눈다)", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 28장(분체 도료 — 용제가 없어 고형분이 거의 100%)", "표면처리편 p7-transfer-efficiency(P3 이론 도포 면적 = 10 × VS ÷ DFT, P4 분체 m²/kg)"], "note": "D2의 이론 도포 면적은 표면처리편 P3과 같은 식이다. 단가·비중·VS·TE는 예시값이며 실습 기본값과 같다. 희석제를 넣은 환산은 실습에 넣지 않았다."}, {"id": "r3-price-review", "title": "도료 단가 인상 요청 검증과 협상", "aliases": ["도료 인상 요청", "인상률 검증", "price increase review", "도료 단가 협상", "인하 조항"], "stage": "s3", "lens": "cost", "order": 4, "kind": "process", "oneLiner": "도료 단가 인상 요청은 원료별 지수·기간·환율·물류 근거를 나눠 받고, 원료 비중으로 단가 영향을 다시 계산해 요청률과 비교한 뒤 인하 조항과 대체안까지 묶어 협상하는 절차이다.", "body": "도료사의 인상 요청은 대개 '원료값이 올랐다'는 한 문장과 인상률로 온다. 단가 변경의 일반 원칙(바뀐 행만 다시 계산한다)은 실무편 「단가 변경 요인과 연간 인하(CR)·물량 변동」에서 배웠다. 도료에서는 이 원칙을 원료 비중으로 바꿔 적용한다.\n\n먼저 **근거를 나눠 받는다**. 어떤 원료가, 어느 지수로, 언제부터 언제까지 몇 % 올랐는지, 환율(수입 원료 몫)과 물류비는 따로 얼마인지 받는다. '원료 전반 상승'처럼 뭉뚱그린 요청은 검증할 수 없다.\n\n다음은 **비중 대비 인상률 검증**이다. 원료 지수가 20% 올라도 그 원료가 단가의 30%라면 단가 영향은 6%다. 원료 지수 연동 단가의 식으로 원료별 영향을 더해 보고, 요청 인상률이 그보다 크면 차이의 근거를 묻는다. 연동 약정이 있으면 약정 식·문턱·적용 시점을 따르고, 약정 밖의 인상은 따로 협의한다. 지수는 공표 값으로 직접 확인하고, 도료사가 고점만 골라 기간을 잡지 않았는지 기준 시점을 계약 단가를 정한 때와 맞춘다.\n\n**인하 조항**도 같이 본다. 오를 때만 올리고 내릴 때 그대로 두면 단가는 한 방향으로만 간다. 인상을 받아들이더라도 같은 지수가 내려가면 같은 식으로 인하한다는 조항을 함께 합의한다.\n\n인상률 말고도 **대체안**이 있다.\n- 특색을 비슷한 표준색으로 바꾸거나 품번을 통합해 배치를 키운다\n- 소포장 대신 큰 용기로 바꿔 포장·충전비를 줄인다(유효기간 안에 다 쓸 수 있는지 확인)\n- 같은 성능의 고형분 높은 도료로 바꿔 m² 단가를 낮춘다(재승인 필요)\n- 발주를 묶어 연간 물량을 약정한다\n\n협상 자료는 한 장으로 정리한다. 요청 내용, 원료별 지수 변화와 비중, 계산한 영향, 요청과의 차이, 대체안별 효과, 회사 제안을 적는다. 실무편 「목표 원가(Should-cost) 산출과 협상 활용」의 항목별 차이 분해를 도료에 옮긴 것이다. 합의 결과는 사유·근거·전후 단가·적용일과 함께 단가 변경 이력으로 남긴다.", "keyPoints": ["인상 근거를 원료·지수·기간·환율·물류로 나눠 받는다 — 뭉뚱그린 요청은 검증할 수 없다", "원료 비중 × 지수 변동률로 단가 영향을 계산해 요청률과 비교하고 차이의 근거를 묻는다", "기준 시점을 계약 단가를 정한 때와 맞추고, 공표 지수로 직접 확인한다", "인상과 함께 같은 식의 인하 조항을 합의한다", "색 통합·큰 용기·고형분 높은 도료·연간 물량 약정 같은 대체안을 숫자로 비교한다"], "tables": [{"caption": "인상 요청 검증표(예시값 — 원료 지수 연동 단가 예시와 같은 숫자)", "header": ["원료", "비중", "지수 변화", "단가 영향"], "rows": [["수지", "0.30", "+15%", "+4.5%"], ["TiO₂", "0.20", "−10%", "−2.0%"], ["용제", "0.10", "+20%", "+2.0%"], ["계산 합계", "0.60", "—", "+4.5%"], ["도료사 요청", "—", "—", "+12%"], ["차이", "—", "—", "7.5%p — 근거 요청"]]}], "steps": ["인상 요청서에서 원료·지수·기간·환율·물류 근거를 항목별로 나눠 받는다", "공표 지수로 기간별 변동률을 직접 확인하고 기준 시점을 계약 단가를 정한 때와 맞춘다", "원료 비중을 곱해 단가 영향을 계산하고 요청 인상률과 비교한다", "연동 약정이 있으면 약정 식·문턱·적용 시점과 대조한다", "인하 조항과 대체안(색 통합·포장·고형분·물량 약정)의 효과를 계산한다", "한 장짜리 협상 자료로 합의하고 사유·전후 단가·적용일을 단가 변경 이력에 남긴다"], "checks": ["인상 요청서에 원료별 지수·기간·환율·물류 근거가 나눠 적혀 있는지 확인하고, 없으면 다시 받는다", "원료 비중 × 지수 변동률로 단가 영향을 계산해 요청 인상률과 비교한다", "도료사가 잡은 기준 시점이 계약 단가를 정한 시점과 같은지 본다", "인상 합의에 지수가 내려가면 같은 식으로 인하하는 조항이 함께 들어가는지 확인한다", "색 통합·큰 용기·고형분 높은 도료·연간 물량 약정 같은 대체안의 효과를 숫자로 비교한다", "합의 결과를 사유·근거·전후 단가·적용일과 함께 단가 변경 이력으로 남긴다"], "example": "예를 들어 A사는 도료사에서 '원료 상승'을 이유로 12% 인상 요청을 받았다. 원료별 근거를 받아 계산하니 수지·TiO₂·용제의 영향 합계는 4.5%였고, 도료사는 나머지를 물류비라고 했다. 물류비는 단가의 약 5%(예시)라 20% 올라도 1%p였다. A사는 5.5% 인상과 같은 식의 인하 조항을 제안했고, 4L 소포장을 20L로 바꿔 kg당 포장비 3%를 줄이는 안을 함께 내 실질 인상을 2.5%로 낮췄다(가상 사례).", "media": [{"type": "image", "file": "r3-price-review-01.svg", "caption": "도료사 요청 **12%**와 원료 비중으로 계산한 **4.5%**의 차이 **7.5%p**가 협상 의제다. 차이는 환율·물류 같은 다른 근거로 설명돼야 한다(예시값).", "alt": "가로 막대 두 줄. 위 '도료사 요청'은 12% 한 막대다. 아래 '원료 비중 계산'은 수지 +4.5%(초록), TiO₂ −2.0%(빨강, 왼쪽으로), 용제 +2.0%(초록)가 이어져 합계 4.5%에서 끝나고, 4.5%와 12% 사이 빈칸에 '7.5%p — 근거 요청'이라고 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzEwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE1Ij4NCjx0aXRsZT7rj4Tro4zsgqwg7J247IOBIOyalOyyrSAxMiXsmYAg7JuQ66OMIOu5hOykkeycvOuhnCDqs4TsgrDtlZwgNC41JSjsiJjsp4AgKzQuNSwgVGlP4oKCIOKIkjIuMCwg7Jqp7KCcICsyLjAp7J2YIOywqOydtCA3LjUlcOulvCDrs7Tsl6wg7KO864qUIOunieuMgDwvdGl0bGU+DQo8cmVjdCB3aWR0aD0iMTAwJSIgaG s", "c09-negotiation-plan"], "silmu": ["s7-price-change", "s7-should-cost"], "scopes": ["price"], "sources": ["실무편 s7-price-change(바뀐 행만 다시 계산, 소급 적용 금지, 단가 변경 이력), s7-should-cost(항목별 차이 분해와 협상 우선순위)"], "note": "인상률·비중·물류비 비중·포장비 절감률은 예시값이다. 하도급 거래의 단가 결정·변경에 관한 법적 제한은 실무편 카드를 따른다."}, {"id": "r4-maker-eval", "title": "도료사 평가: 기술 지원·조색 능력·공급 안정", "aliases": ["도료사 선정", "도료 공급사 평가", "paint supplier evaluation", "도료사 평가표"], "stage": "s4", "lens": "mgmt", "order": 1, "kind": "tool", "oneLiner": "도료사 평가는 품질 시스템·시험실·조색 능력·현장 기술 지원·공급 안정·재무를 평가표로 점수화해 같은 도료를 오래 같은 품질로 받을 회사를 고르는 도구이다.", "body": "도장 업체는 도막을 만들고, 도료사는 그 도막의 재료를 만든다. 표면처리편 「표면처리 업체 평가」가 도장 업체의 공정 관리를 보는 일이라면, 도료사 평가는 **같은 처방의 도료를 배치마다 같게, 오래, 제때** 만들어 줄 회사인지 보는 일이다. 실사의 일반 절차는 실무편 실사 카드를 따르고, 여기서는 도료라서 더 보는 항목만 정리한다.\n\n- **품질 시스템과 시험실**: 출하 시험(점도·비중·불휘발분·분산도·색차·광택)을 배치마다 하는지, 측색기·광택계 교정 기록이 있는지 본다. 최근 몇 달 치 배치별 출하 시험 기록을 받으면 값이 흔들리는 폭, 곧 **배치 일관성**이 숫자로 보인다.\n- **조색 능력**: 컴퓨터 조색(CCM, computer color matching) 설비와 조색 인력, 새 색 견본을 내는 데 걸리는 기간, 색 기준판 관리 방식이다. 안료를 여러 가지 섞은 처방일수록 배치마다 재현하기 어렵다(Talbert 5장).\n- **현장 기술 지원**: 라인 시험 입회, 불량이 나면 며칠 안에 기술자가 오는지, 도장 업체 교육을 해 주는지다. 도료 불량의 상당수가 희석·혼합·경화 조건에서 나오므로 기술 지원도 품질의 일부다.\n- **공급 안정**: 공장 위치와 운송 시간, 생산 능력, 소량 특색의 최소 생산량과 리드 타임, 주요 원료(수지·이산화티타늄)를 둘 이상의 원료사에서 사는지, 사고가 나면 다른 공장에서 같은 품번을 만들 수 있는지다.\n- **재무·경영**: 원료 시황이 뛰어도 버틸 체력이 있는지 본다. 방법은 실무편 재무 건전성 확인을 그대로 쓴다.\n\n평가표의 배점은 구매 전략에 맞춰 바꾼다. 외관 부품용 특색 도료라면 조색·기술 지원 배점을, 대량으로 쓰는 규격색이라면 가격·공급 안정 배점을 키운다. 결과는 「새 도료 승인 절차」의 첫 단계 자료가 되고, 거래를 시작한 뒤에는 S9 「도료사 정기 평가와 연간 계약」으로 이어진다.", "keyPoints": ["도료사 평가는 '같은 도료를 배치마다 같게, 오래, 제때' 받을 수 있는지를 본다", "배치별 출하 시험 기록 몇 달 치로 배치 일관성을 숫자로 확인한다", "조색 능력(CCM·인력·견본 기간)과 현장 기술 지원은 도료사에만 있는 평가 항목이다", "공급 안정은 공장 위치·생산 능력·최소 생산량·원료 다변화·대체 공장으로 본다", "배점은 구매 전략(외관 특색 도료 vs 대량 규격색)에 맞춰 바꾼다"], "tables": [{"caption": "도료사 평가표 예(예시값) — 배점은 외관 특색 도료 기준", "header": ["영역", "확인 항목", "증거 자료", "배점"], "rows": [["품질 시스템", "인증 유효 여부, 출하 시험 항목·주기", "인증서, 출하 시험 기준서", "15"], ["시험실", "측색기·광택계·유출컵 교정, 시험 인력", "교정 성적서, 장비 목록", "5"], ["배치 일관성", "최근 6개월 배치별 점도·불휘발분·ΔE 흔들림", "배치별 출하 시험 기록", "15"], ["조색 능력", "CCM, 새 색 견본 기간, 색 기준판 관리", "견본 이력, 기준판 대장", "15"], ["기술 지원", "라인 시험 입회, 불량 대응 기한, 교육", "대응 사례, 연락 체계", "15"], ["공급 안정", "공장 위치·생산 능력·최소 생산량·원료 다변화·대체 공장", "생산 능력표, 원료 구매처 목록", "15"], ["재무·경영", "부채 비율, 매출 추이, 원료 시황 대응", "재무제표, 신용 평가", "10"], ["가격", "단가 수준, 연동 조항 수용 여부", "견적서", "10"]]}], "steps": ["후보 도료사에 인증서, 최근 6개월 출하 시험 기록, 생산 능력표, 주요 원료 구매처 목록을 요청한다", "서류 평가로 후보를 두세 곳으로 좁힌다 — 배치 기록의 흔들림 폭과 최소 생산량을 먼저 본다", "시험실·조색실·생산 현장을 방문해 배치 한 건의 출하 시험 기록을 원자료까지 따라가 본다", "평가표 점수와 지적 사항을 정리해 구매 전략에 맞는 배점으로 순위를 매긴다", "통과한 도료사의 도료를 새 도료 승인 절차(서류 검토·시편 시험)로 넘긴다"], "checks": ["최근 6개월 배치별 출하 시험 기록(점도·불휘발분·색차)을 받아 값의 흔들림 폭을 확인한다", "조색 인력·CCM 설비와 새 색 견본을 내는 데 실제로 걸린 기간을 사례로 묻는다", "주요 원료(수지·이산화티타늄)를 몇 곳의 원료사에서 사는지, 같은 품번을 만들 수 있는 다른 공장이 있는지 확인한다", "불량이 나면 기술자가 현장에 오는 기한과 연락 체계를 평가표에 적는다", "소량 특색의 최소 생산량과 리드 타임을 우리 월 사용량과 비교한다", "평가표 배점이 이 품목의 구매 전략(외관 특색 vs 대량 규격색)과 맞는지 본다"], "example": "예를 들어 A사는 외장 커버용 특색 도료를 B·C 두 도료사에 견적받았다. B 도료사가 kg 단가가 6% 쌌지만, 배치 기록을 받아 보니 최근 여섯 배치의 출하 ΔE*ab가 0.3~1.1로 흔들렸고 새 색 견본에 5주가 걸렸다. C 도료사는 0.2~0.5였고 견본에 2주가 걸렸다. 배치 일관성·조색 배점이 큰 평가표로 C 도료사를 골랐다(가상 사례).", "media": [{"type": "image", "file": "r4-maker-eval-01.svg", "caption": "가격 점수는 B 도료사가 높지만 **배치 일관성·조색·기술 지원**에서 C 도료사가 앞서 총점이 뒤집힌다. 외관 특색 도료 배점표로 매긴 점수다(예시값).", "alt": "가로 막대그래프. 품질 시스템, 시험실, 배치 일관성, 조색 능력, 기술 지원, 공급 안정, 재무, 가격 여덟 항목마다 B 도료사(회색)와 C 도료사(파랑) 점수 막대가 나란히 있고, 가격만 B가 길고 배치 일관성·조색·기술 지원은 C가 길다. 아래에 총점 B 71점, C 86점이 적혀 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNTAwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuPhOujjOyCrCDtj4nqsIDtkZwg7KCQ7IiYIOu5hOq1kCDigJQg6rCA6rKp7J2AIEIsIOy0neygkOydgCBD6rCAIOyVnuyEoOuLpCjsmIjsi5zqsJIpPC90aXRsZT4NCiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI0ZBRkNGQiIvPg0KIC "id": "r4-new-paint-approval", "title": "새 도료 승인 절차: 시편 시험에서 양산 승인까지", "aliases": ["도료 승인", "paint approval", "도료 승인 시험", "라인 시험", "line trial"], "stage": "s4", "lens": "qual", "order": 2, "kind": "process", "oneLiner": "새 도료 승인은 서류 검토·시편 시험·라인 시험·시작품 평가를 거쳐 양산 승인하고 지정 도료 목록에 올리는 절차로, 우리 도장계와 라인에서의 결과를 확인하는 일이다.", "body": "새 도료가 들어오는 이유는 여러 가지다. 새 부품 개발, 도료사 추가(이원화), 원가 절감용 전환, 단종 대체다. 어느 경우든 '도료사 시험 성적이 좋다'만으로 승인하지 않는다. 같은 도료라도 우리 소재·전처리·도장 방식·경화로에서 결과가 달라지기 때문이다. 그래서 승인은 **좁고 싼 시험에서 넓고 비싼 시험으로** 단계를 밟고, 앞 단계를 통과해야 다음 단계에 비용을 쓴다.\n\n- **서류 검토**는 TDS·MSDS·규제 적합 자료로 사양서 요구를 먼저 맞춰 보는 단계다. 경화 온도가 도장 업체 경화로 범위 밖이거나 금지 성분이 있으면 여기서 끝난다.\n- **시편 시험**은 표준 시험판이나 우리 소재 판에 칠해 색·광택·막두께·도막 물성·내식을 보는 단계다. 항목은 표면처리편 「도막 물성 시험」과 「부식 시험의 의미와 한계」에서 용도에 맞게 고른다. 염수 분무·촉진 내후는 수백 시간이 걸려 전체 일정을 정하므로 첫날 걸어 둔다.\n- **라인 시험**은 실제 도장 라인에서 한두 로트를 칠하는 단계다. 희석 비율과 도장 점도, 흐름(흘러내림·오렌지 필), 은폐, 경화 상태, 불량률, 도료 사용량을 본다. 시편에서 보이지 않던 문제가 여기서 나온다.\n- **시작품 평가**는 라인 시험 부품으로 조립·운송·고객 외관 판정을 받는 단계다. 고객이 요구하면 PPAP·초도품 검사 자료에 도장 사양 근거로 넣는다.\n- **양산 승인**에서는 승인서에 도료사·품번·적용 품목과 적용 조건(희석제·경화제 품번, 경화 조건)을 적고 「지정 도료 목록 운영」의 목록에 올린다. 색 도료는 승인 시편을 기준판으로 함께 등록한다.\n\n구매는 이 절차의 일정과 비용을 맡는다. 시험판·시료 도료 비용, 라인 시험에서 나온 불량품 비용을 누가 낼지 시험 전에 정하지 않으면 승인 뒤에 다툼이 남는다. 승인 기록은 나중에 도료사가 처방을 바꿀 때 비교 기준이 되므로 시험 원자료까지 보관한다.", "keyPoints": ["도료사 성적이 아니라 우리 소재·전처리·라인에서의 결과로 승인한다", "서류 검토 → 시편 시험 → 라인 시험 → 시작품 평가 → 양산 승인, 앞 단계를 통과해야 다음 비용을 쓴다", "염수 분무·촉진 내후처럼 오래 걸리는 시험을 첫날 걸어야 일정이 줄어든다", "라인 시험은 희석·흐름·경화·불량률·도료 사용량을 본다 — 시편에서 안 보이는 문제가 나온다", "승인서에 희석제·경화제·경화 조건까지 적고 지정 도료 목록에 등록한다"], "tables": [{"caption": "새 도료 승인 시험 매트릭스(예시) — ● 반드시, ○ 필요할 때, – 하지 않음", "header": ["시험 항목", "서류", "시편", "라인", "시작품"], "rows": [["경화 조건·VOC·금지 성분", "●", "–", "–", "–"], ["비중·점도·불휘발분(도료 자체)", "○(TDS)", "●", "●", "–"], ["색차·광택", "–", "●", "●", "●(고객 외관)"], ["막두께", "–", "●", "●", "●"], ["부착·경도·충격·굴곡", "–", "●", "●", "○"], ["내용제(경화 정도)", "–", "●", "●", "–"], ["내식(염수 분무·복합 사이클)", "–", "●", "○", "○"], ["촉진 내후", "–", "○(옥외 부품)", "–", "–"], ["작업성(희석·흐름·은폐)", "–", "–", "●", "–"], ["불량률·도료 사용량", "–", "–", "●", "–"], ["조립·운송 손상", "–", "–", "–", "●"]]}], "steps": ["서류 검토: TDS·MSDS·규제 자료로 경화 조건·VOC·금지 성분이 사양서와 도장 업체 설비에 맞는지 본다", "시편 시험: 승인 시편을 칠해 염수 분무·내후 시험을 먼저 걸고, 색·광택·도막 물성을 병행한다", "라인 시험: 도료사 기술자 입회로 한두 로트를 칠해 희석·흐름·경화·불량률·도료 사용량을 기록한다", "시작품 평가: 라인 시험 부품으로 조립·운송·고객 외관 판정을 받고, 필요하면 PPAP 자료에 넣는다", "양산 승인: 승인서에 적용 조건을 적고 지정 도료 목록·도면·사양서에 반영한다"], "checks": ["서류 검토에서 TDS 경화 조건이 도장 업체 경화로의 실제 소재 온도 범위 안에 드는지 확인한다", "염수 분무·촉진 내후처럼 오래 걸리는 시험을 시편 시험 첫날 걸어 일정표에 넣었는지 본다", "라인 시험 기록에 희석 비율·도장 점도·막두께·불량률·도료 사용량이 적혀 있는지 확인한다", "시험판·시료 도료·라인 시험 불량품 비용을 누가 부담하는지 시험 전에 문서로 정한다", "승인서에 도료 품번과 함께 희석제·경화제 품번, 경화 조건, 승인 시편 보관 위치를 적는다", "승인 뒤 지정 도료 목록 등록과 도면·사양서 반영까지 끝났는지 확인한다"], "example": "예를 들어 A사는 원가 절감용 하이솔리드 상도로 바꾸며 시편 시험을 모두 통과했다. 그런데 라인 시험에서 수직면 흘러내림이 8% 나왔다. 도료사 기술자가 입회해 도장 점도와 토출량을 조정하자 1% 아래로 떨어졌다. A사는 그 조건을 승인서의 '적용 조건'에 적은 뒤 양산 승인했다(가상 사례).", "media": [{"type": "image", "file": "r4-new-paint-approval-01.svg", "caption": "새 도료 승인은 **좁고 싼 시험에서 넓고 비싼 시험으로** 다섯 단계를 밟는다. 단계마다 통과 조건이 있고, 마지막에 지정 도료 목록에 등록한다(개념도).", "alt": "왼쪽에서 오른쪽으로 서류 검토, 시편 시험, 라인 시험, 시작품 평가, 양산 승인 다섯 상자가 화살표로 이어지고, 각 상자 아래에 그 단계에서 보는 것이 적혀 있다. 양산 승인 상자 아래로 초록 '지정 도료 목록 등록·기준판 등록' 상자가 이어지고, 맨 위 띠는 오른쪽으로 갈수록 시험 비용·범위가 커진다는 표시다. 왼쪽 아래에 불합격이면 그 단계부터 다시 한다는 빨간 설명이 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzUwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuyDiCDrj4Tro4wg7Iq57J24IOuLpOyEryDri6jqs4TsmYAg7KeA7KCVIOuPhOujjCDrqqnroZ0g65Ox66GdKOqwnOuFkOuPhCk8L3RpdGxlPg0KICA8cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjRkFGQ0ZCIi8+DQogIDx0ZXh0IHg9IjE2IiB5PSIzMiIgZm9udC1zaXplPSIxNyIgZm9udC13ZWlnaHQ9IjcwMCIgZmlsbD0iIzE4MjAyQSI+7IOIIOuPhOujjCDsirnsnbjsnYAg7KKB6rOgIOyLvCDsi5ztl5jsl5DshJwg64ST6rOgIOu5hOyLvCDsi5ztl5jsnLzroZwg6rCE64ukPC90ZXh0Pg0KICA8cG9seWdvbiBwb2ludHM9IjE2LDg2IDcwNC : "시편은 이상적인 조건에서 칠한 판이라 라인의 희석·분무·경화 조건에서 생기는 흘러내림·경화 부족·불량률을 보여 주지 못한다. 라인 시험을 거쳐야 양산 조건을 확인할 수 있다. 성적서를 더 받거나 목록에 먼저 올리는 것은 단계를 건너뛰는 일이다."}, {"q": "새 도료 승인 일정이 빠듯하다. 일정을 줄이는 데 가장 효과가 큰 방법은?", "options": ["라인 시험을 생략한다", "염수 분무 시간을 사양의 절반으로 줄여 시험한다", "부착 시험을 빼고 진행한다", "오래 걸리는 염수 분무·촉진 내후를 시편 시험 첫날 걸고 다른 시험을 병행한다"], "answer": 3, "explain": "승인 기간은 수백 시간짜리 시험이 정한다. 그 시험을 먼저 걸고 나머지를 병행하면 품질 확인을 줄이지 않고 일정이 줄어든다. 라인 시험 생략, 시험 시간 단축, 항목 삭제는 승인 근거를 약하게 만든다."}], "ncs": ["c06-project-phases", "c05-quality-requirements"], "silmu": ["s9-ppap", "s9-isir"], "pyo": ["p9-film-tests", "p9-corrosion-tests"], "scopes": ["vendor", "test", "spec"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 10장(도료·도막 시험 — 막두께·경도·충격·부착·내습·염수 분무·촉진 내후·옥외 노출)", "Talbert, Paint Technology Handbook(CRC Press 2008), 11장(도장 라인 공정 관리 — 도료 온도·점도, 플래시오프, 경화)"], "note": "단계 구성과 시험 매트릭스는 교재의 시험 항목과 실무편 PPAP·초도품 카드를 바탕으로 만든 예시이다. 일정 그림의 시험 시간(염수 분무 500시간, 촉진 내후 1,000시간)은 예시값이며 실제 시간은 고객 사양이 정한다."}, {"id": "r4-dual-source", "title": "도료 이원화와 동등성 평가", "aliases": ["도료 이원화", "second source(도료)", "동등성 평가", "equivalence evaluation", "도료사 복수화"], "stage": "s4", "lens": "qual", "order": 3, "kind": "method", "oneLiner": "도료 이원화는 같은 용도에 두 번째 도료사 도료를 승인해 공급 위험을 줄이는 일이고, 동등성 평가는 그 도료가 기존 도료와 같은 결과를 내는지 색·도막·라인으로 확인하는 일이다.", "body": "도료사 하나에만 기대면 그 공장의 화재·원료 부족·단가 인상에 그대로 노출된다. 그래서 물량이 크거나 공급 위험이 큰 도료는 **이원화**를 검토한다. 그러나 도료는 규격 기호만 같으면 바꿔 쓸 수 있는 품목이 아니다. 같은 색 번호·같은 수지 계열이라도 도료사마다 처방이 달라 색·광택·작업성·도막 물성이 조금씩 다르다.\n\n먼저 이익과 비용을 저울질한다.\n- 이익: 공급 중단 대비, 가격 비교 근거, 도료사의 대응 속도 개선\n- 비용: 색 맞춤과 승인 시험 전체, 색 기준판 이중 관리, 재고 두 벌, 도장 라인의 도료 교체·세척 손실, 물량이 나뉘어 생기는 단가 상승\n\n동등성은 '사양서 숫자 안에 든다'가 아니라 **'기존 도료와 같은 결과가 나온다'**로 판정한다.\n- 도료 자체: 비중·불휘발분(질량%·부피%)·점도, 희석 비율, 경화 조건. 부피 고형분이 다르면 같은 막두께에 드는 도료량도 다르다.\n- 색: 기준판 대비 ΔE를 광원 두세 가지에서 따로 잰다. 다른 안료 조합으로 맞춘 색은 한 광원에서만 맞는 메타메리즘이 생기기 쉽다. 원리는 표면처리편 「색과 광택의 관리」에서 봤다.\n- 도막: 광택·부착·경도·내식을 기존 도료와 같은 판·같은 라인에서 나란히 시험한다.\n- 라인: 같은 도장 조건에서 막두께·흐름·불량률·도료 사용량을 비교한다.\n\n승인 뒤에는 운용 규칙이 더 중요하다. **한 부품, 한 조립품, 나란히 보이는 부품끼리는 한 도료사 도료만 쓴다.** 두 도료가 각각 기준판에 합격해도 서로 나란히 놓이면 차이가 보일 수 있다. 부품 번호·도장 업체별로 어느 도료사 도료를 쓰는지 지정 도료 목록에 적고, 물량 배분(예: 7:3)을 정해 두 번째 도료도 꾸준히 쓴다. 몇 년 쓰지 않으면 그사이 처방 변경을 놓쳐 사실상 다시 승인해야 한다.", "keyPoints": ["이원화는 공급 위험을 줄이지만 승인 시험·기준판·재고·세척 손실이라는 비용이 든다", "동등성은 '사양 범위 안'이 아니라 '기존 도료와 같은 결과'로 판정한다", "색은 광원 두세 가지에서 따로 재서 메타메리즘을 확인한다", "한 부품·한 조립품·나란히 보이는 부품에는 한 도료사 도료만 쓴다", "물량 배분으로 두 번째 도료도 꾸준히 써야 승인 상태가 유지된다"], "tables": [{"caption": "도료 동등성 판정 항목(예시)", "header": ["구분", "항목", "판정 방법"], "rows": [["도료 자체", "비중·불휘발분(질량%·부피%)·점도", "기존 도료와의 차이, 협정 범위"], ["도료 자체", "희석 비율·경화 조건", "같은 라인 조건에서 쓸 수 있는가"], ["색", "광원별 ΔE(D65·A·형광등 계열)", "기준판, 기존 도료 시편과 각각 비교"], ["도막", "광택·부착·경도·내식", "같은 판·같은 라인에서 나란히 시험"], ["라인", "막두께·흐름·불량률·도료 사용량", "라인 시험 기록 비교"], ["운용", "적용 부품·도장 업체 구분", "지정 도료 목록에 기록"]]}], "checks": ["이원화 대상 도료의 공급 위험(단일 공장·특수 원료)과 연간 물량을 보고 이원화 비용을 감당할 만한지 먼저 판단한다", "두 도료의 불휘발분(부피%)과 희석 비율을 비교해 같은 막두께에 드는 도료량 차이를 확인한다", "색 동등성은 D65 외에 다른 광원 하나 이상에서 따로 잰 ΔE를 받아 메타메리즘을 확인한다", "지정 도료 목록에 부품 번호·도장 업체별 도료사를 적어 한 조립품에 두 도료가 섞이지 않게 한다", "물량 배분대로 두 번째 도료사 도료도 정기적으로 쓰고 있는지 본다"], "example": "예를 들어 A사는 회색 외판 도료를 B·C 두 도료사로 이원화했다. 두 도료 모두 D65에서 기준판 대비 ΔE*ab 0.5 안이었지만, 형광등 계열 광원에서는 B·C 사이가 1.6이었다. 조립품 하나에 B사 도료 커버와 C사 도료 패널이 같이 들어가면 차이가 보이므로, 조립품 단위로 도료사를 나눠 지정했다(가상 사례).", "media": [{"type": "image", "file": "r4-dual-source-01.svg", "caption": "두 도료가 각각 기준판에는 합격해도 **둘 사이의 차이는 광원에 따라 벌어진다**. D65에서만 재면 메타메리즘을 놓친다(예시값).", "alt": "세로 막대그래프. 광원 D65, A, 형광등 계열 세 묶음마다 B 도료 대 기준, C 도료 대 기준, B 대 C 세 막대가 있다. D65에서는 세 막대가 모두 허용선 1.0 아래이고, A와 형광등에서는 B 대 C 막대가 허용선을 넘어 빨갛게 표시돼 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDUwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuq0keybkOuzhCDsg4nssKgg4oCUIOuRkCDrj4Tro4zripQg6rCB7J6QIO2Vqeqyqe2VtOuPhCBBwrftmJXqtJHrk7Eg6rSR7JuQ7JeQ7IScIOyEnOu e-mgmt"], "jae": ["m9-substitution"], "pyo": ["p6-color-gloss"], "scopes": ["vendor", "spec"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 5장(광원 메타메리즘 — 다른 착색제로 맞춘 색은 광원에 따라 어긋남)", "Jones·Nichols·Pappas, Organic Coatings: Science and Technology 4판(Wiley 2017), 19장(색과 외관, 메타메리즘)"], "note": "이원화의 이익·비용과 운용 규칙은 교재에 없는 주제라 재료편 소재 변경 승인과 업계 관행을 바탕으로 썼다. 물량 배분 7:3은 예시이다."}, {"id": "r4-three-party", "title": "발주사·도장 업체·도료사의 책임 나누기", "aliases": ["삼자 책임", "도료 품질 책임 경계", "three-party responsibility", "도료사 기술 서비스", "삼자 품질 협정"], "stage": "s4", "lens": "mgmt", "order": 4, "kind": "framework", "oneLiner": "발주사·도장 업체·도료사의 책임 나누기는 도막 불량의 원인을 도료·전처리·도장 조건으로 나눠, 각자 무엇을 보증하고 기록하고 알려야 하는지 계약과 정보 흐름으로 정해 두는 틀이다.", "body": "도장 부품에는 세 회사가 얽힌다. 발주사(우리)는 사양을 정하고 도료를 지정하거나 사급한다. 도장 업체는 전처리·도장·경화를 한다. 도료사는 도료를 만들고 기술 서비스를 준다. 불량이 나면 도장 업체는 '도료가 나빴다', 도료사는 '도장 조건이 틀렸다'고 말하기 쉽다. 계약이 둘 중 한쪽과만 있으면 발주사는 다른 쪽에 직접 요구할 근거도 없다.\n\n책임은 원인 계열로 나눈다(아래 표). **도료**의 처방·배치 품질이 원인이면 도료사, **전처리·도장 조건**(희석·혼합비·막두께·경화·유효기간 지난 도료 사용)이 원인이면 도장 업체, **사양** 자체가 용도에 맞지 않으면 발주사의 몫이다. 소지 불량은 판금 협력사로 간다.\n\n문제는 경계가 흐린 불량이다. 경화 불량은 도료 반응성 탓일 수도, 경화로 온도 부족 탓일 수도 있다. 그래서 **누가 무엇을 기록하고 보관할지**를 미리 정한다. 도료사는 배치별 성적서와 보관 시료를, 도장 업체는 도료 로트별 사용·희석·혼합 기록과 경화로 온도 기록을 남긴다. 이 기록이 있어야 「도료 원인 불량 판별과 클레임」에서 원인을 가를 수 있다.\n\n계약 구조는 공급 방식에 따라 다르다(비교는 「도료 사급과 도장 업체 구매」).\n- **사급**: 발주사가 도료사와 직접 계약하므로 도료 품질 책임을 직접 묻는다. 도장 업체와는 도료 취급·사용 조건 준수를 계약한다.\n- **업체 구매·지정 구매**: 도장 업체가 도료사와 계약한다. 발주사는 도장 업체 계약에 '도료사의 변경 통보·성적서를 발주사에도 전달'을 넣고, 필요하면 도료사와 정보 공유 협약을 따로 맺는다.\n\n삼자 품질 협정에 넣을 조항은 성적서 항목과 제출 시점, 보관 시료 기간, 4M 변경 사전 통보 경로, 불량 공동 조사 절차, 보상 범위다. 도료사 기술 서비스(라인 입회·불량 조사)를 어느 범위까지 무상으로 받는지도 적어 둔다.", "keyPoints": ["불량 책임은 도료(도료사)·전처리와 도장 조건(도장 업체)·사양(발주사)으로 나눈다", "경계가 흐린 불량을 가르려면 성적서·보관 시료·사용 기록·경화로 기록을 미리 의무로 정한다", "사급이면 도료사와 직접, 업체 구매·지정 구매면 도장 업체 계약을 통해 책임을 묻는다", "도료사 변경 통보가 발주사까지 오는 경로를 계약에 넣는다", "도료사 기술 서비스의 무상 범위를 협정에 적는다"], "tables": [{"caption": "도막 불량 책임 나누기 예(예시)", "header": ["원인 계열", "대표 증상", "1차 책임", "증거 기록"], "rows": [["도료(처방·배치)", "성적서 이탈, 배치 색차, 겔화·침강, 이물, 정해진 조건에서의 경화 불량", "도료사", "성적서, 보관 시료, 배치 기록"], ["전처리·소지", "소지가 드러난 박리, 녹·물자국, 기름 오염", "도장 업체(소지 불량은 판금 협력사)", "전처리 분석 기록, 소지 검사 기록"], ["도장 조건", "막두께 이탈, 흘러내림, 혼합비 오류, 경화 부족, 유효기간 지난 도료 사용", "도장 업체", "희석·혼합 기록, 막두께, 경화로 온도 기록"], ["사양·지정", "용도에 맞지 않는 사양, 승인되지 않은 조합 지정", "발주사", "사양서, 승인 기록"]]}], "checks": ["공급 방식(사급·업체 구매·지정 구매)에 따라 도료사와의 계약 당사자가 누구인지 먼저 확인한다", "품질 협정에 성적서 제출, 보관 시료 기간, 4M 변경 사전 통보 경로, 공동 조사 절차가 있는지 본다", "도장 업체가 도료 로트별 사용·희석·혼합 기록과 경화로 온도 기록을 남기는지 확인한다", "지정 구매라면 도장 업체 계약에 '도료사 변경 통보·성적서를 발주사에도 전달' 조항을 넣는다", "도료사 기술 서비스(라인 입회·불량 조사)를 어느 범위까지 무상으로 받는지 문서로 정한다"], "example": "예를 들어 A사가 지정 구매로 쓰던 도료의 처방이 바뀌었는데, 도료사는 도장 업체에만 통보했다. A사는 석 달 뒤 고객 색 클레임을 받고서야 변경을 알았다. 이후 도장 업체 계약에 '지정 도료사 변경 통보는 받은 날부터 3일 안에 A사에 전달'을 넣고, 도료사와도 정보 공유 협약을 맺어 통보가 두 경로로 오게 했다(가상 사례).", "media": [{"type": "image", "file": "r4-three-party-01.svg", "caption": "원인 계열마다 **1차 책임과 남겨야 할 기록**이 다르다. 경계가 흐린 불량(경화 불량 등)은 양쪽 기록을 함께 봐야 가를 수 있다(개념도).", "alt": "세 열 표 모양 도해. 열 머리는 도료사, 도장 업체, 발주사다. 행은 도료, 전처리·도장 조건, 사양이며, 해당 칸에 책임 표시와 남겨야 할 기록이 적혀 있다. 아래쪽에 경화 불량이 도료와 도장 조건 경계에 걸쳐 있다는 주황 띠가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgNDU2IiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLCdBcHBsZSBTRCBHb3RoaWMgTmVvJywnTm90byBTYW5zIEtSJyxzYW5zLXNlcmlmIiBmb250LXNpemU9IjE2Ij4NCiAgPHRpdGxlPuuwnOyjvOyCrMK364+E7J6lIOyXheyytMK364+E66OM7IKs7J2YIOybkOyduCDqs4Tsl7Trs4Qg7LGF7J6E6rO8IOq4sOuhnSjqsJzrhZDrj4QpPC90aXRsZT4NCiAgPHJlY3Qgd2lkdGg9IjEwMCUiIGhlaWdodD0iMTAwJSIgZmlsbD0iI0ZBRkNGQiIvPg0KICA8dGV4dCB4PSIxNiIgeT0iMzIiIGZvbnQtc2l6ZT0iMTciIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMxODIwMkEiPuybkOyduCDqs4Tsl7Trp4jri6QgMeywqCDssYXsnoTqs7wg64Ko6rKo7JW8IO2VoCDquLDroZ3snbQg64uk66W064ukPC90ZXh0Pg0KICA8cmVjdCB4PSIyMDAiIHk9IjUyIiB3aWR0aD0iMTY2IiBoZWlnaHQ9IjM4IiByeD0iNiIgZmlsbD0iIzQ2NTI2MCIvPg0KICA8dGV4dCB4PSIyODMiIHk9Ijc3IiBmb250LXNpemU9IjE2IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LXdlaWdodD0i
