 비교하고, 바꾸는 데 드는 설비·재승인 비용을 더해 판단한다. kg 단가나 평판·선호만으로는 판단할 수 없다."}, {"q": "색 통합과 드럼 전환 두 절감안의 효과를 합치려 한다. 바른 방법은?", "options": ["색 통합을 반영한 뒤의 물량·단가로 드럼 전환 효과를 계산해 이중 계산을 막는다", "각각 기존 조건으로 계산해 그대로 더한다", "효과가 큰 쪽 하나만 보고한다", "두 효과의 평균을 보고한다"], "answer": 0, "explain": "색 통합으로 단가와 물량이 이미 바뀌었으므로 드럼 전환의 효과는 바뀐 조건에서 계산해야 한다. 기존 조건으로 따로 계산해 더하면 같은 절감을 두 번 세게 된다. 하나만 보고하거나 평균을 내면 실제 효과를 왜곡한다."}], "ncs": ["c08-raw-material-techniques", "c08-vrp"], "pyo": ["p6-voc", "p7-powder"], "scopes": ["price", "spec"], "sources": ["Talbert, Paint Technology Handbook(CRC Press 2008), 12장(도장 원가 분석 — 색 교체·재료 손실·막두께가 원가에 미치는 영향)", "Jones, Nichols, Pappas, Organic Coatings 4판(Wiley 2017), 25장(하이솔리드 도료), 28장(분체 도료의 회수·이용률)"], "note": "절감 예시는 Python으로 검산했다(8,400,000 + 12,450,000 + 3,486,000 = 24,336,000원, 22.5%). 막두께 감소에 따른 도료비는 두께에 비례한다고 단순화했다. 모든 단가·면적·비용은 예시값이다. 확인 시점 2026-11."}, {"id": "r9-supplier-review", "title": "도료사 정기 평가와 연간 계약", "aliases": ["도료사 정기 평가", "도료사 등급", "도료 연간 단가 계약", "도료 물량 배분", "도료사 개선 요구"], "stage": "s9", "lens": "mgmt", "order": 4, "kind": "process", "oneLiner": "도료사 정기 평가는 품질·납기·기술 지원·가격·변경 통보 준수를 해마다 점수로 매겨 등급을 정하고, 그 결과로 연간 단가 계약·연동 조항·물량 배분·개선 요구를 정하는 절차이다.", "body": "도료사를 고를 때 쓴 평가표(도료사 평가)는 한 번 쓰고 끝나지 않는다. 선정 뒤에는 실제 거래 실적으로 해마다, 중요한 도료사는 반기마다 다시 평가해 다음 해 계약과 물량에 반영한다. 평가표·보고서를 만드는 일반 원리는 실무편 실사 평가표·보고서와 후속 조치와 같고, 도료라서 달라지는 지표는 다음과 같다.\n\n- **품질**: 수입검사 부적합 로트 비율, 로트 간 색차(ΔE) 추이, 도료 원인 클레임 건수와 8D 회신 기한 준수.\n- **납기**: 정시 납품률, 소량 특색의 리드 타임, 입고 시 잔여 유효기간 준수율.\n- **기술 지원**: 라인 문제 때 현장 방문 속도, 조색·시편 대응 기간, 원가 절감 제안 건수.\n- **가격**: 연동식으로 계산한 단가와 실제 단가의 차이, 시황이 내릴 때 인하를 반영했는가.\n- **변경 통보 준수**: 원료·처방·공장 변경을 미리 알렸는가. 통보 없는 변경이 한 건이라도 드러나면 점수와 별도로 개선 요구를 낸다.\n\n점수로 **등급**(예: A·B·C·D)을 정하고 등급에 따라 다음 해 **물량 배분**을 바꾼다. 이원화한 품번은 A 등급 쪽 비중을 올리고, C 이하는 개선 계획서를 받아 기한 안에 재평가한다. 다만 도료는 품번을 바꾸려면 재승인이 필요하므로 물량은 이미 승인된 품번 사이에서만 옮길 수 있다. 평가 결과가 물량에 반영되려면 미리 이원화와 승인이 되어 있어야 한다는 뜻이다.\n\n**연간 계약**에는 다음을 넣는다. 품번별 기준 단가와 원료 지수 연동 조항(지수·비중·문턱·조정 주기), 연간 예상 물량과 물량 약정 범위(예: ±20%), 최소 생산량·포장 단위·잔여 유효기간 같은 공급 조건, 변경 통보 의무와 품질 협정서 연결, 재고·단종 처리 책임이다. 물량 약정은 단가 인하의 근거가 되지만, 약정보다 덜 쓰면 남은 배치 재고를 누가 떠안는지도 함께 정해 둔다.", "keyPoints": ["정기 평가 = 품질·납기·기술 지원·가격·변경 통보 준수 — 로트 간 ΔE 추이·잔여 유효기간 준수율 같은 도료 지표를 넣는다", "통보 없는 변경은 점수와 별도로 즉시 개선 요구를 낸다", "등급에 따라 물량을 옮기되, 이미 승인된 품번 사이에서만 가능하다", "연간 계약 = 기준 단가·연동 조항·물량 약정·공급 조건·변경 통보·재고 책임", "물량 약정에 못 미칠 때 재고 부담 주체를 미리 정한다"], "tables": [{"caption": "도료사 정기 평가표 예시(100점, 예시값)", "header": ["영역", "지표 예", "배점"], "rows": [["품질", "수입검사 부적합 로트율, 로트 간 ΔE 추이, 클레임·8D 회신 기한", "35"], ["납기", "정시 납품률, 특색 리드 타임, 잔여 유효기간 준수율", "20"], ["기술 지원", "현장 대응 시간, 조색·시편 대응 기간, 절감 제안", "15"], ["가격", "연동식 대비 실제 단가, 시황 하락 반영", "15"], ["변경 통보·서류", "사전 통보 준수, MSDS·성적서 갱신", "15"], ["등급 기준(예)", "A 90 이상 물량 확대 · B 80~89 유지 · C 70~79 개선 계획 · D 70 미만 축소·대체 검토", "합계 100"]]}], "steps": ["평가 기간의 수입검사·클레임·납기·단가·변경 통보 실적을 모은다", "평가표로 점수를 매기고 등급을 정한다", "도료사에 결과를 서면으로 알리고 C 이하는 개선 계획서를 받는다", "등급과 이원화 현황을 대조해 다음 해 품번별 물량 배분을 정한다", "연간 계약(기준 단가·연동 조항·물량 약정·공급 조건)을 갱신한다", "개선 계획의 이행을 기한에 맞춰 재평가한다"], "checks": ["평가 지표에 로트 간 ΔE 추이·잔여 유효기간 준수율·변경 통보 준수를 넣는다", "평가 결과를 도료사에 서면으로 알리고 C 등급 이하는 개선 계획서와 재평가 일정을 받는다", "연간 계약서에 기준 단가·연동 조항·물량 약정 범위·최소 생산량·잔여 유효기간 조건을 적는다", "물량 약정 미달·단종 때의 재고 처리 책임을 계약에 정한다", "등급에 따른 물량 이동이 승인된 품번 안에서 가능한지 이원화 현황과 대조한다"], "example": "예를 들어 A사는 두 도료사에서 같은 회색 분체를 6:4로 사고 있었다. 정기 평가에서 B 도료사는 가격 점수는 높았지만 원료 변경을 두 번 사후에 알렸고 로트 간 ΔE가 커져 C 등급이 나왔다. A사는 이듬해 비중을 8:2로 바꾸고, B 도료사의 개선 계획서를 받아 반기 뒤 재평가하기로 했다(가상 사례).", "media": [{"type": "image", "file": "r9-supplier-review-01.svg", "caption": "정기 평가는 **실적 → 점수·등급 → 물량 배분·연간 계약·개선 요구**로 이어진다. 물량은 승인된 품번 사이에서만 움직인다(예시값).", "alt": "왼쪽에 실적 자료 다섯 칸(품질 35, 납기 20, 기술 지원 15, 가격 15, 변경 통보 15)이 있고 가운데 등급 상자(A·B·C·D)로 모인다. 오른쪽으로 세 갈래 화살표가 '물량 배분(이원화 품번만)', '연간 계약 갱신(기준 단가·연동·물량 약정)', '개선 요구·재평가(C 이하, 통보 위반)'로 이어진다. 아래에 예시 '6:4 → 8:2' 막대가 있다.", "credit": "자체 제작", "license": "자체 제작", "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA3MjAgMzkwIiBmb250LWZhbWlseT0iJ01hbGd1biBHb3RoaWMnLC aint-claim", "stages": ["s6"]}, {"term": "GHS 그림문자", "def": "화학물질의 유해·위험 종류를 붉은 테 마름모 안 기호로 보여 주는 국제 공통 표시", "concept": "r8-msds-ghs", "stages": ["s8"]}, {"term": "SCI·SCE", "def": "적분구 측색에서 정반사 빛을 포함(SCI)하거나 빼고(SCE) 재는 방식. 광택이 낮을수록 두 값 차이가 크다", "concept": "r5-color-approval", "stages": ["s5"]}, {"term": "SVHC 후보 목록", "def": "EU REACH가 고위험 우려 물질로 지정해 공표하는 목록. 계속 추가되며 성형품 0.1% 정보 전달 의무의 기준이 된다", "concept": "r8-svhc", "stages": ["s8"]}, {"term": "VOC 함유기준", "def": "대기환경보전법이 용도별로 정한 도료 1L당 휘발성유기화합물 상한(g/L). 공급·판매 단계에 적용한다", "concept": "r8-voc-waste", "stages": ["s8"]}, {"term": "m² 단가", "def": "L 단가를 이론 도포 면적 × 도착 효율로 나눈, 도막 1m²를 만드는 데 드는 도료값", "concept": "r3-price-basis", "stages": ["s3"]}, {"term": "간섭 안료(펄 안료)", "def": "운모 등 얇은 판에 금속 산화물을 입혀 빛의 간섭으로 색을 내는 안료. 각도에 따라 색상이 바뀐다", "concept": "r5-effect-color", "stages": ["s5"]}, {"term": "검사 수준 조정", "def": "공급 이력과 위험에 따라 검사 항목·빈도를 높이거나 줄이는 일", "concept": "r6-incoming", "stages": ["s6"]}, {"term": "고형분 L 단가", "def": "L 단가를 부피 고형분으로 나눈 값. 막이 되는 고형분 1L의 값이다", "concept": "r3-price-basis", "stages": ["s3"]}, {"term": "과도장", "def": "사양 최소 두께를 지키려다 평균 막두께가 필요 이상 두꺼워지는 것. 도료 사용량을 늘리는 가장 흔한 원인이다", "concept": "r9-consumption", "stages": ["s9"]}, {"term": "균질 물질", "def": "기계적으로 더 나눌 수 없는 한 가지 재료. RoHS 농도 판정의 분모이며 도막도 보통 하나로 본다", "concept": "r8-svhc", "stages": ["s8"]}, {"term": "기술 자료(TDS)", "def": "도료사가 내는 제품 설명서. 불휘발분·비중·점도·경화 조건·보관 기간 같은 대표값을 적는다", "concept": "r1-tds-msds", "stages": ["s1"]}, {"term": "납품대금 연동제", "def": "상생협력법상 주요 원재료 가격이 약정 비율 이상 변하면 납품대금을 조정하도록 약정서에 적게 한 제도", "concept": "r3-index-linkage", "stages": ["s3"]}, {"term": "대체자료(MSDS)", "def": "영업비밀 성분의 명칭·함유량 대신 적는 자료. 고용노동부 승인이 필요하고 유효기간은 5년이다", "concept": "r8-msds-ghs", "stages": ["s8"]}, {"term": "도료 사용 기록", "def": "도장 업체가 도료 로트별 개봉·투입·보충 시각과 양을 적는 기록. 로트 추적의 가운데 고리다", "concept": "r6-lot-trace", "stages": ["s6"]}, {"term": "도료비 비중", "def": "도장비 가운데 도료값이 차지하는 비율. 도료 단가 변동이 도장비에 옮겨 가는 크기를 정한다", "concept": "r1-why-paint-buy", "stages": ["s1"]}, {"term": "도료사 기술 서비스", "def": "도료사가 라인 입회·도장 조건 조정·불량 조사로 도장 업체와 발주사를 돕는 일", "concept": "r4-three-party", "stages": ["s4"]}, {"term": "도장계(paint system)", "def": "전처리·하도·상도·희석제·경화제를 한 묶음으로 본 승인 단위", "concept": "r2-paint-system", "stages": ["s2"]}, {"term": "동결·해동 안정성", "def": "수용성 도료가 얼었다 녹아도 덩어리 없이 원래 상태를 유지하는 성질. 대개 약해 동결을 피한다", "concept": "r7-storage", "stages": ["s7"]}, {"term": "동등성 평가", "def": "대체 도료가 기존 도료와 같은 결과를 내는지 도료 성질·색·도막·라인 조건으로 비교해 판정하는 일", "concept": "r4-dual-source", "stages": ["s4"]}, {"term": "딱딱한 침강", "def": "안료가 바닥에 굳게 가라앉아 정해진 교반으로도 다시 섞이지 않는 상태", "concept": "r6-paint-claim", "stages": ["s6"]}, {"term": "라이트 부스(light booth)", "def": "표준 광원을 바꿔 가며 색을 육안으로 비교하는 상자. 배경색과 조명 조건이 정해져 있다", "concept": "r5-color-approval", "stages": ["s5"]}, {"term": "라인 시험(line trial)", "def": "실제 도장 라인에서 새 도료로 한두 로트를 칠해 작업성·경화·불량률·도료 사용량을 보는 승인 단계", "concept": "r4-new-paint-approval", "stages": ["s4"]}, {"term": "리프팅(lifting)", "def": "상도의 용제가 하도를 녹여 하도가 주름지며 들뜨는 현상", "concept": "r2-paint-system", "stages": ["s2"]}, {"term": "마스터 샘플(master standard)", "def": "색 승인 때 정한 원본 기준판. 작업용 견본 점검과 분쟁 판정에만 쓴다", "concept": "r5-color-master", "stages": ["s5"]}, {"term": "물량 배분", "def": "이원화한 도료사들에 연간 물량을 나눠 주는 비율. 두 도료 모두 승인 상태를 유지하는 장치다", "concept": "r4-dual-source", "stages": ["s4"]}, {"term": "물량 약정", "def": "연간 계약에서 예상 물량과 허용 범위를 정해 단가의 근거로 삼는 조항. 미달 때 재고 부담도 함께 정한다", "concept": "r9-supplier-review", "stages": ["s9"]}, {"term": "배치 일관성", "def": "같은 품번 도료가 배치마다 점도·불휘발분·색이 얼마나 일정하게 나오는지. 배치별 출하 시험 기록으로 본다", "concept": "r4-maker-eval", "stages": ["s4"]}, {"term": "배치(batch)", "def": "도료사가 한 번에 섞어 만드는 생산 단위. 배치마다 로트 번호가 붙는다", "concept": "r1-supply-chain", "stages": ["s1"]}, {"term": "변경 등급", "def": "도료 변경이 품질에 줄 영향의 크기로 매긴 등급. 서류 검토·시편 시험·라인 시험과 재승인 중 시험 범위를 정한다", "concept": "r9-change-control", "stages": ["s9"]}, {"term": "보관 시료(retain sample)", "def": "도료사가 배치마다 일정량을 남겨 두는 시료. 클레임 때 재현 시험에 쓴다", "concept": "r6-paint-claim", "stages": ["s6"]}, {"term": "보충(top-up)", "def": "순환 탱크 도료가 줄면 새 도료를 더 붓는 일. 두 로트가 섞이기 시작하는 지점이다", "concept": "r6-lot-trace", "stages": ["s6"]}, {"term": "분산(밀링)", "def": "안료 덩어리를 수지·용제 속에서 잘게 풀어 고르게 퍼뜨리는 도료 제조 공정", "concept": "r1-supply-chain", "stages": ["s1"]}, {"term": "분산도 게이지(grind gauge)", "def": "깊이가 눈금으로 새겨진 홈에 도료를 긁어 큰 입자가 드러나는 깊이(μm)를 읽는 기구(ISO 1524)", "concept": "r6-coa", "stages": ["s6"]}, {"term": "블로킹(분체 뭉침)", "def": "분체 도료가 고온·습기에서 알갱이끼리 엉겨 덩어리가 되는 현상", "concept": "r7-storage", "stages": ["s7"]}, {"term": "비중(SG)", "def": "도료 1L의 무게(kg/L). kg 단가를 L 단가로 바꿀 때 쓴다", "concept": "r1-tds-msds", "stages": ["s1"]}, {"term": "비중컵(피크노미터)", "def": "부피를 아는 금속 컵에 도료를 채워 무게로 비중을 재는 기구(ISO 2811-1)", "concept": "r6-incoming", "stages": ["s6"]}, {"term": "사용 가능량(Q_use)", "def": "월 사용량 × (입고 시 잔여 유효기간 − 안전 여유). 유효기간 안에 쓸 수 있는 최대량", "concept": "r7-inventory", "stages": ["s7"]}, {"term": "사전 통보(변경)", "def": "도료사·도장 업체가 변경을 적용하기 전에 발주사에 알리는 의무. 품질 협정서에 시점과 대상을 적는다", "concept": "r9-change-control", "stages": ["s9"]}, {"term": "색 통합", "def": "비슷한 색의 여러 품번을 하나로 줄여 물량을 모으고 재고·폐기·색 교체 손실을 줄이는 일", "concept": "r9-cost-down", "stages": ["s9"]}, {"term": "선입선출(FIFO)", "def": "먼저 입고된 로트를 먼저 쓰는 원칙. 랙 구조와 라벨로 순서를 강제한다", "concept": "r7-shelf-life", "stages": ["s7"]}, {"term": "성능 사양", "def": "정한 시험을 통과하면 어떤 도료든 쓸 수 있게 한 사양 방식. 경쟁은 열리지만 처방 변경을 막기 어렵다", "concept": "r2-spec-sheet", "stages": ["s2"]}, {"term": "소량 할증", "def": "배치당 고정비(조색·시험·세척)를 적은 생산량에 나눠 kg당 단가에 붙이는 금액", "concept": "r3-cost-structure", "stages": ["s3"]}, {"term": "소량위험물", "def": "시·도 조례가 따로 관리하는 지정수량 미만 위험물. 서울특별시는 지정수량의 5분의 1 이상으로 정한다", "concept": "r7-hazmat-storage", "stages": ["s7"]}, {"term": "소요량 BOM", "def": "부품 BOM에 도료 품번과 개당 도료량(kg)을 넣어 소요 계획·발주에 쓰는 자재 명세", "concept": "r9-consumption", "stages": ["s9"]}, {"term": "소요량 정산", "def": "사급 도료의 인정량(이론 사용량 + 인정 손실)과 실사용량을 대조해 초과분 부담을 정하는 일", "concept": "r1-supply-mode", "stages": ["s1"]}, {"term": "습윤 기준 함량", "def": "액체 도료 전체 무게에 대한 성분 비율. 건조 도막 기준으로 바꾸려면 불휘발분(질량%)으로 나눈다", "concept": "r8-svhc", "stages": ["s8"]}, {"term": "승인 시편", "def": "도료 승인 때 칠해 보관하는 시험판. 이후 로트 판정과 처방 변경 비교의 기준이 된다", "concept": "r4-new-paint-approval", "stages": ["s4"]}, {"term": "시편 시험", "def": "표준 시험판이나 소재 판에 도료를 칠해 색·도막 물성·내식을 보는 승인 단계", "concept": "r4-new-paint-approval", "stages": ["s4"]}, {"term": "신규화학물질", "def": "화평법상 기존화학물질 목록에 없는 물질. 연간 1톤 이상이면 등록, 미만이면 신고한다", "concept": "r8-k-reach", "stages": ["s8"]}, {"term": "신호어", "def": "경고표지에서 유해·위험의 심각성을 알리는 말. '위험' 또는 '경고' 중 하나를 쓴다", "concept": "r8-msds-ghs", "stages": ["s8"]}, {"term": "실질 단가", "def": "폐기 예상량의 도료값과 폐기 처리비까지 실제로 쓴 양에 나눠 얹은 단가", "concept": "r7-inventory", "stages": ["s7"]}, {"term": "액상 시험", "def": "통 안의 도료로 밀도·불휘발분·점도·분산도를 재 같은 도료가 왔는지 확인하는 시험", "concept": "r2-standards", "stages": ["s2"]}, {"term": "연동 단가", "def": "원료 지수 변화에 비중을 곱해 정한 식으로 자동 조정하는 단가", "concept": "r3-index-linkage", "stages": ["s3"]}, {"term": "연화도(분산도)", "def": "도료 속 안료 입자가 얼마나 잘게 풀렸는지 나타내는 값(μm). KS M ISO 1524로 잰다", "concept": "r2-standards", "stages": ["s2"]}, {"term": "원료비", "def": "도료 원가 가운데 수지·안료·용제·첨가제 값을 더한 몫. 도료 원가의 가장 큰 항목이다", "concept": "r3-cost-structure", "stages": ["s3"]}, {"term": "유출컵(flow cup)", "def": "바닥 구멍으로 도료가 다 흘러나오는 시간(초)으로 점도를 대신 재는 컵. 컵 종류·구경·온도를 함께 적는다(ISO 2431)", "concept": "r6-coa", "stages": ["s6"]}, {"term": "유해화학물질 사용업", "def": "유해화학물질을 써서 제품을 만들거나 세척·도장 작업에 쓰는 영업. 기준에 해당하면 영업허가 대상이다", "concept": "r8-k-reach", "stages": ["s8"]}, {"term": "유효기간(shelf life)", "def": "미개봉·권장 보관 조건에서 도료사가 성능을 보증하는 기간. 제조일부터 센다", "concept": "r7-shelf-life", "stages": ["s7"]}, {"term": "이론 도료량", "def": "도장 면적·막두께·부피 고형분·도착 효율로 계산한 개당 도료량", "concept": "r9-consumption", "stages": ["s9"]}, {"term": "이산화티타늄(TiO₂)", "def": "도료에 은폐력을 주는 대표 백색 안료. 백색·밝은 색 도료 원가를 크게 좌우한다", "concept": "r3-cost-structure", "stages": ["s3"]}, {"term": "이원화(dual sourcing)", "def": "같은 용도에 두 도료사의 도료를 함께 승인해 두는 것", "concept": "r4-dual-source", "stages": ["s4"]}, {"term": "인정 손실률", "def": "사급 도료 정산에서 이론 사용량 외에 손실로 인정해 주는 비율", "concept": "r1-supply-mode", "stages": ["s1"]}, {"term": "인하 조항", "def": "인상 근거가 된 지수가 내려가면 같은     const outs = [
      {l:"사용 가능량", v:F(Qu, 0), u:"kg", s:`${F(U, 0)} × (${F(L, 1)} − ${F(m, 1)})`},
      {l:"발주량", v:F(Q, 0), u:"kg", s:`max(MOQ ${F(moq, 0)}, ${F(U * cyc, 0)}) → 포장 ${F(pack, 0)}kg 올림${pack ? ` · ${F(Q / pack, 0)}개` : ""}`},
      {l:"소진 기간", v:F(Q / U, 1), u:"개월"},
      {l:"폐기 예상량", v:F(W_, 0), u:"kg", em:W_ > 0, s:W_ > 0 ? `손실 약 ${F(loss, 0)}원` : "없음"},
      {l:"실질 단가", v:F(eff, 0), u:"원/kg", em:true, s:`표시 단가 대비 ${eff / p - 1 >= 0 ? "+" : ""}${F((eff / p - 1) * 100, 1)}%`}];
    const verdict = W_ <= 0
      ? {cls:"ok", text:`발주량 ${F(Q, 0)}kg을 ${F(Q / U, 1)}개월에 다 써서 사용 한계(${F(L - m, 1)}개월) 안에 끝납니다. 폐기가 없으니 실질 단가는 표시 단가와 같습니다. 입고 때 제조일을 확인해 잔여 기간이 가정보다 짧지 않은지 봅니다.`}
      : {cls:W_ / Q > .2 ? "no" : "mid", text:`발주량 ${F(Q, 0)}kg 중 **${F(W_, 0)}kg(${F(W_ / Q * 100, 0)}%)이 기한을 넘겨** 버려질 것으로 보입니다. 실질 단가는 ${F(eff, 0)}원/kg으로 표시 단가보다 ${F((eff / p - 1) * 100, 0)}% 비쌉니다. 최소 생산량 협상, 같은 색을 쓰는 품목 묶기, 표준색 전환, 분할 납품(한 번 생산 후 나눠 출하)을 검토합니다.`};

<script>

(function(){

/* ---------- indexes ---------- */

/* ---------- text rendering ---------- */
// 원본의 M_B·c_g,강 표기를 아래 첨자로 — 앞이 / . : - _ 이거나 첨자가 5자 이상이면(URL·파일명) 그대로 둔다
const SUB_RE = /(^|[^A-Za-zΑ-Ωα-ω0-9_/.:\-])([A-Za-zΑ-Ωα-ω]{1,2})_([A-Za-z0-9α-ω]{1,4}(?:,[가-힣]+)?)(?![A-Za-z0-9α-ω_])/g;   // 재료편부터: σ_T·ε_e·W_α처럼 그리스 문자 첨자도
const sub = s => s.replace(SUB_RE, "$1$2<sub>$3</sub>").replace(/([A-Za-z])₀,([가-힣]+)/g, "$1<sub>0,$2</sub>");
const escs = s => sub(esc(s));
function inline(s){
  return escs(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}
function md(src){
  if(!src) return "";
  const lines = String(src).replace(/\r/g,"").split("\n");
  let out = "", para = [], list = null, ltype = "";
  const flushP = () => { if(para.length){ out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushL = () => { if(list){ out += `<${ltype}>` + list.map(x => "<li>"+inline(x)+"</li>").join("") + `</${ltype}>`; list = null; } };
  for(const raw of lines){
    const l = raw.trimEnd();
    if(!l.trim()){ flushP(); flushL(); continue; }
    let m;
    if((m = l.match(/^\s*(?:[-•·▪]|\*(?!\*))\s+(.*)$/))){ flushP(); if(ltype!=="ul") flushL(); ltype="ul"; (list ||= []).push(m[1]); continue; }
    if((m = l.match(/^\s*(?:\d{1,2}[.)]|[①②③④⑤⑥⑦⑧⑨⑩])\s*(.*)$/))){ flushP(); if(ltype!=="ol") flushL(); ltype="ol"; (list ||= []).push(m[1]); continue; }
    flushL(); para.push(l.trim());
  }
  flushP(); flushL();
  return out;
}
/* auto-link concept names inside rendered prose (first occurrence only) */
const LINK_TERMS = (() => {
  const arr = [];
  D.concepts.forEach(c => {
    const set = new Set();
    const base = c.title.replace(/\s*\(.*?\)\s*/g, " ").trim();
    set.add(base);
    if(base.includes(":")) set.add(base.split(":")[0].trim());
    (c.title.match(/\(([^)]+)\)/g) || []).forEach(p => set.add(p.slice(1,-1).trim()));
    (c.aliases || []).forEach(a => set.add(a.trim()));
    set.forEach(t => {
      if(!t) return;
      const ascii = /^[A-Za-z0-9\-\/ ]+$/.test(t);
      const len = t.replace(/\s/g,"").length;
      if(ascii ? (len >= 2 && /[A-Z]{2}/.test(t)) : len >= 3) arr.push({t, id:c.id, len, ascii});

})();
function autolink(root, selfId){
  const nbs = new Set((ADJ[selfId]||[]).map(n => n.id));
  const terms = LINK_TERMS.filter(x => x.id !== selfId && (nbs.has(x.id) || (x.ascii ? x.len >= 3 : x.len >= 5)));
  const used = new Set(); let count = 0;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest("a,strong,th,.formula") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  for(const node of nodes){
    if(count >= 14) break;
    let text = node.nodeValue;
    for(const term of terms){
      if(used.has(term.id)) continue;
      const i = text.indexOf(term.t);
      if(i < 0) continue;
      if(term.ascii){ const b = text[i-1], a = text[i+term.t.length]; if((b && /[A-Za-z]/.test(b)) || (a && /[A-Za-z]/.test(a))) continue; }

      const after = node.splitText(i); after.nodeValue = after.nodeValue.slice(term.t.length);
      node.parentNode.insertBefore(a, after);
      used.add(term.id); count++;
      break;
    }
  }
}

function stageCol(s){

function mountAnims(root){

/* small SVG charts for widgets; colors come from theme tokens */
function lineChart(o){
  const w = o.w || 560, hh = o.h || 240, m = {l:52, r:16, t:14, b:34};
  const [x0, x1] = o.x, [y0, y1] = o.y;

  const ticks = (a, b, n=5) => { const out = []; for(let i=0;i<=n;i++) out.push(a + (b-a)*i/n); return out; };
  let g = "";
  ticks(y0, y1).forEach(v => g += `<line class="gr" x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+3.5}" text-anchor="end">${o.yf ? o.yf(v) : fmt(v)}</text>`);
  ticks(x0, x1).forEach(v => g += `<text x="${X(v)}" y="${hh-m.b+15}" text-anchor="middle">${o.xf ? o.xf(v) : fmt(v)}</text>`);
  g += `<line class="ax" x1="${m.l}" x2="${w-m.r}" y1="${hh-m.b}" y2="${hh-m.b}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${hh-m.b}"/>`;
  (o.series||[]).forEach(s => { const d = s.pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + "," + Y(p[1]).toFixed(1)).join(""); g += `<path d="${d}" fill="none" stroke="${s.color||"var(--accent)"}" stroke-width="${s.wd||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/>`; });
  (o.marks||[]).forEach(p => { g += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${p.color||"var(--seal)"}"/>${p.label ? `<text x="${X(p.x)+7}" y="${Y(p.y)-7}" style="fill:var(--ink);font-weight:600">${esc(p.label)}</text>` : ""}`; if(p.vline) g += `<line x1="${X(p.x)}" x2="${X(p.x)}" y1="${Y(p.y)}" y2="${hh-m.b}" stroke="${p.color||"var(--seal)"}" stroke-dasharray="3 3"/>`; });
  const leg = (o.series||[]).filter(s => s.label).map((s, i) => `<g transform="translate(${m.l + 8 + i*130},${m.t + 4})"><line x1="0" x2="16" y1="0" y2="0" stroke="${s.color||"var(--accent)"}" stroke-width="2" ${s.dash?`stroke-dasharray="${s.dash}"`:""}/><text x="21" y="3.5" style="fill:var(--ink)">${esc(s.label)}</text></g>`).join("");
  const xl = o.xl ? `<text x="${(m.l + w - m.r)/2}" y="${hh-4}" text-anchor="middle">${esc(o.xl)}</text>` : "";
  return `<svg viewBox="0 0 ${w} ${hh}" width="${w}" role="img" aria-label="${esc(o.label||"차트")}">${g}${leg}${xl}</svg>`;
}
function barChart(o){

  const ymax = o.ymax || Math.max(...o.bars.map(b => b.v)) * 1.1 || 1;

  for(let i=0;i<=4;i++){ const v = ymax*i/4; g += `<line class="gr" x1="${m.l}" x2="${w-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+3.5}" text-anchor="end">${o.yf ? o.yf(v) : fmt(v)}</text>`; }
  o.bars.forEach((b, i) => { const x = m.l + i*bw + bw*.15; g += `<rect x="${x}" y="${Y(b.v)}" width="${bw*.7}" height="${Math.max(0, hh-m.b-Y(b.v))}" fill="${b.color||"var(--accent)"}" rx="2"/><text x="${x + bw*.35}" y="${hh-m.b+14}" text-anchor="middle">${esc(b.l)}</text>`; });
  if(o.line){ const R = v => hh - m.b - v / 100 * (hh - m.t - m.b); const d = o.line.map((v, i) => (i?"L":"M") + (m.l + i*bw + bw/2).toFixed(1) + "," + R(v).toFixed(1)).join(""); g += `<path d="${d}" fill="none" stroke="var(--seal)" stroke-width="2"/>` + o.line.map((v, i) => `<circle cx="${m.l + i*bw + bw/2}" cy="${R(v)}" r="3" fill="var(--seal)"/>`).join(""); for(let i=0;i<=4;i++){ g += `<text x="${w-m.r+6}" y="${R(25*i)+3.5}">${25*i}%</text>`; } (o.cuts||[]).forEach(c => g += `<line x1="${m.l}" x2="${w-m.r}" y1="${R(c)}" y2="${R(c)}" stroke="var(--seal)" stroke-dasharray="3 3" opacity=".6"/>`); }
  g += `<line class="ax" x1="${m.l}" x2="${w-m.r}" y1="${hh-m.b}" y2="${hh-m.b}"/>`;
  return `<svg viewBox="0 0 ${w} ${hh}" width="${w}" role="img" aria-label="${esc(o.label||"막대 차트")}">${g}</svg>`;
}

/* ---------- glossary ---------- */
function renderGlossary(){
  const main = $("#main");
  main.innerHTML = `<div class="page-h"><h1>용어집</h1><p>현장 용어 ${D.glossary.length}개를 가나다순으로 모았습니다. 개념 카드가 있는 용어는 바로 이동할 수 있습니다.</p></div>
  <div class="gl-tools"><input id="glq" type="search" placeholder="용어나 설명으로 찾기" aria-label="용어 검색"></div><div class="gl" id="gl"></div>`;
  const draw = q => {
    q = (q||"").trim().toLowerCase();
    const list = D.glossary.filter(g => !q || g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q));
    $("#gl").innerHTML = list.length ? list.map(g => `<dl><dt>${esc(g.term)}${(g.stages||[]).map(k => S[k] ? `<span class="tag">STAGE ${sNo(S[k])}</span>` : "").join("")}</dt><dd>${esc(g.def)}${g.concept && C[g.concept] ? ` <a href="#${g.concept}">개념 카드 →</a>` : ""}</dd></dl>`).join("") : `<div class="empty">찾는 용어가 없습니다.</div>`;
  };
  $("#glq").addEventListener("input", e => draw(e.target.value));
  draw("");
}

/* ---------- checklist view ---------- */
const CAN_PRINT = (() => { try { return window.self === window.top; } catch(e) { return false; } })();
let chkSel = "spec";
try { chkSel = localStorage.getItem(KEY+":chk") || "spec"; } catch(e) {}
const chkOk = k => !!(S[k] || LN[k] || SC[k] || k === "all");
function renderChecks(arg){
  const main = $("#main");
  if(arg && chkOk(arg)) chkSel = arg;
  if(!chkOk(chkSel)) chkSel = "all";
  const presets = (D.checkPresets||[]);
  main.innerHTML = `<div class="page-h"><h1>체크리스트</h1><p>개념 카드마다 붙은 ‘구매 담당자 체크포인트’를 모았습니다. 도료 사양과 지정 도료를 정할 때, 도료사를 고르고 새 도료를 승인할 때, 성적서·입고 도료·보관 상태를 확인할 때, 불량·클레임을 조사할 때, 도료 단가를 검토할 때 해당 업무를 골라 체크하며 쓰고${CAN_PRINT ? ", 인쇄해 들고 갈 수 있습니다" : ""}. 체크 상태는 이 브라우저에만 저장됩니다.${CAN_PRINT ? "" : " 인쇄용 양식이 필요하면 HTML 파일을 브라우저에서 직접 열어 인쇄하세요."}</p></div>
  <div class="ck-tools">${presets.map(p => `<button class="chip ${chkSel===p.key?"on":""}" data-ps="${p.key}">${esc(p.label)}</button>`).join("")}
    <select id="cksel" aria-label="범위 선택"><option value="all">전체 단계</option><optgroup label="업무별">${presets.map(p => `<option value="${p.key}">업무: ${esc(p.label)}</option>`).join("")}</optgroup><optgroup label="단계별">${D.stages.map(s => `<option value="${s.id}">STAGE ${sNo(s)} ${esc(s.title)}</option>`).join("")}</optgroup><optgroup label="관점별">${D.lenses.map(l => `<option value="${l.code}">관점: ${esc(l.title)}</option>`).join("")}</optgroup></select>
    <span class="sp"></span><span class="mono ck-n" id="ckn"></span><button class="btn ghost sm" id="ckreset">이 범위 체크 지우기</button>${CAN_PRINT ? `<button class="btn sm" id="ckprint">인쇄</button>` : ""}</div>
  <div id="cklist"></div>`;
  $("#cksel").value = chkSel;
  const pick = () => ORDER.filter(c => (c.checks||[]).length && (chkSel === "all" || c.stage === chkSel || c.lens === chkSel || (c.scopes||[]).includes(chkSel)));
  const count = () => { const its = pick().flatMap(chkItems); $("#ckn").textContent = `${its.filter(x => P.c[x.k]).length} / ${its.length} 확인`; };
  const draw = () => {
    try { localStorage.setItem(KEY+":chk", chkSel); } catch(e) {}
    $$("[data-ps]").forEach(b => b.classList.toggle("on", b.dataset.ps === chkSel));
    const cs = pick();
    const byStage = D.stages.map(s => ({s, cs: cs.filter(c => c.stage === s.id)})).filter(g => g.cs.length);
    const scope = SC[chkSel] ? `업무: ${SC[chkSel].label}` : S[chkSel] ? `STAGE ${sNo(S[chkSel])} ${S[chkSel].title}` : LN[chkSel] ? `관점: ${LN[chkSel].title}` : "전체 단계";
    $("#cklist").innerHTML = `<div class="ck-print-h">개발구매 도료편 체크리스트 — ${esc(scope)}<span>도료사 ____________ 도료 품번 ____________ 일자 ________ 확인자 ________</span></div>` + (byStage.length ? byStage.map(g => `<section class="ck-sec"><h2><span class="mono">STAGE ${sNo(g.s)}</span>${esc(g.s.title)}</h2>${g.cs.map(c => `<div class="ck-c"><h3><a href="#${c.id}">${esc(c.title)}</a>${lensTag(c.lens)}</h3><ul class="chk-list">${chkItems(c).map(chkLi).join("")}</ul></div>`).join("")}</section>`).join("") : `<div class="empty">체크포인트가 없습니다.</div>`);
    wireChk($("#cklist"), count); count();
  };
  $("#cksel").addEventListener("change", e => { chkSel = e.target.value; history.replaceState(null, "", "#check." + chkSel); draw(); });
  $$("[data-ps]").forEach(b => b.onclick = () => { chkSel = b.dataset.ps; $("#cksel").value = chkSel; history.replaceState(null, "", "#check." + chkSel); draw(); });
  $("#ckreset").onclick = () => { pick().flatMap(chkItems).forEach(x => delete P.c[x.k]); save(); draw(); toast("체크를 지웠습니다"); };
  if($("#ckprint")) $("#ckprint").onclick = () => window.print();
  draw();
}

/* ---------- search ---------- */
function setupSearch(){
  const inp = $("#q"), box = $("#sres");
  const idx = D.concepts.map(c => ({c, hay:(c.title + " " + (c.aliases||[]).join(" ") + " " + c.oneLiner).toLowerCase()}));
  let hits = [], cur = -1;
  const close = () => { box.hidden = true; cur = -1; };
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    if(!q){ close(); return; }
    hits = idx.filter(x => x.hay.includes(q)).sort((a,b) => (b.c.title.toLowerCase().includes(q)) - (a.c.title.toLowerCase().includes(q))).slice(0, 12).map(x => x.c);
    const gl = D.glossary.filter(g => g.term.toLowerCase().includes(q)).slice(0, 5);
    box.innerHTML = (hits.length ? hits.map((c, i) => `<a href="#${c.id}" class="${i===cur?"on":""}">${esc(c.title)}<small>STAGE ${sNo(stageOf(c))} · ${esc(LN[c.lens].title)} · ${esc(c.oneLiner)}</small></a>`).join("") : "") + (gl.length ? `<div style="font-size:11px;color:var(--ink-3);padding:6px 10px 2px">용어집</div>` + gl.map(g => `<a href="${g.concept ? "#"+g.concept : "#glossary"}">${esc(g.term)}<small>${esc(g.def)}</small></a>`).join("") : "") || `<div style="padding:10px;color:var(--ink-3);font-size:13px">결과 없음</div>`;
    box.hidden = false;
  };
  inp.addEventListener("input", () => { cur = -1; draw(); });
  inp.addEventListener("keydown", e => {
    if(e.key === "ArrowDown"){ cur = Math.min(hits.length-1, cur+1); draw(); e.preventDefault(); }
    else if(e.key === "ArrowUp"){ cur = Math.max(0, cur-1); draw(); e.preventDefault(); }
    else if(e.key === "Enter"){ const c = hits[Math.max(0, cur)]; if(c){ location.hash = c.id; inp.value = ""; close(); inp.blur(); } }
    else if(e.key === "Escape"){ close(); }
  });
  box.addEventListener("click", () => { inp.value = ""; close(); });
  document.addEventListener("click", e => { if(!e.target.closest(".search")) close(); });
}

/* ---------- theme toggle ---------- */
function setupTheme(){
  const b = $("#theme"); let t = null;
  try { t = localStorage.getItem(KEY+":theme"); } catch(e) {}
  if(t) document.documentElement.setAttribute("data-theme", t);
  b.onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const nx = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", nx);
    try { localStorage.setItem(KEY+":theme", nx); } catch(e) {}
    if($("#map")) requestAnimationFrame(drawEdges);
  };
}

setupSearch(); setupTheme(); updateMeter(); route();
})();
