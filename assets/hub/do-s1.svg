<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#18202A">
  <title>도료 공급망 네 단계(원료사·도료사·도장 업체·완성 부품)와 도료 구매 방식 두 가지(사급, 지정 도료 업체 구매) 비교</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#465260"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C4382C"/></marker></defs>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="30" y="34" font-size="17" fill="#18202A" text-anchor="start" font-weight="700">도료는 네 손을 거쳐 부품에 붙는다 — 구매는 누가 살지부터 정한다</text>
  <rect x="30" y="70" width="135" height="78" rx="6" fill="#E4EAE8" stroke="#465260" stroke-width="1.2"/>
  <text x="97" y="103" font-size="17" fill="#18202A" text-anchor="middle" font-weight="700">원료사</text>
  <text x="97" y="128" font-size="15" fill="#465260" text-anchor="middle">수지·안료·용제</text>
  <line x1="167" y1="109" x2="203" y2="109" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="205" y="70" width="135" height="78" rx="6" fill="#5E8FC9" stroke="#465260" stroke-width="1.2"/>
  <text x="272" y="103" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700">도료사</text>
  <text x="272" y="128" font-size="15" fill="#FFFFFF" text-anchor="middle">배치 생산·조색</text>
  <line x1="342" y1="109" x2="378" y2="109" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="380" y="70" width="135" height="78" rx="6" fill="#E4EAE8" stroke="#465260" stroke-width="1.2"/>
  <text x="447" y="103" font-size="17" fill="#18202A" text-anchor="middle" font-weight="700">도장 업체</text>
  <text x="447" y="128" font-size="15" fill="#465260" text-anchor="middle">도장·경화</text>
  <line x1="517" y1="109" x2="553" y2="109" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="555" y="70" width="135" height="78" rx="6" fill="#E4EAE8" stroke="#465260" stroke-width="1.2"/>
  <text x="622" y="103" font-size="17" fill="#18202A" text-anchor="middle" font-weight="700">완성 부품</text>
  <text x="622" y="128" font-size="15" fill="#465260" text-anchor="middle">발주사 입고</text>
  <text x="30" y="196" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">도료를 누가 사나</text>
  <rect x="30" y="210" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#1D5BB8" stroke-width="1.6"/>
  <text x="46" y="238" font-size="16" fill="#1D5BB8" text-anchor="start" font-weight="700">사급(지급)</text>
  <text x="46" y="264" font-size="15" fill="#465260" text-anchor="start">발주사가 도료사에서 사서</text>
  <text x="46" y="286" font-size="15" fill="#465260" text-anchor="start">도장 업체에 내준다</text>
  <text x="46" y="312" font-size="15" fill="#18202A" text-anchor="start">물량 통합·품질 통제 ↑ · 재고·정산 부담 ↑</text>
  <rect x="370" y="210" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#E8A23A" stroke-width="1.6"/>
  <text x="386" y="238" font-size="16" fill="#9A6512" text-anchor="start" font-weight="700">업체 구매(지정 도료)</text>
  <text x="386" y="264" font-size="15" fill="#465260" text-anchor="start">도장 업체가 사되, 도료사·품번은</text>
  <text x="386" y="286" font-size="15" fill="#465260" text-anchor="start">발주사가 지정한다</text>
  <text x="386" y="312" font-size="15" fill="#18202A" text-anchor="start">관리 부담 ↓ · 단가·변경이 덜 보인다</text>

</svg>
