<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16">
  <title>평균은 넉넉해도 최소 국부 두께는 오목부가 정한다 — U자 브래킷 아연 두께 분포와 ISO 2064 국부 두께 개념(두께 과장)</title>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="16" y="32" font-size="17" font-weight="700" fill="#18202A">평균은 넉넉해도 최소 국부 두께는 오목부가 정한다</text>
  <!-- U자 브래킷: 아연(바깥면) -->
  <polygon points="80,120 80,300 330,300 330,120 338,120 336,200 340,310 260,306 150,306 70,310 74,200 72,120" fill="#9DB7C8"/>
  <!-- 아연(안쪽면) -->
  <polygon points="110,120 110,270 300,270 300,120 293,120 295,200 297.5,262 297.5,267.5 282,267 205,265 118,267 112.5,267.5 112.5,262 115,200 117,120" fill="#9DB7C8"/>
  <!-- 벽 끝단 -->
  <polygon points="72,120 74,111 115,111 117,120" fill="#9DB7C8"/>
  <polygon points="293,120 295,111 336,111 338,120" fill="#9DB7C8"/>
  <!-- 강판 -->
  <polygon points="80,120 80,300 330,300 330,120 300,120 300,270 110,270 110,120" fill="#C9D2DB" stroke="#8D9AA8"/>
  <text x="205" y="292" text-anchor="middle" font-size="14" fill="#465260">강판</text>
  <!-- 측정점 -->
  <g fill="#18202A" stroke="#FAFCFB" stroke-width="1.5">
    <circle cx="71" cy="309" r="5"/><circle cx="205" cy="305" r="5"/><circle cx="115" cy="199" r="5"/><circle cx="95" cy="112" r="5"/><circle cx="232" cy="266" r="5"/>
  </g>
  <circle cx="113" cy="266" r="6" fill="#C4382C" stroke="#FAFCFB" stroke-width="1.5"/>
  <g font-size="15" fill="#18202A">
    <text x="40" y="338">① 모서리 14.7</text>
    <text x="205" y="334" text-anchor="middle">② 바깥 바닥 11.8</text>
    <text x="126" y="195">④ 9.6</text>
    <text x="60" y="100">⑤ 끝단 13.9</text>
    <text x="232" y="252" text-anchor="middle">⑥ 10.4</text>
  </g>
  <line x1="116" y1="262" x2="146" y2="228" stroke="#C4382C" stroke-width="1.5"/>
  <text x="148" y="224" font-size="15" font-weight="700" fill="#C4382C">③ 7.4 오목 구석</text>
  <text x="346" y="140" font-size="14" fill="#465260">아연 층</text>
  <text x="346" y="158" font-size="14" fill="#465260">(두께 과장)</text>
  <line x1="344" y1="146" x2="337" y2="160" stroke="#77838F"/>
  <text x="205" y="360" text-anchor="middle" font-size="14" fill="#465260">단위 μm · 10곳 중 6곳 표시</text>
  <!-- 오른쪽: ISO 2064 약속 -->
  <rect x="418" y="56" width="288" height="296" rx="8" fill="#E4EAE8"/>
  <text x="432" y="82" font-weight="700" fill="#18202A">ISO 2064의 두께 약속</text>
  <text x="432" y="106" font-size="15" fill="#465260">유효면(도면 표시) 안에서</text>
  <rect x="436" y="120" width="80" height="80" fill="#FAFCFB" stroke="#1D5BB8" stroke-width="2"/>
  <g fill="#1D5BB8"><circle cx="452" cy="136" r="4"/><circle cx="500" cy="136" r="4"/><circle cx="476" cy="160" r="4"/><circle cx="452" cy="184" r="4"/><circle cx="500" cy="184" r="4"/></g>
  <text x="476" y="218" text-anchor="middle" font-size="14" fill="#465260">기준 면적 약 1cm²</text>
  <line x1="524" y1="160" x2="548" y2="160" stroke="#465260" stroke-width="1.5"/>
  <polygon points="548,155 556,160 548,165" fill="#465260"/>
  <text x="562" y="150" font-size="15" fill="#18202A">여러 번 잰</text>
  <text x="562" y="170" font-size="15" fill="#18202A">평균 =</text>
  <text x="562" y="190" font-size="15" font-weight="700" fill="#1D5BB8">국부 두께</text>
  <text x="432" y="252" font-size="15" fill="#18202A">기준 면적마다 국부 두께 하나</text>
  <text x="432" y="278" font-size="15" fill="#18202A">그중 가장 낮은 값 =</text>
  <text x="432" y="300" font-size="15" font-weight="700" fill="#C4382C">최소 국부 두께</text>
  <text x="432" y="330" font-size="15" fill="#18202A">도면 Fe//Zn8의 8μm가 이 값</text>
  <!-- 아래: 수직선 -->
  <line x1="60" y1="432" x2="680" y2="432" stroke="#465260" stroke-width="1.5"/>
  <g font-size="14" fill="#465260" text-anchor="middle">
    <line x1="60" y1="428" x2="60" y2="436" stroke="#465260"/><text x="60" y="454">6</text>
    <line x1="184" y1="428" x2="184" y2="436" stroke="#465260"/><text x="184" y="454">8</text>
    <line x1="308" y1="428" x2="308" y2="436" stroke="#465260"/><text x="308" y="454">10</text>
    <line x1="432" y1="428" x2="432" y2="436" stroke="#465260"/><text x="432" y="454">12</text>
    <line x1="556" y1="428" x2="556" y2="436" stroke="#465260"/><text x="556" y="454">14</text>
    <line x1="680" y1="428" x2="680" y2="436" stroke="#465260"/><text x="680" y="454">16</text>
  </g>
  <text x="680" y="472" text-anchor="end" font-size="14" fill="#465260">국부 두께(μm)</text>
  <line x1="184" y1="386" x2="184" y2="440" stroke="#C4382C" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="184" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#C4382C">기준 8</text>
  <line x1="378.7" y1="396" x2="378.7" y2="440" stroke="#18202A" stroke-width="2"/>
  <text x="378.7" y="390" text-anchor="middle" font-size="14" font-weight="700" fill="#18202A">평균 11.1</text>
  <g fill="#465260" opacity=".8">
    <circle cx="419.6" cy="416" r="5"/><circle cx="469.2" cy="416" r="5"/><circle cx="363.8" cy="416" r="5"/><circle cx="599.4" cy="416" r="5"/><circle cx="283.2" cy="416" r="5"/>
    <circle cx="382.4" cy="416" r="5"/><circle cx="549.8" cy="416" r="5"/><circle cx="332.8" cy="416" r="5"/><circle cx="239.8" cy="416" r="5"/>
  </g>
  <circle cx="146.8" cy="416" r="6" fill="#C4382C"/>
  <text x="146.8" y="404" text-anchor="middle" font-size="14" fill="#C4382C">7.4</text>
  <text x="16" y="498" font-size="15" font-weight="700" fill="#C4382C">평균 11.1μm로 넉넉해도 최소 7.4μm &lt; 기준 8μm → 불합격</text>
</svg>
