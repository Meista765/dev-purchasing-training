<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="15">
  <title>전기아연도금의 층 구성(아연·3가 화성 피막·실러·탑코트)과 화성 피막의 세 종류(투명·두꺼운 무지개·흑색)</title>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <defs>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8D9AA8" stroke-width="1"/></pattern>
    <pattern id="ir" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#B9A6D6"/><rect width="8" height="12" fill="#E8A23A" opacity=".45"/><rect x="12" width="6" height="12" fill="#2F8F5B" opacity=".3"/></pattern>
  </defs>
  <text x="20" y="32" font-size="17" font-weight="700" fill="#18202A">아연 위에 화성 피막, 그 위에 실러 — 층마다 맡는 일이 다르다</text>
  <text x="20" y="54" font-size="13" fill="#77838F">단면 — 두께 과장(실제 아연 5~25μm, 화성 피막 1μm 미만)</text>
  <rect x="40" y="290" width="300" height="60" fill="url(#h)" stroke="#465260"/>
  <rect x="40" y="200" width="300" height="90" fill="#9DB7C8" stroke="#465260"/>
  <rect x="40" y="186" width="300" height="14" fill="url(#ir)" stroke="#465260" stroke-width=".8"/>
  <rect x="40" y="170" width="300" height="16" fill="#E4EAE8" stroke="#465260" stroke-width=".8"/>
  <rect x="40" y="146" width="300" height="24" fill="#5E8FC9" opacity=".55" stroke="#465260" stroke-width=".8"/>
  <g font-size="14" fill="#18202A">
    <line x1="340" y1="158" x2="360" y2="158" stroke="#77838F"/><text x="366" y="163">탑코트(선택) — 2μm 초과, 마찰·외관</text>
    <line x1="340" y1="178" x2="360" y2="178" stroke="#77838F"/><text x="366" y="183">실러 — 2μm 이하, 백청 지연</text>
    <line x1="340" y1="193" x2="360" y2="200" stroke="#77838F"/><text x="366" y="205">3가 화성 피막 — 아연의 녹(백청) 지연</text>
    <line x1="340" y1="245" x2="360" y2="245" stroke="#77838F"/><text x="366" y="250">아연 — 희생 방식으로 강을 지킴(적청 지연)</text>
    <line x1="340" y1="320" x2="360" y2="320" stroke="#77838F"/><text x="366" y="325">강 소지</text>
  </g>
  <text x="20" y="384" font-weight="700" fill="#18202A">화성 피막의 종류(ISO 19598 기호)</text>
  <rect x="40" y="398" width="34" height="24" fill="#D3E0EA" stroke="#465260"/><text x="82" y="415" font-size="14" fill="#18202A">An 투명(얇은 피막)</text>
  <rect x="250" y="398" width="34" height="24" fill="url(#ir)" stroke="#465260"/><text x="292" y="415" font-size="14" fill="#18202A">Cn 무지개(두꺼운 피막)</text>
  <rect x="490" y="398" width="34" height="24" fill="#2A323C" stroke="#465260"/><text x="532" y="415" font-size="14" fill="#18202A">Fn 흑색</text>
</svg>
