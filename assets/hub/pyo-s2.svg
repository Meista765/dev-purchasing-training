<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#18202A">
  <title>세정 4요소(시간·온도·농도·기계력) 원그래프 — 시간이 줄면 다른 요소로 보상하는 개념도</title>
  <defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8D9AA8" stroke-width="1"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#465260"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1D5BB8"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C4382C"/></marker></defs>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="30" y="34" font-size="17" fill="#18202A" font-weight="700">세정 4요소 — 하나가 줄면 나머지로 메운다</text>
  <text x="180" y="70" font-size="16" fill="#18202A" text-anchor="middle" font-weight="700">기준 상태</text>
  <path d="M180,190 L180.0,86.0 A104,104 0 0 1 284.0,190.0 Z" fill="#E8A23A" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="222.7" y="153.3" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">시간</text>
  <path d="M180,190 L284.0,190.0 A104,104 0 0 1 180.0,294.0 Z" fill="#C4382C" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="222.7" y="238.7" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">온도</text>
  <path d="M180,190 L180.0,294.0 A104,104 0 0 1 76.0,190.0 Z" fill="#1D5BB8" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="137.3" y="238.7" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">농도</text>
  <path d="M180,190 L76.0,190.0 A104,104 0 0 1 180.0,86.0 Z" fill="#2F8F5B" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="137.3" y="153.3" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">기계력</text>
  <text x="540" y="70" font-size="16" fill="#18202A" text-anchor="middle" font-weight="700">라인 속도 1.5배 — 시간이 2/3로</text>
  <path d="M540,190 L540.0,86.0 A104,104 0 0 1 630.1,138.0 Z" fill="#E8A23A" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="570.2" y="143.8" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">시간</text>
  <path d="M540,190 L630.1,138.0 A104,104 0 0 1 566.9,290.5 Z" fill="#C4382C" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="595.7" y="219.1" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">온도</text>
  <path d="M540,190 L566.9,290.5 A104,104 0 0 1 436.0,190.0 Z" fill="#1D5BB8" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="503.3" y="243.9" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">농도</text>
  <path d="M540,190 L436.0,190.0 A104,104 0 0 1 540.0,86.0 Z" fill="#2F8F5B" opacity="0.8" stroke="#FAFCFB" stroke-width="2"/>
  <text x="497.3" y="153.3" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">기계력</text>
  <line x1="300" y1="190" x2="420" y2="190" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="360" y="178" font-size="14" fill="#465260" text-anchor="middle">보상</text>
  <text x="360" y="330" font-size="15" fill="#18202A" text-anchor="middle">3.0 → 4.5m/분이면 모든 단의 접촉 시간이 2/3로 준다</text>
  <text x="360" y="354" font-size="14" fill="#465260" text-anchor="middle">온도·농도·분사 압력을 약품사와 다시 정하지 않으면 탈지가 모자란다</text>
</svg>
