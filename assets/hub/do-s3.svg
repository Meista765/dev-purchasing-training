<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#18202A">
  <title>예시값 비교: 도료 A 7,000원/kg, B 8,000원/kg이지만 30μm·도착 효율 60%로 칠한 m² 단가는 A 910원, B 806원으로 뒤집힌다</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#465260"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C4382C"/></marker></defs>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="30" y="34" font-size="17" fill="#18202A" text-anchor="start" font-weight="700">kg 단가가 싼 도료가 칠하면 비싸다 — 같은 도막 기준으로 바꿔 본다</text>
  <text x="30" y="82" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">kg 단가</text>
  <text x="30" y="122" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">A</text>
  <rect x="52" y="104" width="192.5" height="26" rx="2" fill="#77838F" stroke="#77838F" stroke-width="1"/>
  <text x="252.5" y="123" font-size="15" fill="#18202A" text-anchor="start">7,000원</text>
  <text x="30" y="168" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">B</text>
  <rect x="52" y="150" width="220.0" height="26" rx="2" fill="#1D5BB8" stroke="#1D5BB8" stroke-width="1"/>
  <text x="280.0" y="169" font-size="15" fill="#18202A" text-anchor="start">8,000원</text>
  <text x="380" y="82" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">m² 단가 (30μm · TE 60%)</text>
  <text x="380" y="122" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">A</text>
  <rect x="402" y="104" width="220.0" height="26" rx="2" fill="#77838F" stroke="#77838F" stroke-width="1"/>
  <text x="630.0" y="123" font-size="15" fill="#18202A" text-anchor="start">910원</text>
  <text x="380" y="168" font-size="16" fill="#18202A" text-anchor="start" font-weight="700">B</text>
  <rect x="402" y="150" width="194.9" height="26" rx="2" fill="#1D5BB8" stroke="#1D5BB8" stroke-width="1"/>
  <text x="604.9" y="169" font-size="15" fill="#18202A" text-anchor="start">806원</text>
  <text x="30" y="222" font-size="15" fill="#465260" text-anchor="start">A: 비중 1.30 · 고형분 부피비 50%</text>
  <text x="30" y="246" font-size="15" fill="#465260" text-anchor="start">B: 비중 1.25 · 고형분 부피비 62%</text>
  <rect x="380" y="206" width="310" height="112" rx="6" fill="#EAF1FB" stroke="#1D5BB8" stroke-width="1.4"/>
  <text x="396" y="236" font-size="16" fill="#18202A" text-anchor="start">B가 kg당 14% 비싸지만</text>
  <text x="396" y="262" font-size="17" fill="#1D5BB8" text-anchor="start" font-weight="700">m²당 11% 싸다</text>
  <text x="396" y="290" font-size="15" fill="#465260" text-anchor="start">고형분이 많아 1L로 더 넓게 칠한다</text>
  <text x="30" y="345" font-size="14" fill="#77838F" text-anchor="start">단가는 예시값 · 식은 표면처리편 도료 소요량 식과 같다</text>

</svg>
