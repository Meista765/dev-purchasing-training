<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#18202A">
  <title>화학물질 의무 주체 개념도: 도료 제조·수입자(등록·MSDS·VOC·표지), 사용 사업장(게시·저장·취급·폐기), 구매 담당(최신 MSDS·확인서·SVHC 정보·변경 재확인)</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#465260"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C4382C"/></marker></defs>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="30" y="34" font-size="17" fill="#18202A" text-anchor="start" font-weight="700">화학물질 의무는 주체가 다르다 — 구매는 받아야 할 서류를 챙긴다</text>
  <rect x="30" y="60" width="206" height="46" rx="6" fill="#5E8FC9" stroke="#5E8FC9" stroke-width="1.2"/>
  <text x="133" y="90" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">도료 제조·수입자</text>
  <rect x="30" y="114" width="206" height="196" rx="6" fill="#FFFFFF" stroke="#465260" stroke-width="1.2"/>
  <text x="48" y="148" font-size="15" fill="#18202A" text-anchor="start">· 물질 등록·신고</text>
  <text x="48" y="190" font-size="15" fill="#18202A" text-anchor="start">· MSDS 작성·제공</text>
  <text x="48" y="232" font-size="15" fill="#18202A" text-anchor="start">· VOC 함유기준 준수</text>
  <text x="48" y="274" font-size="15" fill="#18202A" text-anchor="start">· 용기 경고 표지</text>
  <rect x="256" y="60" width="206" height="46" rx="6" fill="#C9D2DB" stroke="#C9D2DB" stroke-width="1.2"/>
  <text x="359" y="90" font-size="16" fill="#18202A" text-anchor="middle" font-weight="700">사용 사업장</text>
  <rect x="256" y="114" width="206" height="196" rx="6" fill="#FFFFFF" stroke="#465260" stroke-width="1.2"/>
  <text x="274" y="148" font-size="15" fill="#18202A" text-anchor="start">· MSDS 게시·교육</text>
  <text x="274" y="190" font-size="15" fill="#18202A" text-anchor="start">· 위험물 저장 기준</text>
  <text x="274" y="232" font-size="15" fill="#18202A" text-anchor="start">· 유해화학물질 취급</text>
  <text x="274" y="274" font-size="15" fill="#18202A" text-anchor="start">· 폐도료 처리</text>
  <rect x="482" y="60" width="206" height="46" rx="6" fill="#E8A23A" stroke="#E8A23A" stroke-width="1.2"/>
  <text x="585" y="90" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700">구매 담당</text>
  <rect x="482" y="114" width="206" height="196" rx="6" fill="#FFFFFF" stroke="#465260" stroke-width="1.2"/>
  <text x="500" y="148" font-size="15" fill="#18202A" text-anchor="start">· 최신 MSDS 받기</text>
  <text x="500" y="190" font-size="15" fill="#18202A" text-anchor="start">· 등록·적합 확인서</text>
  <text x="500" y="232" font-size="15" fill="#18202A" text-anchor="start">· SVHC 함유 정보</text>
  <text x="500" y="274" font-size="15" fill="#18202A" text-anchor="start">· 변경 시 재확인</text>
  <text x="30" y="340" font-size="14" fill="#465260" text-anchor="start">구매 담당 개인의 법적 의무가 아니라, 회사가 의무를 지킬 수 있게 서류를 받는 역할이다 (개념도)</text>

</svg>
