<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16" fill="#18202A">
  <title>로트 추적 사슬: 도료 로트에서 도장 업체 사용 기록, 도장 로트, 부품 로트로 이어지고, 기록이 이어지면 격리 범위가 좁고 끊기면 넓어진다</title>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#465260"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#C4382C"/></marker></defs>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="30" y="34" font-size="17" fill="#18202A" text-anchor="start" font-weight="700">도료 로트 번호 하나로 어느 부품까지 갔는지 거꾸로 찾는다</text>
  <rect x="30" y="76" width="150" height="86" rx="6" fill="#5E8FC9" stroke="#465260" stroke-width="1.2"/>
  <text x="105" y="110" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">도료 로트</text>
  <text x="105" y="138" font-size="14" fill="#FFFFFF" text-anchor="middle">P-2611-07</text>
  <line x1="182" y1="119" x2="200" y2="119" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="202" y="76" width="150" height="86" rx="6" fill="#E4EAE8" stroke="#465260" stroke-width="1.2"/>
  <text x="277" y="110" font-size="15" fill="#18202A" text-anchor="middle" font-weight="700">도장 업체 사용 기록</text>
  <text x="277" y="138" font-size="14" fill="#465260" text-anchor="middle">11/12 2교대 2번 탱크</text>
  <line x1="354" y1="119" x2="372" y2="119" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="374" y="76" width="150" height="86" rx="6" fill="#E4EAE8" stroke="#465260" stroke-width="1.2"/>
  <text x="449" y="110" font-size="15" fill="#18202A" text-anchor="middle" font-weight="700">도장 로트</text>
  <text x="449" y="138" font-size="14" fill="#465260" text-anchor="middle">C-1112-B</text>
  <line x1="526" y1="119" x2="544" y2="119" stroke="#465260" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="546" y="76" width="150" height="86" rx="6" fill="#E4EAE8" stroke="#465260" stroke-width="1.2"/>
  <text x="621" y="110" font-size="15" fill="#18202A" text-anchor="middle" font-weight="700">부품 로트</text>
  <text x="621" y="138" font-size="14" fill="#465260" text-anchor="middle">W-1113-01~03</text>
  <line x1="620" y1="168" x2="110" y2="168" stroke="#C4382C" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="365" y="192" font-size="15" fill="#C4382C" text-anchor="middle" font-weight="700">불량 발견 → 거꾸로 추적 (번호는 가상)</text>
  <rect x="30" y="220" width="315" height="118" rx="6" fill="#FFFFFF" stroke="#465260" stroke-width="1.2"/>
  <text x="46" y="248" font-size="16" fill="#2F8F5B" text-anchor="start" font-weight="700">기록이 이어지면</text>
  <text x="46" y="274" font-size="15" fill="#18202A" text-anchor="start">의심 도료 로트를 쓴 부품만</text>
  <text x="46" y="298" font-size="15" fill="#18202A" text-anchor="start">골라 격리한다</text>
  <text x="46" y="322" font-size="15" fill="#2F8F5B" text-anchor="start">→ 격리 범위 3로트</text>
  <rect x="375" y="220" width="315" height="118" rx="6" fill="#FFFFFF" stroke="#465260" stroke-width="1.2"/>
  <text x="391" y="248" font-size="16" fill="#C4382C" text-anchor="start" font-weight="700">기록이 끊기면</text>
  <text x="391" y="274" font-size="15" fill="#18202A" text-anchor="start">그 기간에 도장한 부품을</text>
  <text x="391" y="298" font-size="15" fill="#18202A" text-anchor="start">모두 의심해야 한다</text>
  <text x="391" y="322" font-size="15" fill="#C4382C" text-anchor="start">→ 격리 범위 2주 생산분</text>

</svg>
