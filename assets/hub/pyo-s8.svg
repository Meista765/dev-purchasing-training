<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="16">
  <title>법랑 단면 — 법랑용 강판 위 거칠어진 밀착 계면, 하유(그라운드 코트), 상유(커버 코트)와 잔 기포(두께 과장 개념도)</title>
  <defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#8D9AA8" stroke-width="1"/></pattern></defs>
  <rect width="100%" height="100%" fill="#FAFCFB"/>
  <text x="24" y="32" font-size="17" font-weight="700" fill="#18202A">법랑 단면 — 강판 위에 유리층 두 겹</text>
  <text x="24" y="54" font-size="14" fill="#465260">두께 과장 개념도 · 두께는 대표값</text>
  <text x="40" y="98" font-size="14" fill="#465260">유리층 전체 대략 100~300μm(용도별)</text>
  <!-- 상유 -->
  <rect x="40" y="110" width="420" height="106" fill="#BFE3DC" stroke="#465260"/>
  <!-- 하유 -->
  <path d="M40,216 L460,216 L460,252 L450,248 L440,254 L430,249 L420,255 L410,248 L400,253 L390,249 L380,255 L370,248 L360,253 L350,249 L340,255 L330,248 L320,253 L310,249 L300,255 L290,248 L280,253 L270,249 L260,255 L250,248 L240,253 L230,249 L220,255 L210,248 L200,253 L190,249 L180,255 L170,248 L160,253 L150,249 L140,255 L130,248 L120,253 L110,249 L100,255 L90,248 L80,253 L70,249 L60,255 L50,248 L40,252 Z" fill="#BFE3DC" stroke="#465260"/>
  <path d="M40,216 L460,216 L460,252 L450,248 L440,254 L430,249 L420,255 L410,248 L400,253 L390,249 L380,255 L370,248 L360,253 L350,249 L340,255 L330,248 L320,253 L310,249 L300,255 L290,248 L280,253 L270,249 L260,255 L250,248 L240,253 L230,249 L220,255 L210,248 L200,253 L190,249 L180,255 L170,248 L160,253 L150,249 L140,255 L130,248 L120,253 L110,249 L100,255 L90,248 L80,253 L70,249 L60,255 L50,248 L40,252 Z" fill="#465260" fill-opacity=".3"/>
  <!-- 강판 -->
  <path d="M40,252 L50,248 L60,255 L70,249 L80,253 L90,248 L100,255 L110,249 L120,253 L130,248 L140,255 L150,249 L160,253 L170,248 L180,255 L190,249 L200,253 L210,248 L220,255 L230,249 L240,253 L250,248 L260,255 L270,249 L280,253 L290,248 L300,255 L310,249 L320,253 L330,248 L340,255 L350,249 L360,253 L370,248 L380,255 L390,249 L400,253 L410,248 L420,255 L430,249 L440,254 L450,248 L460,252 L460,322 L40,322 Z" fill="#C9D2DB" stroke="#465260"/>
  <path d="M40,252 L50,248 L60,255 L70,249 L80,253 L90,248 L100,255 L110,249 L120,253 L130,248 L140,255 L150,249 L160,253 L170,248 L180,255 L190,249 L200,253 L210,248 L220,255 L230,249 L240,253 L250,248 L260,255 L270,249 L280,253 L290,248 L300,255 L310,249 L320,253 L330,248 L340,255 L350,249 L360,253 L370,248 L380,255 L390,249 L400,253 L410,248 L420,255 L430,249 L440,254 L450,248 L460,252 L460,322 L40,322 Z" fill="url(#h)" opacity=".5"/>
  <g fill="#465260"><circle cx="66" cy="250" r="1.8"/><circle cx="124" cy="251" r="1.8"/><circle cx="186" cy="250" r="1.8"/><circle cx="248" cy="251" r="1.8"/><circle cx="312" cy="250" r="1.8"/><circle cx="374" cy="251" r="1.8"/><circle cx="436" cy="250" r="1.8"/></g>
  <!-- 기포 -->
  <g fill="#FAFCFB" stroke="#77838F" stroke-width=".8">
    <circle cx="82" cy="232" r="3.5"/><circle cx="150" cy="238" r="2.5"/><circle cx="214" cy="228" r="3"/><circle cx="286" cy="236" r="3.5"/><circle cx="352" cy="230" r="2.5"/><circle cx="418" cy="238" r="3"/>
    <circle cx="120" cy="170" r="2"/><circle cx="262" cy="150" r="2.4"/><circle cx="380" cy="182" r="2"/>
  </g>
  <line x1="264" y1="146" x2="300" y2="132" stroke="#77838F"/>
  <text x="304" y="136" font-size="14" fill="#465260">잔 기포</text>
  <text x="56" y="296" font-weight="700" fill="#18202A">법랑용 강판</text>
  <!-- 이름표 -->
  <g stroke="#77838F"><line x1="462" y1="160" x2="478" y2="160"/><line x1="462" y1="234" x2="478" y2="234"/><line x1="462" y1="252" x2="478" y2="280"/></g>
  <text x="484" y="152" font-weight="700" fill="#18202A">상유(커버 코트)</text>
  <text x="484" y="172" font-size="14" fill="#465260">색·광택·내약품</text>
  <text x="484" y="190" font-size="14" fill="#465260">약 100μm 안팎(예)</text>
  <text x="484" y="232" font-weight="700" fill="#18202A">하유(그라운드 코트)</text>
  <text x="484" y="252" font-size="14" fill="#465260">밀착 산화물, 수십 μm</text>
  <text x="484" y="284" font-weight="700" fill="#18202A">밀착 계면</text>
  <text x="484" y="304" font-size="14" fill="#465260">거칠어진 강에 유리가 박힘</text>
  <text x="24" y="360" font-size="14" fill="#465260">직접 1회 도포는 하유 없이, 니켈 처리한 탈탄강 위에 상유 한 겹을 입힌다</text>
</svg>
